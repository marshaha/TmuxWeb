# Append to ~/.kimi-code/config.toml (Kimi Code CLI hooks).
# Each [[hooks]] entry takes exactly four fields: event / matcher /
# command / timeout. PermissionRequest is observation-only and
# fail-open; PermissionResult / Stop clear the waiting state.

[[hooks]]
event = "PermissionRequest"
matcher = ""
command = "python3 ~/.config/tmuxweb-agent/hooks/tmuxweb-hook.py PermissionRequest"
timeout = 5

[[hooks]]
event = "PermissionResult"
matcher = ""
command = "python3 ~/.config/tmuxweb-agent/hooks/tmuxweb-hook.py PermissionResult"
timeout = 5

[[hooks]]
event = "Stop"
matcher = ""
command = "python3 ~/.config/tmuxweb-agent/hooks/tmuxweb-hook.py Stop"
timeout = 5
