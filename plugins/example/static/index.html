<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>示例插件 · TmuxWeb</title>
<style>
  :root{--ink:#242421;--muted:#73716b;--line:#dddcd5;--page:#f7f7f5}
  *{box-sizing:border-box}
  body{margin:0;padding:28px 18px;background:var(--page);color:var(--ink);
       font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}
  main{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
  h1{margin:0 0 6px;font:500 20px/1.3 Georgia,serif}
  p{color:var(--muted)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f2f0ea;padding:1px 5px;border-radius:5px}
  a{color:#c96442}
</style></head>
<body><main>
  <h1>示例插件</h1>
  <p>这个页面是从 <code>plugins/example/static/index.html</code> 通过
     <code>/plugin-assets/example/index.html</code> 提供的。</p>
  <p>它同时注册了一个 MCP 工具 <code>example_status</code> 和这个侧边栏按钮——关掉插件，三样东西（页面、按钮、工具）一起消失。</p>
  <p><a href="/">← 回控制台</a></p>
</main></body></html>
