<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TmuxWeb · 主页</title>
<link rel="icon" href="/app-icon.svg" type="image/svg+xml">
<link rel="icon" href="/app-icon-32.png" sizes="32x32" type="image/png">
<style>
  :root{--bg:#F0EEE6;--surface:#FAF9F5;--card:#fff;--ink:#262520;--muted:#6f6a5e;--faint:#a09a8c;--line:#E2DFD5;--accent:#C96442;--green:#3f8f5f;--amber:#D89A3C;--danger:#B4442F;--side-w:268px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
  a{color:inherit}
  .shell{display:flex;min-height:100dvh}
  .sidebar{position:sticky;top:0;display:flex;flex-direction:column;width:var(--side-w);height:100dvh;flex:none;border-right:1px solid var(--line);background:var(--surface)}
  .shell.collapsed .sidebar{display:none}
  .side-head{display:flex;align-items:center;gap:6px;padding:11px 10px 9px}
  .side-head .brand{flex:1;min-width:0}
  .side-head .brand b{font-size:14px;font-weight:650}
  .side-head .brand span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-head .icon-btn{width:26px;height:26px}
  .tree{flex:1;min-height:0;overflow:auto;padding:0 8px 20px;-webkit-overflow-scrolling:touch;scroll-padding-bottom:24px}
  .tree details{border-radius:9px}
  .tree summary{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:8px;color:var(--muted);font-size:12.5px;cursor:pointer;list-style:none;user-select:none}
  .tree summary::-webkit-details-marker{display:none}
  .tree summary:hover{background:rgba(255,255,255,.75);color:var(--ink)}
  .tree summary .caret{width:9px;flex:none;color:var(--faint);font-size:8px;transition:transform .12s}
  .tree details[open]>summary .caret{transform:rotate(90deg)}
  .tree-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree-count{flex:none;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint)}
  .tree-children{padding-left:10px}
  .tpane{display:block;width:100%;padding:6px 7px;margin:1px 0;border:0;border-radius:8px;background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
  .tpane:hover{background:rgba(255,255,255,.85)}
  .trow{display:flex;align-items:center;gap:6px;min-width:0}
  .tstate{width:6px;height:6px;border-radius:50%;flex:none;background:var(--faint)}
  .tstate.idle{background:var(--green)}
  .tstate.busy{background:var(--amber)}
  .tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .tstar{flex:none;display:grid;place-items:center;width:26px;height:26px;margin:-4px -2px -4px 0;border-radius:7px;color:var(--faint);cursor:pointer;opacity:.55;transition:opacity .12s,color .12s,background .12s}
  .tpane:hover .tstar,.tstar.on{opacity:1}
  .tstar:hover{background:rgba(201,100,66,.12);color:var(--accent)}
  .tstar.on{color:var(--accent)}
  .tstar .ico{width:13px;height:13px;stroke-width:1.6}
  .tstar.on .ico{fill:currentColor}
  .tmeta{margin-left:13px;color:var(--faint);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(32,31,28,.3);z-index:15}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .icon-btn{display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;flex:none;text-decoration:none}
  .icon-btn:hover{color:var(--accent);border-color:#d8c4b8}
  .icon-btn[hidden]{display:none}
  header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(250,249,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;margin-right:4px}
  .brand b{font-size:15px;font-weight:650;letter-spacing:.01em}
  .brand span{font-size:11px;color:var(--faint)}
  .search{flex:1 1 240px;display:flex;align-items:center;gap:7px;min-width:0;padding:7px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}
  .search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font:13px inherit}
  .search .ico{color:var(--faint);flex:none}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,100,66,.13)}
  .nav{display:flex;align-items:center;gap:6px;flex:none}
  .nav a,.nav button{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);text-decoration:none;cursor:pointer}
  .nav a:hover,.nav button:hover{color:var(--accent);border-color:#d8c4b8}
  main{width:100%;padding:16px;max-width:1240px;margin:0 auto}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .stat{display:flex;align-items:baseline;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
  .stat b{font-size:15px;font-weight:650}
  .stat span{font-size:11.5px;color:var(--muted)}
  .stat.hot b{color:var(--accent)}
  h2{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.02em}
  h2 .count{padding:1px 7px;border:1px solid var(--line);border-radius:20px;background:var(--surface);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(268px,100%),1fr));gap:11px;width:100%}
  .card{position:relative;display:flex;flex-direction:column;gap:8px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s}
  .card:hover{border-color:#d9c9bd;box-shadow:0 6px 18px rgba(38,37,32,.07);transform:translateY(-1px)}
  .card-top{display:flex;align-items:center;gap:7px;min-width:0}
  .state{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);font-size:10.5px;color:var(--muted);background:var(--surface);flex:none}
  .state i{width:6px;height:6px;border-radius:50%;background:var(--faint);display:block}
  .state.busy{color:#8a5a12;border-color:#eadfc6;background:#fdf6e8}
  .state.busy i{background:var(--amber);animation:pulse 1.2s ease-in-out infinite}
  .state.idle{color:#3b7350;border-color:#d6e6da;background:#f2f8f3}
  .state.idle i{background:var(--green)}
  .state.offline{color:#8d4a3a;border-color:#eed6cf;background:#fbf1ee}
  .state.offline i{background:var(--danger)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .kind{padding:1px 7px;border-radius:20px;border:1px solid var(--line);font-size:10.5px;color:var(--muted);background:var(--surface);flex:none}
  .kind.result{color:#3b7350;border-color:#d6e6da;background:#f2f8f3}
  .kind.alert{color:#8d4a3a;border-color:#eed6cf;background:#fbf1ee}
  .kind.link{color:#3d5f8a;border-color:#d5e0ee;background:#f1f6fc}
  .card-title{font-size:14px;font-weight:600;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .card-meta{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .preview{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;white-space:pre-wrap;word-break:break-word}
  .preview b{color:var(--ink);font-weight:600}
  .card-body{margin:0;color:var(--muted);font-size:12.5px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;word-break:break-word}
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:2px;color:var(--faint);font-size:11px}
  .card-foot .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-btn{display:grid;place-items:center;width:26px;height:26px;padding:0;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--faint);cursor:pointer;flex:none}
  .card-btn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .card-btn.star{color:var(--accent)}
  .card-btn.star .ico{fill:currentColor;stroke-width:1.4}
  .empty{padding:26px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:var(--surface);font-size:13px;text-align:center}
  .empty b{display:block;margin-bottom:3px;color:var(--ink);font-weight:600}
  #results{display:none}
  body.searching #board{display:none}
  body.searching #results{display:block}
  .search-mode{margin:0 0 10px;color:var(--faint);font-size:11.5px}
  .search-mode b{color:var(--muted)}
  .host-hit{cursor:default}
  .host-hit:hover{border-color:var(--line)}
  .hit{padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer}
  .hit:hover{border-color:#d9c9bd}
  .hit-top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint);margin-bottom:4px}
  .hit-title{font-size:13px;font-weight:600}
  .hit-snippet{font-size:12.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
  mark{padding:0 2px;border-radius:3px;background:#f7e2d6;color:#8a3d22}
  .hover-preview{pointer-events:auto;overscroll-behavior:contain;scrollbar-width:thin;position:fixed;z-index:30;width:min(520px,calc(100vw - 24px));max-height:min(62vh,520px);display:flex;flex-direction:column;
    padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 16px 44px rgba(32,31,28,.18)}
  .hover-preview[hidden]{display:none}
  .hp-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:var(--faint)}
  .hp-head #hp-role{padding:1px 7px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:10.5px}
  .hp-body{overflow:auto;min-height:0;font-size:12.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word;overscroll-behavior:contain}
  .preview-drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;width:min(760px,56vw);
    min-width:360px;border-left:1px solid var(--line);background:var(--bg);box-shadow:-16px 0 48px rgba(32,31,28,.16);
    transform:translateX(12px);opacity:0;transition:transform .16s ease,opacity .16s ease}
  .preview-drawer.open{transform:none;opacity:1}
  .preview-drawer[hidden]{display:none}
  .pd-head{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
  .pd-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
  .pd-head iframe{flex:1}
  #pd-frame{flex:1;width:100%;min-height:0;border:0;background:var(--bg)}
  .pd-backdrop{position:fixed;inset:0;z-index:35;background:rgba(32,31,28,.18)}
  .pd-backdrop[hidden]{display:none}
  .rename-dialog{width:min(430px,calc(100vw - 28px));padding:0;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);box-shadow:0 18px 50px rgba(32,31,28,.18)}
  .rename-dialog::backdrop{background:rgba(32,31,28,.28)}
  .rename-dialog form{display:grid;gap:10px;padding:18px}
  .rename-dialog h2{margin:0;font-size:15px;font-weight:650;color:var(--ink)}
  .dialog-sub{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5;word-break:break-word}
  .rename-dialog input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:13px inherit}
  .rename-dialog input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,100,66,.15)}
  .rename-actions{display:flex;align-items:center;gap:8px;margin-top:2px}
  .chip-btn{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:12.5px;cursor:pointer}
  .chip-btn:hover{border-color:#d8c4b8;color:var(--accent)}
  .chip-btn.primary{background:#292825;border-color:#292825;color:#fff}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);padding:9px 15px;border-radius:10px;background:#292825;color:#fff;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;max-width:88vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .sidebar{position:relative}
  .side-resizer{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:6;touch-action:none}
  .side-resizer::after{content:"";position:absolute;top:0;right:0;width:2px;height:100%;background:transparent;transition:background .12s}
  .side-resizer:hover::after,body.resizing .side-resizer::after{background:#b9b4a8}
  body.resizing{user-select:none;cursor:col-resize}
  body.resizing .app,body.resizing .shell{transition:none}
  @media (max-width:860px){
    .sidebar{position:fixed;top:0;left:0;z-index:20;width:min(86vw,320px);transform:translateX(-100%);transition:transform .18s ease;box-shadow:6px 0 24px rgba(38,37,32,.12)}
    .side-resizer{display:none}
    .shell.collapsed .sidebar{display:flex}
    .shell.mobile-open .sidebar{transform:none}
    .shell.mobile-open .backdrop{display:block}
  }
  @media (max-width:600px){
    header.top{padding:10px 12px;gap:8px}
    .brand{flex:1 1 auto}
    .search{order:3;flex:1 1 100%}
    main{padding:12px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4.6 2.4 5 5.5.8-4 3.9.9 5.5-4.8-2.6-4.8 2.6.9-5.5-4-3.9 5.5-.8z"/></symbol>

  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4.2v4.4h-4.4"/></symbol>

<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand"><b>会话</b><span id="side-count">载入中…</span></div>
      <a class="icon-btn" href="/" title="控制台" aria-label="控制台"><svg class="ico"><use href="#i-console"/></svg></a>
      <a class="icon-btn" href="/hosts" title="远程主机" aria-label="远程主机"><svg class="ico"><use href="#i-server"/></svg></a>
      <a class="icon-btn" href="/shares" title="管理分享" aria-label="管理分享"><svg class="ico"><use href="#i-share"/></svg></a>
      <button class="icon-btn" id="reload" title="刷新" aria-label="刷新"><svg class="ico"><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" id="side-collapse" title="折叠侧边栏" aria-label="折叠侧边栏"><svg class="ico"><use href="#i-collapse"/></svg></button>
    </div>
    <nav class="tree" id="tree" aria-label="会话树"></nav>
    <div class="side-resizer" id="side-resizer" title="拖动调整侧边栏宽度（双击恢复默认）"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="content">
<header class="top">
  <button class="icon-btn" id="side-open" title="显示会话列表" aria-label="显示会话列表" hidden><svg class="ico"><use href="#i-menu"/></svg></button>
  <div class="brand"><b>TmuxWeb 主页</b><span>收藏的会话 · 看板 · 搜索</span></div>
  <label class="search"><svg class="ico"><use href="#i-search"/></svg><input id="q" type="search" placeholder="搜索服务器 / session / pane（支持正则），以及最近对话内容…" spellcheck="false" autocomplete="off"></label>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div id="board">
    <h2>收藏 <span class="count" id="fav-count">0</span></h2>
    <div class="grid" id="favorites"></div>
    <h2>看板卡片 <span class="count" id="card-count">0</span></h2>
    <div class="grid" id="cards"></div>
  </div>
  <div id="results"></div>
</main>
  </div>
</div>
<dialog class="rename-dialog" id="rename-dialog">
  <form method="dialog" id="rename-form">
    <h2 id="rename-head">修改卡片名</h2>
    <p class="dialog-sub" id="rename-sub"></p>
    <input type="text" id="rename-input" maxlength="200" spellcheck="false" autocomplete="off" placeholder="留空 = 恢复默认（session · window · 主机）">
    <div class="rename-actions">
      <button type="button" class="chip-btn" id="rename-reset">恢复默认</button>
      <span style="flex:1"></span>
      <button type="button" class="chip-btn" id="rename-cancel">取消</button>
      <button type="submit" class="chip-btn primary" id="rename-save">保存</button>
    </div>
  </form>
</dialog>
<aside class="preview-drawer" id="preview-drawer" hidden aria-label="对话完整预览">
  <div class="pd-head">
    <span class="pd-title" id="pd-title">对话预览</span>
    <a class="card-btn" id="pd-console" href="/" title="在控制台打开" aria-label="在控制台打开"><svg class="ico"><use href="#i-console"/></svg></a>
    <button class="card-btn" id="pd-close" title="关闭预览" aria-label="关闭预览"><svg class="ico"><use href="#i-close"/></svg></button>
  </div>
  <iframe id="pd-frame" title="对话预览" referrerpolicy="same-origin"></iframe>
</aside>
<div class="pd-backdrop" id="pd-backdrop" hidden></div>
<div class="hover-preview" id="hover-preview" hidden>
  <div class="hp-head"><span id="hp-role">agent</span><span id="hp-time"></span></div>
  <div class="hp-body" id="hp-body"></div>
</div>
<div class="toast" id="toast"></div>

<script>
  const $=id=>document.getElementById(id);
  const state={board:null,favorites:new Set(),query:'',timer:null,seq:0,hosts:[],states:new Map(),treeOpen:new Set(),treeReady:false};
  const SIDEBAR_KEY='tmux-home-sidebar';
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}
  async function api(url,opts={}){const r=await fetch(url,opts);if(r.status===401){location='/login';throw new Error('登录已失效');}if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||`HTTP ${r.status}`);}return r.json();}
  function ago(ts){if(!ts)return '';const seconds=(Date.now()/1000)-Number(ts);if(!isFinite(seconds)||seconds<0)return '';if(seconds<60)return '刚刚';if(seconds<3600)return `${Math.floor(seconds/60)} 分钟前`;if(seconds<86400)return `${Math.floor(seconds/3600)} 小时前`;return `${Math.floor(seconds/86400)} 天前`;}
  const STATE_TEXT={busy:'busy',idle:'idle',unknown:'未知',offline:'离线'};
  function stateBadge(status,waiting){
    const key=STATE_TEXT[status]?status:'unknown';
    const label=waiting&&key==='busy'?'思考中…':STATE_TEXT[key]||key;
    return `<span class="state ${key}"><i></i>${esc(label)}</span>`;
  }
  function consoleUrl(pane){return `/?pane=${encodeURIComponent(pane)}`;}

  // ---------------------------------------------------------------- sidebar
  const isNarrow=()=>window.matchMedia('(max-width:860px)').matches;
  function applySidebar(){
    const shell=$('shell');
    const collapsed=localStorage.getItem(SIDEBAR_KEY)==='0';
    shell.classList.toggle('collapsed',collapsed);
    shell.classList.remove('mobile-open');
    $('side-open').hidden=!(collapsed||isNarrow());
  }
  function toggleSidebar(){
    const shell=$('shell');
    if(isNarrow()){shell.classList.toggle('mobile-open');return;}
    const collapsed=!shell.classList.contains('collapsed');
    shell.classList.toggle('collapsed',collapsed);
    localStorage.setItem(SIDEBAR_KEY,collapsed?'0':'1');
    $('side-open').hidden=!collapsed;
  }

  function treeDetails(key,label,children,count,pad){
    const open=(state.treeOpen.size?state.treeOpen.has(key):true)?' open':'';
    return `<details data-tree="${esc(key)}"${open}><summary><span class="caret">▶</span>`
      +`<span class="tree-label" style="padding-left:${pad}px">${esc(label)}</span>`
      +`<span class="tree-count">${count}</span></summary><div class="tree-children">${children}</div></details>`;
  }

  /** Reflect the favourite set on the existing rows without re-rendering the
   *  tree: a background refresh that replaces the DOM swallows clicks and
   *  resets the scroll position. */
  function syncStars(){
    document.querySelectorAll('#tree [data-pane]').forEach(button=>{
      const star=button.querySelector('[data-star]');
      if(!star)return;
      const starred=state.favorites.has(button.dataset.pane);
      star.classList.toggle('on',starred);
      star.title=starred?'取消收藏':'收藏到主页';
      const use=star.querySelector('use');
      if(use)use.setAttribute('href',starred?'#i-star-fill':'#i-star');
    });
  }

  function paneRow(pane){
    const status=state.states.get(pane.id)||'unknown';
    const starred=state.favorites.has(pane.id);
    const name=pane.title||`pane ${pane.index??''} · ${pane.command||''}`;
    return `<button class="tpane" data-pane="${esc(pane.id)}" title="${esc(pane.path||'')}">`
      +`<span class="trow"><span class="tstate ${esc(status)}"></span><span class="tname">${esc(name)}</span>`
      +`<span class="tstar ${starred?'on':''}" data-star="${esc(pane.id)}" role="button" tabindex="-1" title="${starred?'取消收藏':'收藏到主页'}">`
      +`<svg class="ico"><use href="#i-${starred?'star-fill':'star'}"/></svg></span></span>`
      +`<span class="tmeta">${esc([pane.command,pane.session].filter(Boolean).join(' · '))}</span></button>`;
  }

  function renderTree(){
    const tree=$('tree');
    if(!state.hosts.length){tree.innerHTML='<div class="empty" style="margin:10px;padding:14px;font-size:12px">还没有会话</div>';return;}
    tree.innerHTML=state.hosts.map(host=>{
      const sessions=new Map();
      for(const pane of host.panes||[]){
        const skey=pane.session||'default';
        if(!sessions.has(skey))sessions.set(skey,new Map());
        const windows=sessions.get(skey),wkey=`${pane.window}:${pane.window_name||''}`;
        if(!windows.has(wkey))windows.set(wkey,[]);
        windows.get(wkey).push(pane);
      }
      const sessionHtml=[...sessions].map(([session,windows])=>{
        const windowHtml=[...windows].map(([wkey,panes])=>{
          const first=panes[0];
          const label=`${first.window??''}${first.window_name?': '+first.window_name:''}`;
          return treeDetails(`${host.id}/${session}/${wkey}`,label,panes.map(paneRow).join(''),panes.length,8);
        }).join('');
        return treeDetails(`${host.id}/${session}`,session,windowHtml,`${windows.size}`,4);
      }).join('');
      return treeDetails(host.id,host.name||host.id,sessionHtml,(host.panes||[]).length,0);
    }).join('');
    const panes=state.hosts.reduce((total,host)=>total+(host.panes||[]).length,0);
    $('side-count').textContent=`${panes} panes`;
    $('side-count').title=`${state.hosts.length} 台主机 · ${panes} 个 pane`;
  }

  async function loadTree(){
    try{
      const data=await api('/api/hosts');
      state.hosts=data.hosts||[];
      renderTree();
      loadFavorites().catch(()=>{});
      refreshStates().catch(()=>{});
    }catch(err){toast(err.message);}
  }

  async function refreshStates(){
    try{
      const data=await api('/api/panes/status');
      state.states=new Map((data.panes||[]).map(item=>[item.id,item.status]));
      document.querySelectorAll('#tree [data-pane]').forEach(button=>{
        const dot=button.querySelector('.tstate');
        if(dot)dot.className='tstate '+(state.states.get(button.dataset.pane)||'unknown');
      });
    }catch{}
  }

  async function loadFavorites(){
    try{
      const data=await api('/api/home/favorites');
      state.favorites=new Set(data.favorites||[]);
      if(state.treeReady)syncStars();
    }catch{}
  }

  async function toggleFavorite(paneId){
    const starred=state.favorites.has(paneId);
    try{
      if(starred){
        await api(`/api/home/favorites/${encodeURIComponent(paneId)}`,{method:'DELETE'});
        state.favorites.delete(paneId);
      }else{
        await api('/api/home/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pane:paneId})});
        state.favorites.add(paneId);
      }
      syncStars();
      toast(starred?'已取消收藏':'已收藏到主页');
      await load();
    }catch(err){toast(err.message);}
  }

  async function load(){
    try{
      const board=await api('/api/home');
      state.board=board;
      state.favorites=new Set((board.favorites||[]).map(f=>f.pane));
      if(state.treeReady)syncStars();
      render();
    }catch(err){toast(err.message);}
  }

  function render(){
    const board=state.board;if(!board)return;
    const stats=board.stats||{};
    // the pane sweep runs in the background on the server: show a dash until it lands
    const known=(stats.panes||0)>0;
    const show=value=>known?`${value||0}`:'—';
    $('stats').innerHTML=[
      [show(stats.panes),'panes'], [show(stats.busy),'busy'], [show(stats.idle),'idle'],
      [`${stats.favorites||0}`,'收藏'], [`${stats.cards||0}`,'看板卡片'],
    ].map(([value,label])=>`<div class="stat${label==='busy'&&value!=='0'&&value!=='—'?' hot':''}"><b>${esc(value)}</b><span>${esc(label)}</span></div>`).join('');
    if(!known&&!state.retryTimer){state.retryTimer=setTimeout(()=>{state.retryTimer=null;load();},4000);}

    const favorites=board.favorites||[];
    $('fav-count').textContent=`${favorites.length}`;
    $('favorites').innerHTML=favorites.length?favorites.map(card).join(''):'<div class="empty"><b>还没有收藏的会话</b>在控制台左侧列表里点 pane 右侧的空心五角星，就能把它放到这里。</div>';

    const cards=board.cards||[];
    $('card-count').textContent=`${cards.length}`;
    $('cards').innerHTML=cards.length?cards.map(cardHtml).join(''):'<div class="empty"><b>看板是空的</b>在任意 agent pane 里让模型调用 MCP 工具 publish_home_card，就能把结论贴到这里。</div>';
    state.treeReady=true;
  }

  function card(favorite){
    const pane=favorite.pane;
    const preview=favorite.preview;
    const meta=[favorite.session,favorite.window].filter(Boolean).join(' · ')||pane;
    return `<article class="card" data-open="${esc(pane)}">
      <div class="card-top">${stateBadge(favorite.status,favorite.waiting)}
        ${favorite.provider?`<span class="kind">${esc(favorite.provider)}</span>`:''}
        <span class="card-meta" style="margin-left:auto">${esc(ago(favorite.preview&&favorite.preview.timestamp))}</span>
        <button class="card-btn" data-full="${esc(pane)}" title="完整预览对话" aria-label="完整预览对话"><svg class="ico"><use href="#i-expand"/></svg></button>
        <button class="card-btn" data-rename="${esc(pane)}" title="修改卡片名" aria-label="修改卡片名"><svg class="ico"><use href="#i-pencil"/></svg></button>
        <button class="card-btn star" data-unfav="${esc(pane)}" title="取消收藏" aria-label="取消收藏"><svg class="ico"><use href="#i-star"/></svg></button>
      </div>
      <div class="card-title">${esc(favorite.title||favorite.default_title||favorite.pane_title||meta)}</div>
      <div class="card-meta">${esc([favorite.host,favorite.session,favorite.window].filter(Boolean).join(' · ')||favorite.path||meta)}</div>
      ${preview?`<p class="preview"><b>${esc(preview.role||'')}</b> ${esc(preview.text)}</p>`:'<p class="preview" style="color:var(--faint)">还没有对话内容</p>'}
      <div class="card-foot"><span class="grow">${esc(pane)}</span><span>${esc(favorite.command||'')}</span></div>
    </article>`;
  }

  function cardHtml(card){
    return `<article class="card" ${card.pane_id?`data-open="${esc(card.pane_id)}"`:''}>
      <div class="card-top"><span class="kind ${esc(card.kind)}">${esc(card.kind)}</span>
        <span class="card-meta" style="margin-left:auto">${esc(ago(card.created_at))}</span>
        <button class="card-btn" data-del="${esc(card.id)}" title="删除卡片" aria-label="删除卡片"><svg class="ico"><use href="#i-trash"/></svg></button>
      </div>
      <div class="card-title">${esc(card.title)}</div>
      ${card.body?`<p class="card-body">${esc(card.body)}</p>`:''}
      <div class="card-foot"><span class="grow">${esc(card.pane_id||'来自 MCP')}</span></div>
    </article>`;
  }

  function highlight(text,query){
    const safe=esc(text);
    if(!query)return safe;
    const needle=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return safe.replace(new RegExp(needle,'gi'),match=>`<mark>${match}</mark>`);
  }

  async function search(){
    const query=state.query.trim();
    if(!query){document.body.classList.remove('searching');$('results').innerHTML='';return;}
    const seq=++state.seq;
    document.body.classList.add('searching');
    $('results').innerHTML='<h2>搜索 <span class="count">…</span></h2><div class="empty">正在搜索服务器、session 与 pane…</div>';
    try{
      // names first: that answer is instant. Conversations need one transcript
      // read per agent pane, so they arrive in a second pass.
      const names=await api(`/api/home/search?q=${encodeURIComponent(query)}&messages=0`);
      if(seq!==state.seq)return;
      renderSearch(names,query);
      const full=await api(`/api/home/search?q=${encodeURIComponent(query)}&messages=1`);
      if(seq!==state.seq)return;
      renderSearch(full,query);
    }catch(err){toast(err.message);}
  }

  function renderSearch(data,query){
    {
      const hosts=data.hosts||[],sessions=data.sessions||[],panes=data.panes||[],
            messages=data.messages||[],cards=data.cards||[];
      const modeNote=data.mode==='regex'?'正则':(data.mode==='literal-fallback'?'正则无效，已按字面匹配':'字面匹配');
      const extras=[data.indexing?'会话索引正在建立，几秒后再搜一次':'',
                    data.messages_pending?'对话搜索中…':(data.messages_partial?'对话还在扫，结果可能不全':'')]
                    .filter(Boolean).join(' · ');
      let html=`<div class="search-mode">匹配方式：${modeNote} · 先匹配主机 / session / pane，再看最近的对话${extras?' · '+extras:''}</div>`;
      html+=`<h2>服务器 <span class="count">${hosts.length}</span></h2>`;
      html+=hosts.length?hosts.map(h=>`<div class="hit host-hit">
        <div class="hit-top"><span class="kind">server</span><span>${hosts.length?esc(h.hostname):''}:${Number(h.port)}</span><span>${h.panes||0} panes</span></div>
        <div class="hit-title">${highlight(h.name,query)}</div></div>`).join(''):'<div class="empty">没有命中的服务器</div>';
      html+=`<h2>tmux session <span class="count">${sessions.length}</span></h2>`;
      html+=sessions.length?sessions.map(s=>`<div class="hit host-hit">
        <div class="hit-top"><span class="kind">session</span><span>${esc(s.host||'')}</span><span>${s.panes||0} panes</span></div>
        <div class="hit-title">${highlight(s.session,query)}</div></div>`).join(''):'<div class="empty">没有命中的 session</div>';
      html+=`<h2>pane <span class="count">${panes.length}</span></h2>`;
      html+=panes.length?panes.map(p=>`<div class="hit" data-open="${esc(p.id)}">
        <div class="hit-top">${stateBadge(p.status)}${p.provider?`<span>${esc(p.provider)}</span>`:''}<span>${esc(p.host_name||'')}</span><span>${esc(p.session||'')}</span></div>
        <div class="hit-title">${highlight(p.title||p.target||p.id,query)}</div>
        <div class="hit-snippet">${highlight(p.path||'',query)}</div></div>`).join(''):'<div class="empty">没有命中的 pane</div>';
      html+=`<h2>对话内容 <span class="count">${messages.length}</span></h2>`;
      html+=messages.length?messages.map(m=>`<div class="hit" data-open="${esc(m.pane)}">
        <div class="hit-top"><span>${esc(m.role||'')}</span><span>${esc(m.host||'')}</span><span>${esc(m.session||m.title||m.pane)}</span></div>
        <div class="hit-snippet">${highlight(m.snippet||'',query)}</div></div>`).join(''):'<div class="empty">最近对话里没有命中</div>';
      if(cards.length){
        html+=`<h2>看板卡片 <span class="count">${cards.length}</span></h2>`;
        html+=cards.map(c=>`<div class="hit" ${c.pane_id?`data-open="${esc(c.pane_id)}"`:''}>
          <div class="hit-top"><span class="kind ${esc(c.kind)}">${esc(c.kind)}</span></div>
          <div class="hit-title">${highlight(c.title,query)}</div>
          <div class="hit-snippet">${highlight((c.body||'').slice(0,300),query)}</div></div>`).join('');
      }
      $('results').innerHTML=html;
    }
  }

  document.addEventListener('click',async event=>{
    const star=event.target.closest('[data-star]');
    if(star){event.preventDefault();event.stopPropagation();toggleFavorite(star.dataset.star);return;}
    const unfav=event.target.closest('[data-unfav]');
    if(unfav){
      event.preventDefault();event.stopPropagation();
      try{
        await api(`/api/home/favorites/${encodeURIComponent(unfav.dataset.unfav)}`,{method:'DELETE'});
        toast('已取消收藏');
        load();
      }catch(err){toast(err.message);}
      return;
    }
    const del=event.target.closest('[data-del]');
    if(del){
      event.preventDefault();event.stopPropagation();
      try{
        await api(`/api/home/cards/${encodeURIComponent(del.dataset.del)}`,{method:'DELETE'});
        toast('卡片已删除');
        load();
      }catch(err){toast(err.message);}
      return;
    }
    const rename=event.target.closest('[data-rename]');
    if(rename){event.preventDefault();event.stopPropagation();openRename(rename.dataset.rename);return;}
    const full=event.target.closest('[data-full]');
    if(full){event.preventDefault();event.stopPropagation();openFullPreview(full.dataset.full);return;}
    const pane=event.target.closest('[data-pane]');
    if(pane){location=consoleUrl(pane.dataset.pane);return;}
    const open=event.target.closest('[data-open]');
    if(open){location=consoleUrl(open.dataset.open);}
  });

  // ---------------------------------------------------------------- full preview
  const drawer=$('preview-drawer'), drawerFrame=$('pd-frame'), drawerBackdrop=$('pd-backdrop');
  const PREVIEW_WIDE=1100;   // narrower than this: navigate to the page so the back gesture works
  let drawerPane=null;

  function openFullPreview(paneId){
    hideHover();
    if(window.innerWidth<PREVIEW_WIDE){location.href=`/preview?pane=${encodeURIComponent(paneId)}`;return;}
    const favorite=(state.board&&state.board.favorites||[]).find(item=>item.pane===paneId);
    drawerPane=paneId;
    $('pd-title').textContent=favorite?favorite.title||favorite.pane_title||paneId:paneId;
    $('pd-console').href=consoleUrl(paneId);
    drawerFrame.src=`/preview?pane=${encodeURIComponent(paneId)}`;
    drawer.hidden=false;
    requestAnimationFrame(()=>drawer.classList.add('open'));
    drawerBackdrop.hidden=false;
    document.body.classList.add('drawer-open');
  }
  function closeFullPreview(){
    if(drawer.hidden)return;
    drawer.classList.remove('open');
    drawerBackdrop.hidden=true;
    document.body.classList.remove('drawer-open');
    setTimeout(()=>{drawer.hidden=true;drawerFrame.src='about:blank';drawerPane=null;},160);
  }
  $('pd-close').onclick=closeFullPreview;
  drawerBackdrop.onclick=closeFullPreview;
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!drawer.hidden)closeFullPreview();});

  // ---------------------------------------------------------------- rename a card
  let renameTarget=null;
  function openRename(paneId){
    const favorite=(state.board&&state.board.favorites||[]).find(item=>item.pane===paneId);
    if(!favorite)return;
    renameTarget=paneId;
    $('rename-input').value=favorite.custom_title?favorite.title:'';
    $('rename-input').placeholder=favorite.default_title||'留空 = 恢复默认';
    $('rename-sub').textContent=`默认：${favorite.default_title||paneId}　·　${paneId}`;
    $('rename-dialog').showModal();
    $('rename-input').focus();
    $('rename-input').select();
  }
  async function saveRename(title){
    if(!renameTarget)return;
    const paneId=renameTarget;
    try{
      await api(`/api/home/favorites/${encodeURIComponent(paneId)}`,{
        method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.trim()}),
      });
      $('rename-dialog').close();
      renameTarget=null;
      toast(title.trim()?'卡片名已更新':'已恢复默认名');
      load();
    }catch(err){toast(err.message);}
  }
  $('rename-form').addEventListener('submit',event=>{event.preventDefault();saveRename($('rename-input').value);});
  $('rename-cancel').onclick=()=>{$('rename-dialog').close();renameTarget=null;};
  $('rename-reset').onclick=()=>{$('rename-input').value='';saveRename('');};

  // ---------------------------------------------------------------- hover preview
  const hoverBox=$('hover-preview');
  let hoverPane=null;

  function agentPreview(paneId){
    const favorite=(state.board&&state.board.favorites||[]).find(item=>item.pane===paneId);
    return favorite&&favorite.agent_preview?favorite.agent_preview:null;
  }

  function placeHover(card){
    const rect=card.getBoundingClientRect();
    const viewportW=window.innerWidth, viewportH=window.innerHeight;
    const width=Math.min(520,viewportW-24);
    hoverBox.style.width=width+'px';
    // prefer the right of the card, fall back to the left, then keep it on screen
    let left=rect.right+12;
    if(left+width>viewportW-12)left=Math.max(12,rect.left-width-12);
    const height=Math.min(hoverBox.scrollHeight||260,viewportH*0.62);
    const top=Math.min(Math.max(12,rect.top),Math.max(12,viewportH-height-12));
    hoverBox.style.left=left+'px';
    hoverBox.style.top=top+'px';
  }

  let hoverHideTimer=null;
  function scheduleHideHover(){clearTimeout(hoverHideTimer);hoverHideTimer=setTimeout(hideHover,260);}
  function cancelHideHover(){clearTimeout(hoverHideTimer);hoverHideTimer=null;}

  function showHover(card,paneId){
    const preview=agentPreview(paneId);
    if(!preview)return;
    cancelHideHover();
    hoverPane=paneId;
    $('hp-role').textContent=preview.role==='assistant'?'agent 回复':preview.role;
    $('hp-time').textContent=[ago(preview.timestamp),preview.truncated?'已截断':''].filter(Boolean).join(' · ');
    $('hp-body').textContent=preview.text;
    hoverBox.hidden=false;
    placeHover(card);
  }

  function hideHover(){hoverBox.hidden=true;hoverPane=null;}

  document.addEventListener('mouseover',event=>{
    const card=event.target.closest('.card[data-open]');
    if(!card||!agentPreview(card.dataset.open))return;
    if(hoverPane===card.dataset.open&&!hoverBox.hidden)return;
    showHover(card,card.dataset.open);
  });
  document.addEventListener('mouseout',event=>{
    const card=event.target.closest('.card[data-open]');
    if(!card)return;
    if(event.relatedTarget&&(card.contains(event.relatedTarget)||hoverBox.contains(event.relatedTarget)))return;
    scheduleHideHover();
  });
  // the panel is interactive: you can move the pointer onto it and scroll it
  hoverBox.addEventListener('mouseenter',cancelHideHover);
  hoverBox.addEventListener('mouseleave',scheduleHideHover);
  window.addEventListener('scroll',event=>{if(!hoverBox.contains(event.target))hideHover();},{passive:true});
  window.addEventListener('resize',hideHover);

  // remember which tree branches are open
  $('tree').addEventListener('toggle',event=>{
    const details=event.target.closest('details[data-tree]');
    if(!details)return;
    details.open?state.treeOpen.add(details.dataset.tree):state.treeOpen.delete(details.dataset.tree);
  },true);

  $('side-collapse').onclick=()=>{
    if(isNarrow()){$('shell').classList.remove('mobile-open');return;}
    toggleSidebar();
  };
  $('side-open').onclick=toggleSidebar;
  $('backdrop').onclick=()=>$('shell').classList.remove('mobile-open');
  window.addEventListener('resize',()=>{
    if(!isNarrow())$('shell').classList.remove('mobile-open');
    $('side-open').hidden=!($('shell').classList.contains('collapsed')||isNarrow());
  });

  $('q').addEventListener('input',event=>{
    state.query=event.target.value;
    clearTimeout(state.timer);
    state.timer=setTimeout(search,280);
  });
  $('q').addEventListener('keydown',event=>{if(event.key==='Escape'){event.target.value='';state.query='';search();}});
  $('reload').onclick=()=>{load();loadTree();if(state.query.trim())search();};

  applySidebar();
  loadTree();
  load();
  setInterval(()=>{if(document.hidden)return;load();refreshStates();},15000);
(function initSidebarResize(){
  const KEY = 'tmux-home-side-w', DEFAULT = 268, MIN = 200;
  const handle = document.getElementById('side-resizer');
  const bar = document.getElementById('sidebar');
  if(!handle || !bar) return;
  const root = document.documentElement;
  const clamp = width => Math.max(MIN, Math.min(Math.min(640, Math.round(window.innerWidth * 0.6)), Math.round(width)));
  const apply = (width, save) => {
    const value = clamp(width);
    root.style.setProperty('--side-w', value + 'px');
    if(save){try{localStorage.setItem(KEY, String(value));}catch{}}
  };
  let saved = 0;
  try{saved = parseInt(localStorage.getItem(KEY) || '', 10);}catch{}
  if(saved) apply(saved, false);
  let dragging = false, startX = 0, startWidth = 0;
  handle.addEventListener('pointerdown', event => {
    if(event.button !== 0) return;
    event.preventDefault();
    dragging = true;
    startX = event.clientX;
    startWidth = bar.getBoundingClientRect().width;
    handle.setPointerCapture(event.pointerId);
    document.body.classList.add('resizing');
  });
  handle.addEventListener('pointermove', event => {
    if(dragging) apply(startWidth + (event.clientX - startX), false);
  });
  const finish = event => {
    if(!dragging) return;
    dragging = false;
    if(event && event.pointerId != null && handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
    document.body.classList.remove('resizing');
    apply(bar.getBoundingClientRect().width, true);
  };
  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', finish);
  handle.addEventListener('dblclick', () => apply(DEFAULT, true));
  window.addEventListener('resize', () => apply(bar.getBoundingClientRect().width, false));
})();

</script>
