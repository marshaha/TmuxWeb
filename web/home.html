<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TmuxWeb · 主页</title>
<link rel="icon" href="/app-icon.svg" type="image/svg+xml">
<link rel="icon" href="/app-icon-32.png" sizes="32x32" type="image/png">
<style>
  :root{--bg:#F0EEE6;--surface:#FAF9F5;--card:#fff;--ink:#262520;--muted:#6f6a5e;--faint:#a09a8c;--line:#E2DFD5;--accent:#C96442;--green:#3f8f5f;--amber:#D89A3C;--danger:#B4442F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
  a{color:inherit}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(250,249,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;margin-right:4px}
  .brand b{font-size:15px;font-weight:650;letter-spacing:.01em}
  .brand span{font-size:11px;color:var(--faint)}
  .search{flex:1 1 240px;display:flex;align-items:center;gap:7px;min-width:0;padding:7px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}
  .search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font:13px inherit}
  .search .ico{color:var(--faint);flex:none}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,100,66,.13)}
  .nav{display:flex;align-items:center;gap:6px;flex:none}
  .nav a,.nav button{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);text-decoration:none;cursor:pointer}
  .nav a:hover,.nav button:hover{color:var(--accent);border-color:#d8c4b8}
  main{padding:16px;max-width:1240px;margin:0 auto}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .stat{display:flex;align-items:baseline;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
  .stat b{font-size:15px;font-weight:650}
  .stat span{font-size:11.5px;color:var(--muted)}
  .stat.hot b{color:var(--accent)}
  h2{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.02em}
  h2 .count{padding:1px 7px;border:1px solid var(--line);border-radius:20px;background:var(--surface);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
  .card{position:relative;display:flex;flex-direction:column;gap:8px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s}
  .card:hover{border-color:#d9c9bd;box-shadow:0 6px 18px rgba(38,37,32,.07);transform:translateY(-1px)}
  .card-top{display:flex;align-items:center;gap:7px;min-width:0}
  .state{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);font-size:10.5px;color:var(--muted);background:var(--surface);flex:none}
  .state i{width:6px;height:6px;border-radius:50%;background:var(--faint);display:block}
  .state.busy{color:#8a5a12;border-color:#eadfc6;background:#fdf6e8}
  .state.busy i{background:var(--amber);animation:pulse 1.2s ease-in-out infinite}
  .state.idle{color:#3b7350;border-color:#d6e6da;background:#f2f8f3}
  .state.idle i{background:var(--green)}
  .state.offline{color:#8d4a3a;border-color:#eed6cf;background:#fbf1ee}
  .state.offline i{background:var(--danger)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .kind{padding:1px 7px;border-radius:20px;border:1px solid var(--line);font-size:10.5px;color:var(--muted);background:var(--surface);flex:none}
  .kind.result{color:#3b7350;border-color:#d6e6da;background:#f2f8f3}
  .kind.alert{color:#8d4a3a;border-color:#eed6cf;background:#fbf1ee}
  .kind.link{color:#3d5f8a;border-color:#d5e0ee;background:#f1f6fc}
  .card-title{font-size:14px;font-weight:600;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .card-meta{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .preview{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;white-space:pre-wrap;word-break:break-word}
  .preview b{color:var(--ink);font-weight:600}
  .card-body{margin:0;color:var(--muted);font-size:12.5px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;word-break:break-word}
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:2px;color:var(--faint);font-size:11px}
  .card-foot .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-btn{display:grid;place-items:center;width:26px;height:26px;padding:0;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--faint);cursor:pointer;flex:none}
  .card-btn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .card-btn.star{color:var(--accent)}
  .card-btn.star .ico{fill:currentColor;stroke-width:1.4}
  .empty{padding:26px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:var(--surface);font-size:13px;text-align:center}
  .empty b{display:block;margin-bottom:3px;color:var(--ink);font-weight:600}
  #results{display:none}
  body.searching #board{display:none}
  body.searching #results{display:block}
  .hit{padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer}
  .hit:hover{border-color:#d9c9bd}
  .hit-top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint);margin-bottom:4px}
  .hit-title{font-size:13px;font-weight:600}
  .hit-snippet{font-size:12.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
  mark{padding:0 2px;border-radius:3px;background:#f7e2d6;color:#8a3d22}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);padding:9px 15px;border-radius:10px;background:#292825;color:#fff;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;max-width:88vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:600px){
    header{padding:10px 12px;gap:8px}
    .brand{flex:1 1 auto}
    .search{order:3;flex:1 1 100%}
    main{padding:12px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4.6 2.4 5 5.5.8-4 3.9.9 5.5-4.8-2.6-4.8 2.6.9-5.5-4-3.9 5.5-.8z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4.5 10.6 12 4.4l7.5 6.2V19a1.4 1.4 0 0 1-1.4 1.4H6a1.4 1.4 0 0 1-1.5-1.4z"/><path d="M9.7 20.4v-6h4.6v6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.3"/><path d="m15.7 15.7 4 4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4.2v4.4h-4.4"/></symbol>
  <symbol id="i-console" viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="14.8" rx="2.4"/><path d="m7.4 9.4 2.6 2.6-2.6 2.6M12.6 14.8h4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M8 16 16.2 7.8M10.4 7.8h5.8v5.8"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="6.2" rx="1.8"/><rect x="3.5" y="13.3" width="17" height="6.2" rx="1.8"/><path d="M7.2 7.6h.01M7.2 16.4h.01"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5.5 7.5h13M9.5 7.5V5.6h5v1.9M7.4 7.5l.8 11.1h7.6l.8-11.1"/></symbol>
</defs></svg>

<header>
  <div class="brand"><b>TmuxWeb 主页</b><span>收藏的会话 · 看板 · 搜索</span></div>
  <label class="search"><svg class="ico"><use href="#i-search"/></svg><input id="q" type="search" placeholder="搜索 pane 名、路径、最近对话内容…" spellcheck="false" autocomplete="off"></label>
  <div class="nav">
    <a href="/" title="回到控制台" aria-label="控制台"><svg class="ico"><use href="#i-console"/></svg></a>
    <a href="/hosts" title="远程主机" aria-label="远程主机"><svg class="ico"><use href="#i-server"/></svg></a>
    <a href="/shares" title="管理分享" aria-label="管理分享"><svg class="ico"><use href="#i-share"/></svg></a>
    <button id="reload" title="刷新" aria-label="刷新"><svg class="ico"><use href="#i-refresh"/></svg></button>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div id="board">
    <h2>收藏 <span class="count" id="fav-count">0</span></h2>
    <div class="grid" id="favorites"></div>
    <h2>看板卡片 <span class="count" id="card-count">0</span></h2>
    <div class="grid" id="cards"></div>
  </div>
  <div id="results"></div>
</main>
<div class="toast" id="toast"></div>

<script>
  const $=id=>document.getElementById(id);
  const state={board:null,favorites:new Set(),query:'',timer:null,seq:0};
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}
  async function api(url,opts={}){const r=await fetch(url,opts);if(r.status===401){location='/login';throw new Error('登录已失效');}if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||`HTTP ${r.status}`);}return r.json();}
  function ago(ts){if(!ts)return '';const seconds=(Date.now()/1000)-Number(ts);if(!isFinite(seconds)||seconds<0)return '';if(seconds<60)return '刚刚';if(seconds<3600)return `${Math.floor(seconds/60)} 分钟前`;if(seconds<86400)return `${Math.floor(seconds/3600)} 小时前`;return `${Math.floor(seconds/86400)} 天前`;}
  const STATE_TEXT={busy:'busy',idle:'idle',unknown:'未知',offline:'离线'};
  function stateBadge(status,waiting){
    const key=STATE_TEXT[status]?status:'unknown';
    const label=waiting&&key==='busy'?'思考中…':STATE_TEXT[key]||key;
    return `<span class="state ${key}"><i></i>${esc(label)}</span>`;
  }
  function consoleUrl(pane){return `/?pane=${encodeURIComponent(pane)}`;}

  async function load(){
    try{
      const board=await api('/api/home');
      state.board=board;
      state.favorites=new Set((board.favorites||[]).map(f=>f.pane));
      render();
    }catch(err){toast(err.message);}
  }

  function render(){
    const board=state.board;if(!board)return;
    const stats=board.stats||{};
    $('stats').innerHTML=[
      [`${stats.panes||0}`,'panes'], [`${stats.busy||0}`,'busy'], [`${stats.idle||0}`,'idle'],
      [`${stats.favorites||0}`,'收藏'], [`${stats.cards||0}`,'看板卡片'],
    ].map(([value,label])=>`<div class="stat${label==='busy'&&value!=='0'?' hot':''}"><b>${esc(value)}</b><span>${esc(label)}</span></div>`).join('');

    const favorites=board.favorites||[];
    $('fav-count').textContent=`${favorites.length}`;
    $('favorites').innerHTML=favorites.length?favorites.map(card).join(''):'<div class="empty"><b>还没有收藏的会话</b>在控制台左侧列表里点 pane 右侧的空心五角星，就能把它放到这里。</div>';

    const cards=board.cards||[];
    $('card-count').textContent=`${cards.length}`;
    $('cards').innerHTML=cards.length?cards.map(cardHtml).join(''):'<div class="empty"><b>看板是空的</b>在任意 agent pane 里让模型调用 MCP 工具 publish_home_card，就能把结论贴到这里。</div>';
  }

  function card(favorite){
    const pane=favorite.pane;
    const preview=favorite.preview;
    const meta=[favorite.session,favorite.window].filter(Boolean).join(' · ')||pane;
    return `<article class="card" data-open="${esc(pane)}">
      <div class="card-top">${stateBadge(favorite.status,favorite.waiting)}
        ${favorite.provider?`<span class="kind">${esc(favorite.provider)}</span>`:''}
        <span class="card-meta" style="margin-left:auto">${esc(ago(favorite.preview&&favorite.preview.timestamp))}</span>
        <button class="card-btn star" data-unfav="${esc(pane)}" title="取消收藏" aria-label="取消收藏"><svg class="ico"><use href="#i-star"/></svg></button>
      </div>
      <div class="card-title">${esc(favorite.title||meta)}</div>
      <div class="card-meta">${esc(favorite.path||meta)}</div>
      ${preview?`<p class="preview"><b>${esc(preview.role||'')}</b> ${esc(preview.text)}</p>`:'<p class="preview" style="color:var(--faint)">还没有对话内容</p>'}
      <div class="card-foot"><span class="grow">${esc(pane)}</span><span>${esc(favorite.command||'')}</span></div>
    </article>`;
  }

  function cardHtml(card){
    return `<article class="card" ${card.pane_id?`data-open="${esc(card.pane_id)}"`:''}>
      <div class="card-top"><span class="kind ${esc(card.kind)}">${esc(card.kind)}</span>
        <span class="card-meta" style="margin-left:auto">${esc(ago(card.created_at))}</span>
        <button class="card-btn" data-del="${esc(card.id)}" title="删除卡片" aria-label="删除卡片"><svg class="ico"><use href="#i-trash"/></svg></button>
      </div>
      <div class="card-title">${esc(card.title)}</div>
      ${card.body?`<p class="card-body">${esc(card.body)}</p>`:''}
      <div class="card-foot"><span class="grow">${esc(card.pane_id||'来自 MCP')}</span></div>
    </article>`;
  }

  function highlight(text,query){
    const safe=esc(text);
    if(!query)return safe;
    const needle=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return safe.replace(new RegExp(needle,'gi'),match=>`<mark>${match}</mark>`);
  }

  async function search(){
    const query=state.query.trim();
    if(!query){document.body.classList.remove('searching');$('results').innerHTML='';return;}
    const seq=++state.seq;
    try{
      const data=await api(`/api/home/search?q=${encodeURIComponent(query)}`);
      if(seq!==state.seq)return;
      document.body.classList.add('searching');
      const panes=data.panes||[],messages=data.messages||[],cards=data.cards||[];
      let html=`<h2>会话匹配 <span class="count">${panes.length}</span></h2>`;
      html+=panes.length?panes.map(p=>`<div class="hit" data-open="${esc(p.id)}">
        <div class="hit-top">${stateBadge(p.status)}${p.provider?`<span>${esc(p.provider)}</span>`:''}<span>${esc(p.host_name||'')}</span></div>
        <div class="hit-title">${highlight(p.title||p.target||p.id,query)}</div>
        <div class="hit-snippet">${highlight(p.path||'',query)}</div></div>`).join(''):'<div class="empty">没有命中的 pane</div>';
      html+=`<h2>对话内容 <span class="count">${messages.length}</span></h2>`;
      html+=messages.length?messages.map(m=>`<div class="hit" data-open="${esc(m.pane)}">
        <div class="hit-top"><span>${esc(m.role||'')}</span><span>${esc(m.title||m.pane)}</span></div>
        <div class="hit-snippet">${highlight(m.snippet||'',query)}</div></div>`).join(''):'<div class="empty">最近对话里没有命中</div>';
      if(cards.length){
        html+=`<h2>看板卡片 <span class="count">${cards.length}</span></h2>`;
        html+=cards.map(c=>`<div class="hit" ${c.pane_id?`data-open="${esc(c.pane_id)}"`:''}>
          <div class="hit-top"><span class="kind ${esc(c.kind)}">${esc(c.kind)}</span></div>
          <div class="hit-title">${highlight(c.title,query)}</div>
          <div class="hit-snippet">${highlight((c.body||'').slice(0,300),query)}</div></div>`).join('');
      }
      $('results').innerHTML=html;
    }catch(err){toast(err.message);}
  }

  document.addEventListener('click',async event=>{
    const unfav=event.target.closest('[data-unfav]');
    if(unfav){
      event.preventDefault();event.stopPropagation();
      try{
        await api(`/api/home/favorites/${encodeURIComponent(unfav.dataset.unfav)}`,{method:'DELETE'});
        toast('已取消收藏');
        load();
      }catch(err){toast(err.message);}
      return;
    }
    const del=event.target.closest('[data-del]');
    if(del){
      event.preventDefault();event.stopPropagation();
      try{
        await api(`/api/home/cards/${encodeURIComponent(del.dataset.del)}`,{method:'DELETE'});
        toast('卡片已删除');
        load();
      }catch(err){toast(err.message);}
      return;
    }
    const open=event.target.closest('[data-open]');
    if(open){location=consoleUrl(open.dataset.open);}
  });

  $('q').addEventListener('input',event=>{
    state.query=event.target.value;
    clearTimeout(state.timer);
    state.timer=setTimeout(search,280);
  });
  $('q').addEventListener('keydown',event=>{if(event.key==='Escape'){event.target.value='';state.query='';search();}});
  $('reload').onclick=()=>{load();if(state.query.trim())search();};

  load();
  setInterval(()=>{if(document.hidden)return;load();},15000);
</script>
</body>
</html>
