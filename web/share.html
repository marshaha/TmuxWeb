<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tmux Chat"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml"><link rel="icon" href="/assets/app-icon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/assets/app-icon-180.png">
  
  <title>__SHARE_TITLE__ · Shared Chat</title>
  <style>
    :root{--page:#f7f7f5;--ink:#242421;--muted:#73716b;--line:#dddcd5;--accent:#c96442;--green:#4f9a65;--danger:#b34b43}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--page);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr) 126px}.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.title{min-width:0;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{flex:none;margin-left:12px;padding:4px 8px;border-radius:999px;background:#e8e6de;color:var(--muted);font-size:11px}.scroll{overflow:auto;padding:22px 0}.messages{width:min(calc(100% - 28px),900px);margin:auto}.message{display:flex;margin-bottom:16px}.message.user{justify-content:flex-end}.bubble{max-width:min(82%,720px);padding:11px 15px;border-radius:17px;background:#e9e7df;white-space:pre-wrap;overflow-wrap:anywhere}.assistant .bubble{max-width:min(94%,820px);background:#fff;border:1px solid #e1dfd7;white-space:normal}.markdown>*:first-child{margin-top:0}.markdown>*:last-child{margin-bottom:0}.markdown p{margin:0 0 10px}.markdown pre{max-width:100%;overflow:auto;padding:13px;border-radius:10px;background:#272622;color:#f5f4ed;white-space:pre}.markdown code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.markdown :not(pre)>code{padding:2px 5px;border-radius:5px;background:#eceae3}.markdown table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:12px 0;font-size:13px}.markdown th,.markdown td{padding:7px 10px;border:1px solid #d1cfc6;text-align:left;vertical-align:top;white-space:normal}.markdown th{background:#eceae3}.markdown blockquote{margin-left:0;padding-left:13px;border-left:3px solid var(--accent);color:var(--muted)}.pending{font-size:10px;color:var(--muted);margin:3px 7px}.pending.ok{color:var(--green)}.pending.fail{color:var(--danger)}.composer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.card{position:relative;width:min(100%,820px);height:100%;margin:auto;padding:10px 54px 10px 12px;border:1px solid #cbc9c0;border-radius:17px;background:#fff}.card textarea{width:100%;height:62px;border:0;outline:0;resize:none;background:transparent;font:16px/1.45 inherit}.send{position:absolute;right:10px;bottom:12px;width:38px;height:38px;border:0;border-radius:50%;background:#292825;color:#fff;font-size:18px}.send:disabled{opacity:.4}.login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:var(--page)}.login[hidden]{display:none}.login-card{width:min(100%,380px);padding:24px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 12px 40px #00000012}.login-card h1{margin:0 0 5px;font-size:21px}.login-card p{margin:0 0 18px;color:var(--muted)}.login-card input{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:11px;font:16px inherit}.login-card button{width:100%;height:44px;margin-top:10px;border:0;border-radius:11px;background:#292825;color:#fff}.error{min-height:20px;color:var(--danger);font-size:12px}@media(max-width:760px){.app{grid-template-rows:52px minmax(0,1fr) 116px}.top{padding:0 12px}.scroll{padding:14px 0}.messages{width:calc(100% - 22px)}.bubble{max-width:88%;padding:10px 13px}.assistant .bubble{max-width:95%}.composer{padding-left:10px;padding-right:10px}}
  .screen{margin:0;padding:12px;border:1px solid var(--line,#dddcd5);border-radius:10px;background:#fff;color:#242421;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:70vh;overflow:auto}
.card.readonly{display:grid;place-items:center;padding:10px;color:var(--muted);font-size:13px}.badge.readonly{background:#f6e7e0;color:#a3502f}

    /* iOS zooms the page when a field under 16px takes focus and never zooms back out */
    @media(max-width:760px){input,textarea,select{font-size:16px!important}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="title">__SHARE_TITLE__</div><span class="badge">共享会话</span></header>
  <main class="scroll" id="scroll"><div class="messages" id="messages"></div></main>
  <section class="composer" id="composer"><div class="card"><textarea id="input" placeholder="继续提问…"></textarea><button class="send" id="send">↑</button></div></section>
</div>
<div class="login" id="login" hidden><form class="login-card" id="login-form"><h1>访问共享对话</h1><p>输入分享密码后继续查看和提问。</p><input id="password" type="password" autocomplete="current-password" placeholder="分享密码"><button>进入对话</button><div class="error" id="login-error"></div></form></div>
<script type="module">
import {marked} from '/share-assets/marked.esm.js';
(()=>{
  const slug=__SHARE_SLUG__,initiallyUnlocked=__SHARE_UNLOCKED__,allowInput=__SHARE_ALLOW_INPUT__,$=id=>document.getElementById(id),messages=$('messages'),scroll=$('scroll'),input=$('input'),send=$('send');let lastMtime=null,timer=null,pending=[];
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  marked.use({renderer:{html(token){return esc(String(token&&(token.text!=null?token.text:token.raw)||''));}}});
  const markdown=text=>marked.parse(String(text==null?'':text),{gfm:true,breaks:false,async:false});
  function setScreenMode(){const field=document.getElementById('input');
    if(field)field.placeholder='在终端中输入…';}
  function renderScreen(text){messages.innerHTML=`<article class="message assistant"><div><pre class="screen">${esc(text||'')}</pre></div></article>`;scroll.scrollTop=scroll.scrollHeight;}
  function render(list){messages.innerHTML=list.map(m=>`<article class="message ${m.role}"><div><div class="bubble ${m.role==='assistant'?'markdown':''}">${m.role==='assistant'?markdown(m.text):esc(m.text)}</div>${m.status?`<div class="pending ${m.status==='已发送 ✓'?'ok':m.status==='发送失败'?'fail':''}">${m.status}</div>`:''}</div></article>`).join('')+pending.map(m=>`<article class="message user"><div><div class="bubble">${esc(m.text)}</div><div class="pending ${m.status==='已发送 ✓'?'ok':m.status==='发送失败'?'fail':''}">${m.status}</div></div></article>`).join('');scroll.scrollTop=scroll.scrollHeight;}
  async function refresh(){try{const r=await fetch(`/share/${encodeURIComponent(slug)}/api/transcript?limit=300`,{cache:'no-store'});if(r.status===401){$('login').hidden=false;return;}if(r.status===410){messages.innerHTML='<p>此分享已过期或被撤销。</p>';return;}if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();if(d.mode==='screen'){setScreenMode();if(d.mtime!==lastMtime){lastMtime=d.mtime;renderScreen(d.content);}timer=setTimeout(refresh,1000);return;}if(d.mtime!==lastMtime){lastMtime=d.mtime;pending=pending.filter(p=>!d.messages.some(m=>m.role==='user'&&String(m.text).includes(p.text)));render(d.messages);}timer=setTimeout(refresh,1000);}catch(e){timer=setTimeout(refresh,2000);}}
  async function sendMessage(){if(!allowInput)return;const text=input.value;if(!text.trim())return;input.value='';const item={text,status:'发送中 …'};pending.push(item);render([]);send.disabled=true;try{const r=await fetch(`/share/${encodeURIComponent(slug)}/api/input`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,submit:true})});if(!r.ok)throw new Error(`HTTP ${r.status}`);item.status='已发送 ✓';}catch(e){item.status='发送失败';}finally{send.disabled=false;render([]);}}
  $('login-form').onsubmit=async e=>{e.preventDefault();const body=new URLSearchParams({password:$('password').value});const r=await fetch(`/share/${encodeURIComponent(slug)}/login`,{method:'POST',body,redirect:'manual'});if(r.status===401){$('login-error').textContent='密码错误';return;}location.reload();};send.onclick=sendMessage;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(min-width:761px)').matches){e.preventDefault();sendMessage();}};if(!allowInput){const composer=$('composer');if(composer)composer.innerHTML='<div class="card readonly">只读分享：可以查看内容，但不能发送消息。</div>';const badge=document.querySelector('.badge');if(badge){badge.textContent='只读';badge.classList.add('readonly');}input.disabled=true;send.disabled=true;}
if(!initiallyUnlocked)$('login').hidden=false;else refresh();
})();
</script>
</body>
</html>
