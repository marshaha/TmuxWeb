<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tmux Chat"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml"><link rel="icon" href="/assets/app-icon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/assets/app-icon-180.png">
  
  <title>__SHARE_TITLE__ · Shared Chat</title>
  <style>
    :root{--page:#f7f7f5;--ink:#242421;--muted:#73716b;--line:#dddcd5;--accent:#c96442;--green:#4f9a65;--danger:#b34b43;--card:#fff;--card-hover:#f3f2ed;--bubble:#e9e7df;--line-strong:#cbc9c0;--shimmer:var(--card-hover);--bg:#f7f7f5}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--page);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr) 126px}.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.title{min-width:0;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{flex:none;margin-left:12px;padding:4px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:11px}.scroll{overflow:auto;padding:22px 0}.messages{width:min(calc(100% - 28px),900px);margin:auto}.message{display:flex;margin-bottom:16px}.message.user{justify-content:flex-end}.bubble{max-width:min(82%,720px);padding:11px 15px;border-radius:17px;background:var(--bubble);white-space:pre-wrap;overflow-wrap:anywhere}.assistant .bubble{max-width:min(94%,820px);background:var(--card);border:1px solid #e1dfd7;white-space:normal}.markdown>*:first-child{margin-top:0}.markdown>*:last-child{margin-bottom:0}.markdown p{margin:0 0 10px}.markdown pre{max-width:100%;overflow:auto;padding:13px;border-radius:10px;background:#272622;color:#f5f4ed;white-space:pre}.markdown code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.markdown :not(pre)>code{padding:2px 5px;border-radius:5px;background:var(--surface2,#f4f3ee)}.markdown table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:12px 0;font-size:13px}.markdown th,.markdown td{padding:7px 10px;border:1px solid #d1cfc6;text-align:left;vertical-align:top;white-space:normal}.markdown th{background:var(--surface2,#f4f3ee)}.markdown blockquote{margin-left:0;padding-left:13px;border-left:3px solid var(--accent);color:var(--muted)}.pending{font-size:10px;color:var(--muted);margin:3px 7px}.pending.ok{color:var(--green)}.pending.fail{color:var(--danger)}.composer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.card{position:relative;width:min(100%,820px);height:100%;margin:auto;padding:10px 54px 10px 12px;border:1px solid var(--line-strong);border-radius:17px;background:var(--card)}.card textarea{width:100%;height:62px;border:0;outline:0;resize:none;background:transparent;font:16px/1.45 inherit}.send{position:absolute;right:10px;bottom:12px;width:38px;height:38px;border:0;border-radius:50%;background:#292825;color:#fff;font-size:18px}.send:disabled{opacity:.4}.login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:var(--page)}.login[hidden]{display:none}.login-card{width:min(100%,380px);padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 12px 40px #00000012}.login-card h1{margin:0 0 5px;font-size:21px}.login-card p{margin:0 0 18px;color:var(--muted)}.login-card input{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:11px;font:16px inherit}.login-card button{width:100%;height:44px;margin-top:10px;border:0;border-radius:11px;background:#292825;color:#fff}.error{min-height:20px;color:var(--danger);font-size:12px}@media(max-width:760px){.app{grid-template-rows:52px minmax(0,1fr) 116px}.top{padding:0 12px}.scroll{padding:14px 0}.messages{width:calc(100% - 22px)}.bubble{max-width:88%;padding:10px 13px}.assistant .bubble{max-width:95%}.composer{padding-left:10px;padding-right:10px}}
  .screen{margin:0;padding:12px;border:1px solid var(--line,#dddcd5);border-radius:10px;background:var(--card);color:#242421;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:70vh;overflow:auto}
.card.readonly{display:grid;place-items:center;padding:10px;color:var(--muted);font-size:13px}.badge.readonly{background:color-mix(in srgb,var(--danger) 12%,var(--card));color:#a3502f}

    /* iOS zooms the page when a field under 16px takes focus and never zooms back out */
    @media(max-width:760px){input,textarea,select{font-size:16px!important}}
      .app{grid-template-rows:auto minmax(0,1fr) auto}.top{min-height:58px;flex-wrap:wrap;gap:6px;padding-block:7px}.title{flex:1}.tools,.terminal-keys{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
    .tools button,.tools select,.terminal-keys button{max-width:100%;min-width:0;min-height:32px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);padding:3px 8px;font:inherit;overflow-wrap:anywhere}
    .tools select{max-width:min(190px,85vw)}.tools button[aria-pressed=true]{border-color:var(--accent)}[hidden]{display:none!important}
    .terminal-pane{margin:0;padding:12px;white-space:pre;overflow:auto;width:100%;height:100%;color:var(--ink);background:var(--card);font:13px/1.45 ui-monospace,monospace}
    .terminal-keys{margin:5px auto;max-width:900px;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain}.terminal-keys button{flex:none;white-space:nowrap}.composer{min-width:0}.share-note{flex-basis:100%;overflow-wrap:anywhere;font-size:12px;color:var(--muted)}
  </style>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/theme.js"></script>
</head>
<body>
<div class="app">
  <header class="top"><div class="title">__SHARE_TITLE__</div><span class="badge">共享会话</span><div class="tools"><button id="terminal-mode" type="button" aria-pressed="false" hidden>终端</button><button id="choose-model" type="button" hidden>切换模型</button><select id="model-options" aria-label="选择模型" hidden></select></div><div id="share-note" class="share-note" role="status" hidden></div></header>
  <main class="scroll" id="scroll"><div class="messages" id="messages"></div><pre class="terminal-pane" id="terminal-screen" tabindex="0" aria-label="共享终端" aria-description="Shift 加 Escape 返回终端切换按钮" hidden></pre></main>
  <section class="composer" id="composer"><div class="terminal-keys" id="terminal-keys" aria-label="终端按键" hidden></div><div class="card"><textarea id="input" placeholder="继续提问…"></textarea><button class="send" id="send">↑</button></div></section>
</div>
<div class="login" id="login" hidden><form class="login-card" id="login-form"><h1>访问共享对话</h1><p>输入分享密码后继续查看和提问。</p><input id="password" type="password" autocomplete="current-password" placeholder="分享密码"><button>进入对话</button><div class="error" id="login-error"></div></form></div>
<script type="module">
import {marked} from '/share-assets/marked.esm.js';
(()=>{
  const slug=__SHARE_SLUG__,initiallyUnlocked=__SHARE_UNLOCKED__,allowInput=__SHARE_ALLOW_INPUT__,$=id=>document.getElementById(id),messages=$('messages'),scroll=$('scroll'),input=$('input'),send=$('send');let lastMtime=null,timer=null,pending=[];
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  marked.use({renderer:{html(token){return esc(String(token&&(token.text!=null?token.text:token.raw)||''));}}});
  const markdown=text=>marked.parse(String(text==null?'':text),{gfm:true,breaks:false,async:false});
  const allowModel=__SHARE_MODEL__,allowTerminal=__SHARE_TERMINAL__;
  const screen=$('terminal-screen'),modeButton=$('terminal-mode'),modelButton=$('choose-model'),modelOptions=$('model-options');
  let terminalMode=false,generation=0,keys=Promise.resolve(),lastMessages=[],signature='';
  function note(text){$('share-note').textContent=text;$('share-note').hidden=!text;}
  async function sharedApi(action,body){
    const r=await fetch('/share/'+encodeURIComponent(slug)+'/api/'+action,body===undefined?{cache:'no-store'}:
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){if(r.status===401)$('login').hidden=false;throw Object.assign(new Error(d.detail||'读取失败'),{status:r.status});}
    return d;
  }
  function setMode(on){
    clearTimeout(timer);generation++;terminalMode=on;modeButton.setAttribute('aria-pressed',String(on));
    modeButton.textContent=on?'返回聊天':'终端';messages.hidden=on;screen.hidden=!on;
    if(allowInput)$('terminal-keys').hidden=!on;
    note('');lastMtime=null;signature='';input.placeholder=on?'输入到此窗格…':'继续提问…';
    if(on){screen.textContent='正在读取终端…';screen.focus();}refresh();
  }
  modeButton.hidden=!allowTerminal;modeButton.onclick=()=>setMode(!terminalMode);
  modelButton.hidden=!allowModel;
  modelButton.onclick=async()=>{
    if(!modelOptions.hidden){modelOptions.hidden=true;return;}
    modelButton.disabled=true;note('');
    try{
      const d=await sharedApi('models');modelOptions.replaceChildren(new Option('选择模型',''));
      const append=(model,provider)=>modelOptions.add(new Option((provider?provider+' · ':'')+model,JSON.stringify({model,provider})));
      if(!d.picker_only){
        if(d.groups.length){for(const group of d.groups)for(const model of group.models)append(model,group.provider);}
        else for(const model of d.presets)append(model,'');
      }
      if(allowTerminal&&allowInput)modelOptions.add(new Option('打开原生模型菜单',JSON.stringify({model:''})));
      if(modelOptions.length===1)note('此会话没有可直接选择的模型。原生菜单需要终端和输入权限。');
      else{modelOptions.hidden=false;modelOptions.focus();if(d.current)note('当前模型 · '+d.current);}
    }catch(error){note(error.message);}finally{modelButton.disabled=false;}
  };
  modelOptions.onchange=async()=>{
    if(!modelOptions.value)return;
    const choice=JSON.parse(modelOptions.value);modelOptions.disabled=true;
    try{await sharedApi('model',choice);modelOptions.hidden=true;if(!choice.model)setMode(true);else note('已发送模型切换命令 · '+choice.model);}
    catch(error){note(error.message);}finally{modelOptions.disabled=false;modelOptions.selectedIndex=0;}
  };
  const keyMap={ArrowUp:'Up',ArrowDown:'Down',ArrowLeft:'Left',ArrowRight:'Right',Enter:'Enter',Escape:'Escape',Tab:'Tab',' ':'Space'};
  function sendKey(key){const active=generation;keys=keys.then(async()=>{
    if(!terminalMode||active!==generation)return;
    try{await sharedApi('terminal/key',{key});}catch(error){note(error.message);}
  });}
  if(allowInput&&allowTerminal){
    for(const [label,key] of [['↑','Up'],['↓','Down'],['←','Left'],['→','Right'],['Tab','Tab'],['Esc','Escape'],['Enter','Enter']]){
      const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>sendKey(key);$('terminal-keys').append(b);
    }
    screen.onkeydown=e=>{
      if(e.shiftKey&&e.key==='Escape'){e.preventDefault();modeButton.focus();return;}
      if(e.isComposing||e.altKey||e.metaKey)return;
      const key=e.ctrlKey?(['c','d','q','u'].includes(e.key)?'C-'+e.key:null):
        e.key==='Tab'?(e.shiftKey?'BTab':'Tab'):keyMap[e.key]||(/^[A-Za-z0-9]$/.test(e.key)?e.key:null);
      if(key){e.preventDefault();sendKey(key);}
    };
  }
  function setScreenMode(){const field=document.getElementById('input');
    if(field)field.placeholder='在终端中输入…';}
  function renderScreen(text){messages.innerHTML=`<article class="message assistant"><div><pre class="screen">${esc(text||'')}</pre></div></article>`;scroll.scrollTop=scroll.scrollHeight;}
  function render(list){
    const rows=list.concat(pending.map(p=>({...p,role:'user'}))).slice(-500);
    // Keep every message; large tables can otherwise exhaust the page's DOM budget.
    let richBudget=8500;
    messages.innerHTML=rows.map(m=>{
      const role=m.role==='assistant'?'assistant':'user';
      let body=esc(m.text||'');
      if(role==='assistant' && richBudget>0){
        const html=markdown(m.text),elements=(html.match(/<[a-z][^>]*>/gi)||[]).length;
        if(elements<=richBudget){body=html;richBudget-=elements;}
      }
      const status=m.status?'<div class="pending '+pendingClass(m.status)+'">'+esc(m.status)+'</div>':'';
      return '<article class="message '+role+'"><div><div class="bubble '+(role==='assistant'?'markdown':'')+'">'+body+'</div>'+status+'</div></article>';
    }).join('');scroll.scrollTop=scroll.scrollHeight;
  }
  function changedPermissions(d){
    return d && (Boolean(d.allow_input)!==allowInput||Boolean(d.allow_model_switch)!==allowModel||Boolean(d.allow_terminal)!==allowTerminal);
  }
  async function refresh(){
    const active=generation;
    try{
      const d=await sharedApi(terminalMode?'terminal':'transcript?limit=500&sig='+encodeURIComponent(signature));
      if(active!==generation)return;
      if(changedPermissions(d.permissions)){location.reload();return;}
      if(d.unchanged){timer=setTimeout(refresh,1000);return;}
      const changed=Boolean(d.signature&&d.signature!==signature);
      signature=d.signature||'';
      applyResend(d);
      if(terminalMode){if(screen.textContent!==d.content)screen.textContent=d.content||'';}
      else if(d.mode==='screen'){setScreenMode();if(d.mtime!==lastMtime){lastMtime=d.mtime;renderScreen(d.content);}}
      else{if(changed||d.mtime!==lastMtime||lastMtime==null){lastMtime=d.mtime;lastMessages=d.messages||[];
        pending=pending.filter(p=>!lastMessages.some(m=>m.role==='user'&&String(m.text).includes(p.text)));render(lastMessages);}}
      timer=setTimeout(refresh,1000);
    }catch(e){
      if(active!==generation)return;
      if(e.status===403){try{if(changedPermissions(await sharedApi('meta'))){location.reload();return;}}catch{}}
      if([401,403,409,410].includes(e.status)){note(e.message);screen.textContent='';messages.replaceChildren();return;}
      note(e.message);timer=setTimeout(refresh,2500);
    }
  }
  // 和主页同一份映射：后台重试的终态 → 待发送项该变成什么。
  function resendAction(resend){
    if(!resend||!resend.status)return null;
    if(resend.status==='submitted')return 'sent';
    if(resend.status==='failed'||resend.status==='superseded')return 'failed';
    return null;
  }
  function applyResend(d){
    const action=resendAction(d&&d.resend);
    if(!action||d.mode==='screen')return;
    let changed=false;
    for(const item of pending){
      if(item.status!=='正在重试提交…')continue;
      item.status=action==='failed'?'已粘贴但未提交':'已发送 ✓';
      changed=true;
    }
    if(changed)render(d.messages||[]);
  }
  function inputResultText(result){return result&&result.status==='pasted_not_submitted'?'已粘贴但未提交':result&&(result.status==='retrying'||result.retrying)?'正在重试提交…':'已发送 ✓';}
  function pendingClass(s){return s==='已发送 ✓'?'ok':(s==='发送失败'||s==='已粘贴但未提交')?'fail':'';}
  async function sendMessage(){
    if(!allowInput||send.disabled)return;
    const text=input.value;
    if(!text.trim())return;
    const terminal=terminalMode,active=generation;
    input.value='';send.disabled=true;
    const item={text,status:'发送中 …'};
    if(!terminal){pending.push(item);render(lastMessages);}
    try{
      let result;
      if(terminal){
        const write=keys.then(()=>{
          if(active!==generation)throw new Error('已离开终端');
          return sharedApi('terminal/input',{text,submit:true});
        });
        keys=write.catch(()=>{});
        result=await write;
        note(inputResultText(result));
      }else result=await sharedApi('input',{text,submit:true});
      item.status=inputResultText(result);
    }catch(e){item.status='发送失败';note(e.message);if(!input.value)input.value=text;}
    finally{send.disabled=false;if(!terminal)render(lastMessages);}
  }
  $('login-form').onsubmit=async e=>{e.preventDefault();const body=new URLSearchParams({password:$('password').value});const r=await fetch(`/share/${encodeURIComponent(slug)}/login`,{method:'POST',body,redirect:'manual'});if(r.status===401){$('login-error').textContent='密码错误';return;}location.reload();};send.onclick=sendMessage;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(min-width:761px)').matches){e.preventDefault();sendMessage();}};if(!allowInput){const composer=$('composer');if(composer)composer.innerHTML='<div class="card readonly">此分享未开放文字输入。</div>';const badge=document.querySelector('.badge');if(badge){badge.textContent=allowModel?'可切换模型':'只读';if(!allowModel)badge.classList.add('readonly');}input.disabled=true;send.disabled=true;}
if(!initiallyUnlocked)$('login').hidden=false;else refresh();
})();
</script>
</body>
</html>
