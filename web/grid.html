<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tmux Chat">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/shell.css">
<link rel="stylesheet" href="/assets/recents.css">
  <link rel="icon" href="/assets/app-icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/app-icon-180.png">
  <title>多窗口 · TmuxWeb</title>
  <style>
    :root{color-scheme:light;--page:#f7f7f5;--surface:#fff;--surface2:#f4f3ee;--ink:#242421;--muted:#73716b;--faint:#a09d95;--line:#dddcd5;--accent:#c96442;--green:#4f9a65;--amber:#d89a3c;--danger:#b34b43;--side-w:268px}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--page);color:var(--ink);
      font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;overflow:hidden;height:100dvh}
    /* 外壳必须正好一屏：body 是 overflow:hidden，用 min-height 的话内容一高，
       .grid 的 overflow 永远不触发（手机竖屏两格就只能看到最后一格、滑不动） */
    .shell{height:100dvh;min-height:0;overflow:hidden}
    .main{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
    .main-menu{display:none}
    .side-hint{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--faint);font-size:11px}
    .shell-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);z-index:60;padding:9px 14px;border-radius:10px;background:#292825;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
    .shell-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .shell.collapsed .main-menu{display:inline-grid;place-items:center;margin-right:6px}
    @media(max-width:860px){.main-menu{display:inline-grid;place-items:center;margin-right:6px}}
    .top{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--page)}
    .top strong{font:500 15px Georgia,serif}
    .top .count{color:var(--faint);font-size:11px}
    .spacer{flex:1}
    .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:9px;
      background:#fff;color:var(--ink);font-size:12.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
    .btn:hover{border-color:#c8c5bc;background:var(--surface2)}
    @media (max-width:1180px){
      .top .btn .lbl{display:none}
      .top .btn{padding:0 9px}
    }
    .btn.primary{border-color:#292825;background:#292825;color:#fff}
    .btn.primary:hover{background:#3a3934}
    .btn .ico{width:15px;height:15px}
    .ico{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .btn[hidden]{display:none}
    .grid{flex:1;min-height:0;min-width:0;display:flex;overflow-x:auto;overscroll-behavior-x:contain;background:var(--page)}
    .cell{position:relative;flex:0 0 auto;display:flex;flex-direction:column;min-width:240px;min-height:0;background:var(--surface);
      border:1px solid var(--line);border-radius:12px;margin:8px 0 8px 8px;overflow:hidden}
    .cell:last-of-type{margin-right:8px}
    .cell-head{flex:none;display:flex;align-items:center;gap:7px;height:34px;padding:0 6px 0 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
    .cell-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600}
    .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--faint)}
    .dot.idle{background:var(--green)}.dot.busy{background:var(--amber)}.dot.unknown{background:#cfccc4}
    .cell-btn{flex:none;display:grid;place-items:center;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--faint);cursor:pointer;text-decoration:none}
    .cell-btn:hover{background:#fff;color:var(--ink)}
    .cell-btn .ico{width:13px;height:13px}
    .cell iframe{flex:1;width:100%;min-height:0;border:0;background:var(--surface)}
    .splitter{flex:0 0 6px;cursor:col-resize;touch-action:none;position:relative}
    .splitter::after{content:'';position:absolute;inset:12px 2px;border-radius:3px;background:transparent;transition:background .12s}
    .splitter:hover::after{background:#cbc8bf}
    body.resizing{cursor:col-resize;user-select:none}
    body.resizing iframe{pointer-events:none}
    .empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
    .empty b{display:block;margin-bottom:6px;color:var(--ink);font:500 22px/1.2 Georgia,serif}
    dialog{width:min(calc(100vw - 24px),560px);max-height:80vh;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink)}
    dialog::backdrop{background:#0006}
    .picker{padding:16px}
    .picker h2{margin:0 0 10px;font-size:16px}
    .picker input{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:13px inherit;outline:none}
    .picker input:focus{border-color:var(--accent)}
    .plist{margin:10px 0 0;max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
    .prow{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
    .prow:last-child{border-bottom:0}
    .prow:hover{background:var(--surface2)}
    .prow .meta{flex:1;min-width:0}
    .prow .name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .prow .sub{color:var(--faint);font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .prow.added{opacity:.45;cursor:default}
    .picker-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
    .seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px;background:#fff}
    #grid-size{flex:none;max-width:min(48vw,430px);overflow-x:auto;scrollbar-width:none}
    #grid-size::-webkit-scrollbar{display:none}
    #grid-size button{flex:none}
    .seg button{height:26px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:12px inherit;cursor:pointer}
    .seg button:hover{color:var(--ink)}
    .seg button.active{background:#292825;color:#fff}
    .grid.mode-grid{display:grid;grid-template-columns:var(--col-tpl,repeat(2,minmax(0,1fr)));
      grid-template-rows:var(--row-tpl,repeat(2,minmax(0,1fr)));gap:8px;padding:8px;overflow:hidden;position:relative;align-content:stretch}
    /* resize grips: they sit on the seams and simply move the fr ratios between two neighbours */
    .grip{position:absolute;z-index:3;touch-action:none}
    .grip.col{width:9px;cursor:col-resize;z-index:4}
    .grip.row{height:9px;cursor:row-resize}
    .grip::after{content:'';position:absolute;border-radius:3px;background:transparent;transition:background .12s}
    .grip.col::after{inset:0 2px}
    .grip.row::after{inset:2px 0}
    .grip:hover::after,.grip.dragging::after{background:#c9a227}
    .grid.mode-grid .cell{margin:0;min-width:0;height:100%}
    /* ---- 画布：窗口是自由摆的矩形，拖标题栏移动、拖边角改大小 */
    .grid.mode-canvas{display:block;position:relative;overflow:auto;padding:0;background:var(--page)}
    .grid.mode-canvas .cell{position:absolute;margin:0;min-width:0;min-height:0;height:auto;will-change:left,top,width,height}
    .grid.mode-canvas .cell-head{cursor:grab}
    .grid.mode-canvas .cell.dragging .cell-head{cursor:grabbing}
    .grid.mode-canvas .cell.dragging{box-shadow:0 10px 30px #0002;z-index:5}
    .cell .rh{position:absolute;z-index:4;touch-action:none;opacity:0;transition:opacity .12s}
    .grid.mode-canvas .cell:hover .rh,.grid.mode-canvas .cell.dragging .rh{opacity:1}
    .cell .rh::after{content:'';position:absolute;border-radius:2px;background:transparent;transition:background .12s}
    .cell .rh:hover::after{background:var(--accent)}
    .cell .rh[data-resize="n"]{top:-3px;left:10px;right:10px;height:8px;cursor:ns-resize}
    .cell .rh[data-resize="s"]{bottom:-3px;left:10px;right:10px;height:8px;cursor:ns-resize}
    .cell .rh[data-resize="w"]{left:-3px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
    .cell .rh[data-resize="e"]{right:-3px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
    .cell .rh[data-resize="nw"],.cell .rh[data-resize="ne"],.cell .rh[data-resize="sw"],.cell .rh[data-resize="se"]{width:14px;height:14px}
    .cell .rh[data-resize="nw"]{left:-4px;top:-4px;cursor:nwse-resize}
    .cell .rh[data-resize="ne"]{right:-4px;top:-4px;cursor:nesw-resize}
    .cell .rh[data-resize="sw"]{left:-4px;bottom:-4px;cursor:nesw-resize}
    .cell .rh[data-resize="se"]{right:-4px;bottom:-4px;cursor:nwse-resize}
    .cell .rh[data-resize="n"]::after,.cell .rh[data-resize="s"]::after{inset:3px 0}
    .cell .rh[data-resize="w"]::after,.cell .rh[data-resize="e"]::after{inset:0 3px}
    .cell .rh[data-resize="nw"]::after,.cell .rh[data-resize="ne"]::after,.cell .rh[data-resize="sw"]::after,.cell .rh[data-resize="se"]::after{inset:4px}
    /* 对齐参考线：停在同一位置一会儿才淡入，拖得快的时候不会一直闪 */
    .canvas-guides{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity .14s}
    .canvas-guides.show{opacity:1}
    .canvas-guides i{position:absolute;display:block}
    .canvas-guides i.v{border-left:1px dashed var(--accent);top:0;bottom:0;width:0}
    .canvas-guides i.h{border-top:1px dashed var(--accent);left:0;right:0;height:0}
    .canvas-badge{position:absolute;z-index:9;padding:2px 6px;border-radius:6px;background:#292825;color:#fff;
      font:10.5px ui-monospace,monospace;pointer-events:none;white-space:nowrap}
    /* 行列挑选器：像 Word 插入表格那样悬停预览 */
    .pop{position:absolute;z-index:30;min-width:196px;padding:10px;border:1px solid var(--line);border-radius:12px;
      background:var(--surface);box-shadow:0 12px 30px #0002;display:flex;flex-direction:column;gap:8px}
    .pop[hidden]{display:none}
    .pop-grid{display:grid;grid-template-columns:repeat(6,22px);gap:3px}
    .pop-grid button{width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer}
    .pop-grid button.in{border-color:var(--accent);background:rgba(201,100,66,.16)}
    .pop-grid button.edge{border-color:var(--accent)}
    .pop-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .pop-foot span{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
    .pop-foot .btn{height:26px;padding:0 9px;font-size:11.5px}
    .cell-head{cursor:grab}
    .grid.maximized .cell:not(.max){display:none!important}
    .grid.maximized .splitter{display:none}
    .grid.maximized .cell.max{flex:1 1 auto!important;width:auto!important;height:100%;margin:8px}
    .grid.mode-grid.maximized .cell.max{grid-column:1/-1;height:100%}
    .grid.mode-canvas.maximized .cell.max{left:8px!important;top:8px!important;right:8px!important;bottom:8px!important;
      width:auto!important;height:auto!important}
    /* 手机上 iframe 会吃掉竖向手势：给一个固定的翻页器，不依赖滑动 */
    .grid-pager{display:none}
    @media(max-width:760px){
      .grid.mode-grid,.grid.mode-canvas{scroll-snap-type:y proximity}
      .grid-pager{position:fixed;right:10px;bottom:14px;z-index:7;display:flex;align-items:center;gap:2px;
        padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:0 6px 18px #0002}
      .grid-pager[hidden]{display:none}
      .grid-pager button{display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:999px;
        background:transparent;color:var(--ink);cursor:pointer}
      .grid-pager button:disabled{opacity:.3;cursor:default}
      .grid-pager span{min-width:44px;text-align:center;color:var(--muted);
        font:11px ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
    }
    .presets{display:flex;flex-direction:column;gap:10px}
    .shape-row{display:flex;align-items:flex-end;gap:10px;padding:4px 0 2px}
    .shape-row label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
    .shape-row input{width:96px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:9px;
      background:#fff;color:var(--ink);font:14px inherit;outline:none}
    .shape-row input:focus{border-color:var(--accent)}
    .shape-row .times{color:var(--faint);padding-bottom:9px}
    .shape-hint{margin:4px 0 0;color:var(--faint);font-size:11.5px;line-height:1.5}
    #grid-size .custom{color:var(--muted)}
    #grid-size .custom:hover{color:var(--ink)}
    .presets .row{display:flex;gap:8px}
    .presets .row input{flex:1;min-width:0;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:13px inherit;outline:none}
    .presets .row input:focus{border-color:var(--accent)}
    .preset-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:46vh;overflow-y:auto}
    .preset-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fff}
    .preset-row:last-child{border-bottom:0}
    .preset-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
    .preset-row .meta{color:var(--faint);font-size:11px;white-space:nowrap}
    .cell.dragging{opacity:.5}
    .cell.drop-target{outline:2px dashed var(--accent);outline-offset:-3px}
    .cell.flash{animation:cellFlash .9s ease}
    @keyframes cellFlash{0%{box-shadow:0 0 0 0 rgba(201,100,66,.55)}60%{box-shadow:0 0 0 7px rgba(201,100,66,0)}100%{box-shadow:0 0 0 0 rgba(201,100,66,0)}}
    body.moving{cursor:grabbing;user-select:none}
    body.moving iframe{pointer-events:none}
    @media(max-width:760px){
      /* the toolbar used to be 475px wide inside a 390px phone: icon-only buttons, tighter gaps */
      .top{height:48px;gap:6px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
      .top::-webkit-scrollbar{display:none}
      .top .count{display:none}
      .top strong{font-size:14px;white-space:nowrap}
      .top .btn{padding:0 8px;gap:0}
      .top .lbl{display:none}
      .top .btn .ico{width:17px;height:17px}
      /* one column only on a phone, so the layout switch would be a lie: hide it */
      .seg{display:none}
      .grid{flex-direction:column;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y proximity}
      /* stored column widths are desktop-only: on a phone each window fills the screen */
      .cell{flex:0 0 auto!important;width:auto!important;height:calc(100dvh - 64px);margin:8px 10px 0;min-width:0;scroll-snap-align:start}
      .cell:last-of-type{margin-bottom:10px}
      .cell-head{height:32px;gap:5px}
      .cell-title{font-size:12px}
      /* a phone never gets a 2- or 3-column grid: one window per row */
      .grid.mode-grid{grid-template-columns:minmax(0,1fr)!important;grid-auto-rows:auto;overflow-y:auto}
      .grid.mode-grid .cell{height:calc(100dvh - 64px)}
      .splitter,.grip,.cell .rh{display:none}
      .grid.mode-canvas{display:flex;flex-direction:column;overflow-y:auto;width:auto!important;height:auto!important}
      .grid.mode-canvas .cell{position:relative!important;left:auto!important;top:auto!important;
        width:auto!important;height:calc(100dvh - 64px)!important;margin:8px 10px 0}
      .empty{padding:16px}
    }
  </style>

<script src="/assets/theme.js"></script>

<script src="/assets/shell.js"></script>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const KEY='tmux-grid-v1';
  // widths are keyed by pane id: unset columns share the leftover space equally, so adding or
  // removing a window never leaves a column pinned at the width it had when it was alone
  const state={panes:[], widths:{}, layout:'strip', modes:{}, explicit:{}, max:null, presets:{}, titles:new Map(), statuses:new Map(), hosts:null,
    cells:{}, canvasFocus:null};
  // 上一次用过的自定义行列：留在工具栏里，一键就能回到那个形状
  const SHAPE_MAX_COLS=6, SHAPE_MAX_ROWS=6;
  const PRESET_KEY='tmux-grid-presets-v1';
  const LAYOUTS=['strip','grid','canvas'];
  // 画布：最小尺寸、吸附阈值、参考线延迟
  const CANVAS_MIN_W=240, CANVAS_MIN_H=160, SNAP=6, GUIDE_DELAY=140;
  const MIN=260;
  const GRID_MIN=170;

  // fr arrays are the single source of truth for cell sizes in grid mode: the row/column ratio
  // survives a resize, and dragging a seam just moves one fr value into its neighbour.
  function fitFr(list,count){
    const out=Array.isArray(list)?list.slice(0,count).map(v=>Number(v)):[];
    while(out.length<count)out.push(1);
    return out.map(v=>Number.isFinite(v)&&v>=0.1?v:1);
  }
  // ---- canvas: resize handles, snapping guides, and the drag itself
  const HANDLES=['n','s','e','w','ne','nw','se','sw'];
  function attachHandles(cell){
    if(cell.dataset.handles==='1')return;
    for(const dir of HANDLES){
      const handle=document.createElement('div');
      handle.className='rh';
      handle.dataset.resize=dir;
      cell.appendChild(handle);
    }
    cell.dataset.handles='1';
  }
  function detachHandles(cell){
    if(cell.dataset.handles!=='1')return;
    for(const handle of cell.querySelectorAll('.rh'))handle.remove();
    delete cell.dataset.handles;
  }
  function ensureGuides(){
    let layer=$('grid').querySelector('.canvas-guides');
    if(!layer){
      layer=document.createElement('div');
      layer.className='canvas-guides';
      $('grid').appendChild(layer);
    }
    return layer;
  }
  function hideGuides(){
    clearTimeout(guideTimer);
    guideLines=[];
    const layer=$('grid').querySelector('.canvas-guides');
    if(layer){layer.classList.remove('show');layer.innerHTML='';layer.remove();}
    const badge=$('grid').querySelector('.canvas-badge');
    if(badge)badge.remove();
  }
  // 参考线有延迟：停在同一位置 GUIDE_DELAY 毫秒才淡入，快速拖动时不会一路闪
  let guideTimer=0, guideLines=[];
  function queueGuides(lines){
    const key=lines.map(line=>line.axis+Math.round(line.pos)).join(',');
    if(key===guideKey){return;}
    guideKey=key;
    clearTimeout(guideTimer);
    if(!lines.length){guideLines=[];const layer=$('grid').querySelector('.canvas-guides');if(layer){layer.classList.remove('show');layer.innerHTML='';}return;}
    guideLines=lines;
    guideTimer=setTimeout(()=>{
      const layer=ensureGuides();
      layer.innerHTML=lines.map(line=>line.axis==='x'
        ? `<i class="v" style="left:${Math.round(line.pos)}px"></i>`
        : `<i class="h" style="top:${Math.round(line.pos)}px"></i>`).join('');
      layer.classList.add('show');
    },GUIDE_DELAY);
  }
  let guideKey='';

  function snapTargets(ignorePane){
    const grid=$('grid');
    const xs=[8,Math.max(8,grid.clientWidth-8)], ys=[8,Math.max(8,grid.clientHeight-8)];
    for(const pane of state.panes){
      if(pane===ignorePane)continue;
      const rect=state.cells[pane];
      if(!rect)continue;
      xs.push(rect.x,rect.x+rect.w,rect.x+rect.w/2);
      ys.push(rect.y,rect.y+rect.h,rect.y+rect.h/2);
    }
    return {xs,ys};
  }
  function nearest(value,targets){
    let best=null;
    for(const target of targets){
      if(Math.abs(value-target)>SNAP)continue;
      if(best===null||Math.abs(value-target)<Math.abs(value-best))best=target;
    }
    return best;
  }
  function showBadge(text,x,y){
    const grid=$('grid');
    let badge=grid.querySelector('.canvas-badge');
    if(!badge){badge=document.createElement('div');badge.className='canvas-badge';grid.appendChild(badge);}
    badge.textContent=text;
    badge.style.left=Math.max(0,Math.min(x,grid.clientWidth-90))+'px';
    badge.style.top=Math.max(0,y-22)+'px';
  }

  // ---- canvas geometry: {pane: {x,y,w,h}} in canvas pixels, plus a canvas size
  function slotRect(index,cols,rows){
    const grid=$('grid');
    const gap=8;
    const area=Math.max(360,(grid?grid.clientWidth:900)-16);
    const perRow=Math.max(1,cols||1);
    const cellW=Math.floor((area-gap*(perRow-1)-16)/perRow);
    const rowsCount=Math.max(1,rows||Math.ceil((index+1)/perRow));
    const cellH=Math.max(CANVAS_MIN_H,Math.floor(((grid?grid.clientHeight:600)-gap*(rowsCount-1)-16)/rowsCount));
    const col=index%perRow, row=Math.floor(index/perRow);
    return {x:8+col*(cellW+gap),y:8+row*(cellH+gap),w:cellW,h:cellH};
  }
  function tileCanvas(cols,rows){
    // 把当前窗口按 cols×rows 平铺进画布（新窗口、切换行列、"整理" 都用它）
    // 先清掉内联尺寸再量：画布会被拖大，拿被撑大的宽度去平铺只会越铺越小
    const box=$('grid');
    if(box){box.style.removeProperty('width');box.style.removeProperty('height');}
    const count=Math.max(1,state.panes.length);
    const useCols=Math.max(1,Math.min(cols||Math.ceil(Math.sqrt(count))||1,count));
    const useRows=Math.max(1,rows||Math.ceil(count/useCols));
    state.cells={};
    state.panes.forEach((pane,index)=>{
      state.cells[pane]=slotRect(index,useCols,useRows);
    });
    state.canvasCols=useCols;
    state.canvasRows=useRows;
  }
  function ensureCanvasCells(){
    const shapeCols=()=>Math.max(1,state.canvasCols||state.cols||2);
    const shapeRows=(cols)=>Math.max(1,state.canvasRows||Math.ceil(state.panes.length/cols));
    if(!state.panes.length){state.cells={};return;}
    // 丢掉已经不在的窗口
    for(const pane of Object.keys(state.cells)){
      if(!state.panes.includes(pane))delete state.cells[pane];
    }
    const missing=state.panes.filter(pane=>!state.cells[pane]);
    if(!missing.length)return;
    const cols=shapeCols();
    const rows=shapeRows(cols);
    const tiled=state.panes.some(pane=>state.cells[pane]);
    // 现有窗口是否还是"自动平铺"的样子：是就整体重排，动过手脚的就不碰
    const pure=tiled&&state.panes.filter(pane=>state.cells[pane]).every((pane)=>{
      const rect=state.cells[pane], seat=state.panes.indexOf(pane), slot=slotRect(seat,cols,rows);
      return Math.abs(rect.x-slot.x)<2&&Math.abs(rect.y-slot.y)<2;
    });
    if(!tiled||pure){tileCanvas(cols,rows);return;}
    // 手动摆过的画布：新窗口落到"下一个格子"，不重排已经放好的
    missing.forEach(pane=>{
      state.cells[pane]=slotRect(state.panes.indexOf(pane),cols,Math.max(rows,Math.ceil(state.panes.length/cols)));
    });
  }
  function canvasRectStyle(pane){
    const rect=state.cells[pane]||{x:8,y:8,w:CANVAS_MIN_W,h:CANVAS_MIN_H};
    return `left:${Math.round(rect.x)}px;top:${Math.round(rect.y)}px;width:${Math.round(rect.w)}px;height:${Math.round(rect.h)}px`;
  }
  function applyGridShape(){
    const cols=Math.max(1,Math.min(SHAPE_MAX_COLS,Math.round(Number(state.cols)||2)));
    const needed=Math.max(1,Math.ceil(state.panes.length/cols));
    state.cols=cols;
    // 行数至少装得下所有窗口，所以窗口比格子多时行数自己长，窗口少时留空
    state.rows=Math.max(Math.min(SHAPE_MAX_ROWS,Math.round(Number(state.rows)||2)),needed);
    state.colFr=fitFr(state.colFr,state.cols);
    state.rowFr=fitFr(state.rowFr,state.rows);
  }

  function load(){
    try{
      const saved=JSON.parse(localStorage.getItem(KEY)||'{}');
      state.panes=Array.isArray(saved.panes)?saved.panes.filter(x=>typeof x==='string'):[];
      const layout=String(saved.layout||'strip');
      state.layout=LAYOUTS.includes(layout)?layout:(layout==='grid2'||layout==='grid3'?'grid':'strip');
      state.cols=Number(saved.cols)||(layout==='grid3'?3:2);
      state.rows=Number(saved.rows)||2;
      state.colFr=Array.isArray(saved.colFr)?saved.colFr:null;
      state.rowFr=Array.isArray(saved.rowFr)?saved.rowFr:null;
      state.cells={};
      if(saved.cells&&typeof saved.cells==='object'){
        for(const [pane,rect] of Object.entries(saved.cells)){
          if(!rect||!Number.isFinite(Number(rect.x))||!Number.isFinite(Number(rect.y)))continue;
          state.cells[pane]={x:Number(rect.x),y:Number(rect.y),
            w:Math.max(CANVAS_MIN_W,Number(rect.w)||CANVAS_MIN_W),h:Math.max(CANVAS_MIN_H,Number(rect.h)||CANVAS_MIN_H)};
        }
      }
      state.canvasCols=Number(saved.canvasCols)||0;
      state.canvasRows=Number(saved.canvasRows)||0;
      const custom=saved.custom;
      state.custom=(custom&&Number(custom.cols)>=1&&Number(custom.rows)>=1)
        ?{cols:Math.min(SHAPE_MAX_COLS,Math.round(Number(custom.cols))),rows:Math.min(SHAPE_MAX_ROWS,Math.round(Number(custom.rows)))}
        :null;
      // the mode a pane had last time is remembered even while it is not a window: removing and
      // re-adding a session should not lose "I use this one as a terminal"
      state.modes={};
      for(const [pane,mode] of Object.entries(saved.modes||{})){
        if(mode==='chat'||mode==='term')state.modes[pane]=mode;
      }
      state.explicit={};
      for(const [pane,on] of Object.entries(saved.explicit||{})){
        if(on===true)state.explicit[pane]=true;
      }
      state.widths={};
      for(const [pane,width] of Object.entries(saved.widths||{})){
        if(state.panes.includes(pane)&&Number.isFinite(width)&&width>=MIN)state.widths[pane]=Math.round(width);
      }
    }catch{state.panes=[];state.widths={};}
    applyGridShape();
  }
  function save(){
    try{
      localStorage.setItem(KEY,JSON.stringify({panes:state.panes,widths:state.widths,layout:state.layout,cols:state.cols,rows:state.rows,colFr:state.colFr,rowFr:state.rowFr,modes:state.modes,explicit:state.explicit,custom:state.custom||null,cells:state.cells,canvasCols:state.canvasCols||0,canvasRows:state.canvasRows||0}));
    }catch{}
  }
  function widthOf(pane){
    const width=state.widths[pane];
    return Number.isFinite(width)&&width>=MIN?Math.round(width):0;
  }
  function cellStyle(pane){
    const width=widthOf(pane);
    return width?`flex:0 0 ${width}px;width:${width}px`:'flex:1 1 0;min-width:240px';
  }
  const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  function titleFor(paneId){
    const meta=state.titles.get(paneId);
    if(meta)return `${meta.session||paneId}${meta.window_name?':'+meta.window_name:''}${meta.command?' · '+meta.command:''}`;
    return paneId;
  }

  // pane -> <section class="cell">；iframe 只在首次出现或切换 chat/term 时才写入 src
  const cells=new Map();
  function srcFor(pane,mode){
    return mode==='term'
      ?`/term?pane=${encodeURIComponent(pane)}&embed=1`
      :`/preview?pane=${encodeURIComponent(pane)}&embed=1`;
  }
  function cellFor(pane,mode,status,gridded){
    let cell=cells.get(pane);
    const switching=cell&&cell.dataset.mode!==mode;
    if(!cell){
      cell=document.createElement('section');
      cell.className='cell';
      cell.dataset.pane=pane;
      cell.innerHTML=`<div class="cell-head">`
        +`<span class="dot" data-dot="${esc(pane)}"></span>`
        +`<span class="cell-title"></span>`
        +`<button class="cell-btn" type="button" data-mode-toggle="${esc(pane)}"><svg class="ico"><use href="#i-chat"/></svg></button>`
        +`<a class="cell-btn" href="/?pane=${encodeURIComponent(pane)}" target="_self" title="在控制台打开" aria-label="在控制台打开"><svg class="ico"><use href="#i-console"/></svg></a>`
        +`<button class="cell-btn" type="button" data-remove="${esc(pane)}" title="移出多窗口" aria-label="移出多窗口"><svg class="ico"><use href="#i-close"/></svg></button>`
        +`</div><iframe title="${esc(pane)}" loading="lazy"></iframe>`;
      cells.set(pane,cell);
    }
    if(!cell.dataset.mode||switching){
      cell.dataset.mode=mode;
      const frame=cell.querySelector('iframe');
      if(frame)frame.src=srcFor(pane,mode);
    }
    cell.classList.toggle('max',state.max===pane);
    const dot=cell.querySelector('[data-dot]');
    if(dot)dot.className=`dot ${status}`;
    const title=cell.querySelector('.cell-title');
    if(title){
      const label=titleFor(pane);
      if(title.textContent!==label)title.textContent=label;
      title.title=pane;
    }
    const toggle=cell.querySelector('[data-mode-toggle]');
    if(toggle){
      const tip=mode==='term'?'切到聊天':'切到终端';
      if(toggle.getAttribute('aria-label')!==tip){
        toggle.title=tip;
        toggle.setAttribute('aria-label',tip);
        const use=toggle.querySelector('use');
        if(use)use.setAttribute('href',mode==='term'?'#i-chat':'#i-term');
      }else if(!toggle.title){
        toggle.title=tip;
      }
    }
    return cell;
  }

  function render(){
    const grid=$('grid');
    $('count').textContent=state.panes.length?`${state.panes.length} 个窗口`:'';
    const canvas=state.layout==='canvas';
    const gridded=state.layout==='grid';
    grid.classList.toggle('mode-grid',gridded);
    grid.classList.toggle('mode-canvas',canvas);
    grid.classList.toggle('maximized',!!state.max);
    if(canvas){
      grid.style.removeProperty('--col-tpl');
      grid.style.removeProperty('--row-tpl');
      ensureCanvasCells();
      ensureGuides();
    }else{
      grid.style.removeProperty('width');
      grid.style.removeProperty('height');
      hideGuides();
    }
    if(gridded){
      applyGridShape();
      grid.style.setProperty('--col-tpl',state.colFr.map(v=>v+'fr').join(' '));
      grid.style.setProperty('--row-tpl',state.rowFr.map(v=>v+'fr').join(' '));
    }else{
      grid.style.removeProperty('--col-tpl');
      grid.style.removeProperty('--row-tpl');
    }
    for(const button of document.querySelectorAll('[data-layout]')){
      button.classList.toggle('active',button.dataset.layout===state.layout);
    }
    syncSizeUi();
    const tidy=$('tidy');
    if(tidy)tidy.hidden=!canvas;
    if(!state.panes.length){
      cells.clear();
      grid.innerHTML='<div class="empty"><div><b>还没有窗口</b>点「添加窗口」把几个会话并排放在这里，拖动分隔线可以调宽窄。</div></div>';
      return;
    }
    // 单元格与 iframe 按 pane 复用：改行列、加/移窗口只动结构，绝不再重建 iframe。
    // 之前每次 render 都重写 innerHTML，等于把每个 chat/terminal 页面重新加载一遍。
    const wanted=new Set(state.panes);
    for(const [pane,cell] of cells){
      if(!wanted.has(pane)){cell.remove();cells.delete(pane);}
    }
    // splitters are cheap throwaway divs: drop them first so `grid.children` is just cells
    for(const old of grid.querySelectorAll('.splitter'))old.remove();
    // 空状态是上一轮 render 留下的节点，有窗口以后必须摘掉（以前整块 innerHTML 重写顺带清掉了）
    for(const old of grid.querySelectorAll('.empty'))old.remove();
    if(!canvas)state.panes.forEach((pane,index)=>{
      const status=state.statuses.get(pane)||'unknown';
      const mode=state.modes[pane]==='term'?'term':'chat';
      const cell=cellFor(pane,mode,status,gridded);
      cell.style.cssText=gridded?'':cellStyle(pane);
      detachHandles(cell);
      // Only move a cell when it is actually in the wrong place: re-inserting an iframe
      // (even into the same parent) makes the browser reload the document inside it.
      // Compare against the other .cell nodes only -- guides/badge/splitter are not part of the order.
      const order=[...grid.querySelectorAll(':scope > .cell')];
      const current=order.indexOf(cell);
      if(current!==index){
        const ref=current<index?(order[index+1]||null):(order[index]||null);
        if(ref!==cell)grid.insertBefore(cell,ref);
      }
    });
    if(canvas)state.panes.forEach(pane=>{
      const status=state.statuses.get(pane)||'unknown';
      const mode=state.modes[pane]==='term'?'term':'chat';
      const cell=cellFor(pane,mode,status,true);
      cell.style.cssText=canvasRectStyle(pane)+';position:absolute';
      attachHandles(cell);
      if(!cell.isConnected)grid.appendChild(cell);
    });
    if(state.layout==='strip'){
      const sections=state.panes.map(pane=>cells.get(pane));
      for(let index=0;index<sections.length-1;index+=1){
        const splitter=document.createElement('div');
        splitter.className='splitter';
        splitter.dataset.split=String(index);
        grid.insertBefore(splitter,sections[index+1]);
      }
    }
    positionGrips();
    syncVisibility();
    syncTreeMarks();
    syncPager();
  }

  // ---- shape picker: one button, a Word-style hover grid, and the drag seams
  const SHAPE_MAX=6;
  function shapeText(){
    if(state.layout==='canvas')return state.canvasCols?`${state.canvasCols}×${state.canvasRows||'?'}`:'自由';
    return `${state.cols}×${state.rows}`;
  }
  function shapeGrid(){
    const box=$('shape-grid');
    if(!box)return;
    if(box.dataset.ready!=='1'){
      box.innerHTML=Array.from({length:SHAPE_MAX*SHAPE_MAX},(_,index)=>{
        const cols=index%SHAPE_MAX+1, rows=Math.floor(index/SHAPE_MAX)+1;
        return `<button type="button" data-cols="${cols}" data-rows="${rows}" aria-label="${cols} 列 ${rows} 行"></button>`;
      }).join('');
      box.dataset.ready='1';
    }
  }
  function paintShapeGrid(cols,rows){
    const box=$('shape-grid');
    if(!box)return;
    for(const button of box.querySelectorAll('[data-cols]')){
      const on=Number(button.dataset.cols)<=cols&&Number(button.dataset.rows)<=rows;
      button.classList.toggle('in',on);
      button.classList.toggle('edge',Number(button.dataset.cols)===cols&&Number(button.dataset.rows)===rows);
    }
    const hint=$('shape-hint');
    if(hint)hint.textContent=`${cols} × ${rows}`;
  }
  function syncSizeUi(){
    const button=$('shape-btn');
    if(!button)return;
    button.hidden=state.layout==='strip';
    const label=$('shape-label');
    if(label)label.textContent=shapeText();
    shapeGrid();
    if(state.layout==='canvas')paintShapeGrid(state.canvasCols||state.cols||2,state.canvasRows||state.rows||2);
    else paintShapeGrid(state.cols,state.rows);
  }
  function applyShape(cols,rows){
    if(state.layout==='canvas'){
      state.canvasCols=cols;
      state.canvasRows=rows;
      tileCanvas(cols,rows);
      save();render();
      return;
    }
    const same=state.layout==='grid'&&state.cols===cols&&state.rows===rows;
    state.layout='grid';
    state.cols=cols;
    state.rows=rows;
    // 形状没变就别动比例：用户拖了半天接缝，再点一下同一个格子不该回到等分
    if(!same){
      state.colFr=Array.from({length:cols},()=>1);
      state.rowFr=Array.from({length:rows},()=>1);
    }
    save();render();
  }
  function closeShapePop(){
    const pop=$('shape-pop');
    if(!pop)return;
    pop.hidden=true;
    $('shape-btn').setAttribute('aria-expanded','false');
  }
  function openShapePop(){
    const pop=$('shape-pop');
    if(!pop)return;
    syncSizeUi();
    pop.hidden=false;
    $('shape-btn').setAttribute('aria-expanded','true');
    const rect=$('shape-btn').getBoundingClientRect();
    const top=rect.bottom+6;
    pop.style.top=`${Math.round(top)}px`;
    pop.style.left=`${Math.round(Math.min(rect.left,window.innerWidth-220))}px`;
  }

  function updateShapeHint(){
    const cols=Math.max(1,Math.min(SHAPE_MAX_COLS,Math.round(Number($('gc-cols').value)||1)));
    const rows=Math.max(1,Math.min(SHAPE_MAX_ROWS,Math.round(Number($('gc-rows').value)||1)));
    const panes=state.panes.length;
    const need=panes?Math.ceil(panes/cols):1;
    const parts=[`${cols} 列 × ${rows} 行`];
    if(panes)parts.push(`当前 ${panes} 个窗口`);
    if(panes&&need>rows)parts.push(`按 ${cols} 列会占 ${need} 行（行数自动加到 ${Math.min(SHAPE_MAX_ROWS,need)}）`);
    else if(panes&&panes<cols*rows)parts.push(`${cols*rows-panes} 个空位`);
    $('gc-hint').textContent=parts.join('，')+'。最多 6 × 6。';
  }

  function openCustomShape(){
    const dialog=$('grid-custom');
    if(!dialog)return;
    $('gc-cols').value=String(state.cols);
    $('gc-rows').value=String(state.rows);
    updateShapeHint();
    if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');
    $('gc-cols').focus();
    $('gc-cols').select?.();
  }

  function applyCustomShape(){
    const cols=Math.max(1,Math.min(SHAPE_MAX_COLS,Math.round(Number($('gc-cols').value)||state.cols)));
    const rows=Math.max(1,Math.min(SHAPE_MAX_ROWS,Math.round(Number($('gc-rows').value)||state.rows)));
    if(state.layout==='canvas'){
      state.custom={cols,rows};
      state.canvasCols=cols;
      state.canvasRows=rows;
      tileCanvas(cols,rows);
      const dialogBox=$('grid-custom');
      if(dialogBox&&dialogBox.open)dialogBox.close();
      save();render();
      return;
    }
    const same=state.layout==='grid'&&state.cols===cols&&state.rows===rows;
    state.layout='grid';
    state.cols=cols;
    state.rows=rows;
    state.custom={cols,rows};
    if(!same){
      state.colFr=Array.from({length:cols},()=>1);
      state.rowFr=Array.from({length:rows},()=>1);
    }
    const dialog=$('grid-custom');
    if(dialog&&dialog.open)dialog.close();
    save();render();
    const opener=$('shape-btn');
    if(opener)opener.focus();     // 键盘用户的焦点回到按钮上，而不是掉到页面开头
  }

  // 手机上一屏一格；iframe 会吃掉竖向滑动，所以额外给一个翻页器（只有窄屏+多窗口才出现）
  function pagerCells(){
    return [...document.querySelectorAll('#grid > .cell')];
  }
  function pagerStep(){
    const cells=pagerCells();
    if(cells.length<2)return 0;
    const first=cells[0].getBoundingClientRect();
    const second=cells[1].getBoundingClientRect();
    return Math.max(1,Math.round(second.top-first.top));
  }
  function syncPager(){
    const pager=$('grid-pager');
    if(!pager)return;
    const cells=pagerCells();
    const show=window.innerWidth<=760&&cells.length>=2&&!state.max;
    pager.hidden=!show;
    if(!show)return;
    const grid=$('grid');
    const step=pagerStep();
    const index=step?Math.max(0,Math.min(cells.length-1,Math.round(grid.scrollTop/step))):0;
    $('grid-pager-text').textContent=`${index+1} / ${cells.length}`;
    for(const button of pager.querySelectorAll('[data-page]')){
      const dir=Number(button.dataset.page);
      button.disabled=(dir<0&&index<=0)||(dir>0&&index>=cells.length-1);
      const icon=button.querySelector('.ico');
      if(icon)icon.style.transform=dir>0?'':'rotate(180deg)';
    }
  }
  function bindPager(){
    const pager=$('grid-pager');
    if(!pager)return;
    pager.addEventListener('click',event=>{
      const button=event.target.closest('[data-page]');
      if(!button||button.disabled)return;
      const grid=$('grid');
      const step=pagerStep();
      const index=step?Math.round(grid.scrollTop/step):0;
      grid.scrollTo({top:(index+Number(button.dataset.page))*step,behavior:'smooth'});
    });
    let queued=0;
    const kick=()=>{if(queued)return;queued=requestAnimationFrame(()=>{queued=0;syncPager();});};
    $('grid').addEventListener('scroll',kick,{passive:true});
    window.addEventListener('resize',kick);
    window.addEventListener('orientationchange',()=>setTimeout(syncPager,150));
  }
  function positionGrips(){
    const grid=$('grid');
    for(const old of grid.querySelectorAll('.grip'))old.remove();
    if(state.layout!=='grid'||state.max||window.innerWidth<=760)return;
    const cells=[...grid.querySelectorAll('.cell')];
    if(cells.length<2)return;
    const box=grid.getBoundingClientRect();
    for(let col=1;col<state.cols;col++){
      const left=cells[col-1],right=cells[col];
      if(!left||!right)continue;
      const x=(left.getBoundingClientRect().right+right.getBoundingClientRect().left)/2-box.left;
      grid.insertAdjacentHTML('beforeend',`<div class="grip col" data-grip="col" data-index="${col}" style="left:${Math.round(x-4.5)}px;top:0;bottom:0"></div>`);
    }
    for(let row=1;row<state.rows;row++){
      const above=cells[(row-1)*state.cols],below=cells[row*state.cols];
      if(!above||!below)continue;
      const y=(above.getBoundingClientRect().bottom+below.getBoundingClientRect().top)/2-box.top;
      grid.insertAdjacentHTML('beforeend',`<div class="grip row" data-grip="row" data-index="${row}" style="top:${Math.round(y-4.5)}px;left:0;right:0"></div>`);
    }
  }

  // ---- tell each cell whether it is on screen, so hidden windows stop polling.
  //      Plain geometry beats IntersectionObserver here: it has to be re-run on every scroll,
  //      re-render and resize anyway, and it behaves the same in every engine.
  function syncVisibility(){
    const grid=$('grid');
    if(!grid)return;
    const bounds=grid.getBoundingClientRect();
    for(const frame of document.querySelectorAll('.cell iframe')){
      const rect=frame.getBoundingClientRect();
      const visible=rect.right>bounds.left+8&&rect.left<bounds.right-8
        &&rect.bottom>bounds.top+8&&rect.top<bounds.bottom-8;
      try{frame.contentWindow.postMessage({tmuxweb:'visibility',visible},location.origin);}catch{}
    }
  }
  // throttle on the clock, not on requestAnimationFrame: a hidden or non-painting tab must still
  // get the handshake, and scroll fires far more often than we need
  let lastVisibility=0;
  function queueVisibility(){
    const now=Date.now();
    if(now-lastVisibility<120)return;
    lastVisibility=now;
    syncVisibility();
  }
  $('grid').addEventListener('scroll',queueVisibility,{passive:true});
  window.addEventListener('resize',queueVisibility);
  window.addEventListener('resize',()=>{
    const grid=$('grid');
    if(grid&&window.innerWidth<=760){grid.style.removeProperty('width');grid.style.removeProperty('height');}
    clearTimeout(window.__gripTimer);
    window.__gripTimer=setTimeout(()=>{if(state.layout==='grid')positionGrips();},120);});

  async function loadMeta(){
    try{
      const response=await fetch('/api/hosts',{headers:{'Accept':'application/json'}});
      if(!response.ok)throw new Error('hosts');
      const data=await response.json();
      state.hosts=data.hosts||[];
      state.titles.clear();
      for(const host of state.hosts){
        for(const pane of host.panes||[]){
          state.titles.set(pane.id,pane);
        }
      }
      // refresh titles in place: a full render() would throw away every iframe (and with it a
      // live terminal connection) every 30 seconds
      let renamed=false;
      for(const cell of document.querySelectorAll('.cell')){
        const label=cell.querySelector('.cell-title');
        if(label)label.textContent=titleFor(cell.dataset.pane);
        renamed=true;
      }
      if(!renamed){
        render();
      }
      applyDefaultModes();
    }catch{}
  }

  async function loadStatus(){
    try{
      const response=await fetch('/api/panes/status',{headers:{'Accept':'application/json'}});
      if(!response.ok)return;
      const data=await response.json();
      state.statuses=new Map((data.panes||[]).map(item=>[item.id,item.status]));
      for(const dot of document.querySelectorAll('[data-dot]')){
        const status=state.statuses.get(dot.dataset.dot);
        if(status)dot.className='dot '+status;
      }
    }catch{}
  }

  // ---- add / remove
  // once the pane list is known, any window that is still on chat but belongs to a shell gets
  // switched to terminal (a shell has no structured transcript to chat with)
  // A window opens as chat when the pane really has a transcript; a plain shell has nothing to
  // chat with, so it degrades to the terminal instead of showing an empty chat card.
  function defaultModeFor(pane){
    if(state.explicit[pane])return state.modes[pane]==='term'?'term':'chat';
    const meta=state.titles.get(pane);
    if(meta&&meta.capabilities&&meta.capabilities.transcript===false)return 'term';
    return 'chat';
  }
  function applyDefaultModes(){
    let changed=false;
    for(const pane of state.panes){
      const want=defaultModeFor(pane);
      const current=state.modes[pane]==='term'?'term':'chat';
      if(want===current)continue;
      if(want==='term')state.modes[pane]='term';
      else delete state.modes[pane];
      changed=true;
    }
    if(!changed)return;
    save();render();loadStatus();
  }
  function addPane(paneId){
    if(!paneId||state.panes.includes(paneId))return;
    state.panes.push(paneId);
    // chat when the pane has a transcript, terminal when it only has a screen
    save();render();loadStatus();applyDefaultModes();
  }
  function removePane(paneId){
    const index=state.panes.indexOf(paneId);
    if(index<0)return;
    state.panes.splice(index,1);
    delete state.widths[paneId];
    save();render();
  }
  document.addEventListener('click',event=>{
    const remove=event.target.closest('[data-remove]');
    if(remove){event.preventDefault();removePane(remove.dataset.remove);return;}
    const row=event.target.closest('[data-add]');
    if(row){event.preventDefault();addPane(row.dataset.add);$('picker').close();return;}
    const layout=event.target.closest('[data-layout]');
    if(layout){event.preventDefault();state.layout=layout.dataset.layout;save();render();return;}
    if(event.target.closest('#gc-apply')){
      event.preventDefault();applyCustomShape();return;
    }
    // 形状按钮已经由 #shape-grid 自己的处理器接管（并且要区分画布/网格），
    // 这里不再兜 `[data-cols][data-rows]`，否则点挑选器会被当成"切到网格"。
    const toggle=event.target.closest('[data-mode-toggle]');
    if(toggle){event.preventDefault();setMode(toggle.dataset.modeToggle);return;}
  });

  // ---------------------------------------------------------------- keep the tree in step
  function syncTreeMarks(){
    if(window.TmuxShell&&TmuxShell.markActive)TmuxShell.markActive(state.panes);
  }
  function flashPane(paneId){
    const cell=document.querySelector(`.cell[data-pane="${CSS.escape(paneId)}"]`);
    if(!cell)return;
    cell.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
    cell.classList.remove('flash');
    void cell.offsetWidth;                 // restart the animation
    cell.classList.add('flash');
    setTimeout(()=>cell.classList.remove('flash'),900);
  }
  function openPane(paneId){
    if(state.panes.includes(paneId)){flashPane(paneId);return;}   // already a window: point at it
    addPane(paneId);
    flashPane(paneId);
  }

  // ---- chat / terminal per window
  function setMode(pane, mode){
    const next=mode||(state.modes[pane]==='term'?'chat':'term');
    if(next==='chat')delete state.modes[pane];
    else state.modes[pane]=next;
    state.explicit[pane]=true;      // a manual choice, in either direction, wins over the default
    save();
    const cell=document.querySelector(`.cell[data-pane="${CSS.escape(pane)}"]`);
    if(!cell)return;
    cell.dataset.mode=next;
    const frame=cell.querySelector('iframe');
    if(frame){
      frame.src=next==='term'
        ?`/term?pane=${encodeURIComponent(pane)}&embed=1`
        :`/preview?pane=${encodeURIComponent(pane)}&embed=1`;
    }
    const button=cell.querySelector('[data-mode-toggle]');
    if(button){
      const label=next==='term'?'切到聊天':'切到终端';
      button.title=label;
      button.setAttribute('aria-label',label);
      const use=button.querySelector('use');
      if(use)use.setAttribute('href',next==='term'?'#i-chat':'#i-term');
    }
    save();
  }

  // ---- double-click a title bar to give one window the whole page
  function toggleMax(pane){
    state.max=state.max===pane?null:pane;
    $('grid').classList.toggle('maximized',!!state.max);
    for(const cell of document.querySelectorAll('.cell')){
      cell.classList.toggle('max',cell.dataset.pane===state.max);
    }
    if(state.max){
      for(const cell of document.querySelectorAll('.cell')){
        if(cell.dataset.pane===state.max)cell.style.removeProperty('flex');
        else cell.style.removeProperty('flex');
      }
    }
    syncVisibility();
  }
  document.addEventListener('dblclick',event=>{
    const head=event.target.closest('.cell-head');
    if(!head||event.target.closest('.cell-btn'))return;
    const cell=head.closest('.cell');
    if(cell)toggleMax(cell.dataset.pane);
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&state.max){toggleMax(state.max);}
  });
  $('add').onclick=()=>{renderPicker('');$('pq').value='';$('picker').showModal();$('pq').focus();};

  // 行列挑选器：像 Word 插入表格，悬停预览、点一下生成
  $('shape-btn').addEventListener('click',event=>{
    event.preventDefault();
    const pop=$('shape-pop');
    if(pop&&!pop.hidden)closeShapePop(); else openShapePop();
  });
  $('shape-grid').addEventListener('pointerover',event=>{
    const button=event.target.closest('[data-cols]');
    if(!button)return;
    paintShapeGrid(Number(button.dataset.cols),Number(button.dataset.rows));
  });
  $('shape-grid').addEventListener('pointerleave',()=>{
    if(state.layout==='canvas')paintShapeGrid(state.canvasCols||state.cols||2,state.canvasRows||state.rows||2);
    else paintShapeGrid(state.cols,state.rows);
  });
  $('shape-grid').addEventListener('click',event=>{
    const button=event.target.closest('[data-cols]');
    if(!button)return;
    event.preventDefault();
    applyShape(Number(button.dataset.cols),Number(button.dataset.rows));
    closeShapePop();
  });
  $('shape-custom').addEventListener('click',()=>{closeShapePop();openCustomShape();});
  document.addEventListener('pointerdown',event=>{
    const pop=$('shape-pop');
    if(!pop||pop.hidden)return;
    if(event.target.closest('#shape-pop')||event.target.closest('#shape-btn'))return;
    closeShapePop();
  },true);
  document.addEventListener('keydown',event=>{
    if(event.key!=='Escape')return;
    const pop=$('shape-pop');
    if(pop&&!pop.hidden)closeShapePop();
  });
  $('tidy').addEventListener('click',()=>{
    state.canvasCols=state.canvasCols||Math.ceil(Math.sqrt(Math.max(1,state.panes.length)));
    state.canvasRows=Math.ceil(state.panes.length/Math.max(1,state.canvasCols));
    tileCanvas(state.canvasCols,state.canvasRows);
    save();render();
  });

  // 自定义形状：边输边算，回车直接应用（表单是 method=dialog，不退化成"回车就关掉"）
  for(const id of ['gc-cols','gc-rows']){
    const input=$(id);
    input.addEventListener('input',updateShapeHint);
    input.addEventListener('keydown',event=>{
      if(event.key!=='Enter')return;
      event.preventDefault();
      applyCustomShape();
    });
  }

  // ---- picker
  function renderPicker(query){
    const needle=(query||'').trim().toLowerCase();
    const rows=[];
    for(const host of state.hosts||[]){
      for(const pane of host.panes||[]){
        const haystack=`${host.name||host.id} ${pane.session} ${pane.window_name||''} ${pane.command} ${pane.title} ${pane.path}`.toLowerCase();
        if(needle&&!haystack.includes(needle))continue;
        rows.push(`<button class="prow ${state.panes.includes(pane.id)?'added':''}" type="button" data-add="${esc(pane.id)}">
          <span class="meta"><span class="name">${esc(`${host.name||host.id} · ${pane.session}${pane.window_name?':'+pane.window_name:''} · ${pane.command}`)}</span>
          <span class="sub">${esc(pane.title||pane.path||pane.id)}</span></span>
          ${state.panes.includes(pane.id)?'<span class="sub">已在</span>':''}
        </button>`);
      }
    }
    $('plist').innerHTML=rows.length?rows.slice(0,300).join(''):'<div class="empty" style="padding:18px">没有匹配的会话</div>';
  }
  $('pq').addEventListener('input',event=>renderPicker(event.target.value));

  // ---- resizable columns
  let drag=null;
  let gdrag=null;
  document.addEventListener('pointerdown',event=>{
    const grip=event.target.closest('[data-grip]');
    if(grip&&window.innerWidth>760&&state.layout==='grid'){
      event.preventDefault();
      const grid=$('grid');
      const axis=grip.dataset.grip==='row'?'row':'col';
      const list=axis==='col'?state.colFr:state.rowFr;
      const gaps=8*((axis==='col'?state.cols:state.rows)-1)+16;
      const total=(axis==='col'?grid.clientWidth:grid.clientHeight)-gaps;
      if(total<=0||list.length<2)return;
      gdrag={axis,index:Math.max(0,Number(grip.dataset.index)-1),start:axis==='col'?event.clientX:event.clientY,fr:[...list],total};
      grip.classList.add('dragging');
      grip.setPointerCapture&&grip.setPointerCapture(event.pointerId);
      document.body.classList.add('resizing');
      return;
    }
    const splitter=event.target.closest('[data-split]');
    if(!splitter||window.innerWidth<=760)return;
    event.preventDefault();
    const index=Number(splitter.dataset.split);
    const cells=[...document.querySelectorAll('.cell')];
    const left=cells[index],right=cells[index+1];
    if(!left||!right)return;
    drag={index,startX:event.clientX,left:left.getBoundingClientRect().width,right:right.getBoundingClientRect().width,
          leftPane:left.dataset.pane,rightPane:right.dataset.pane};
    splitter.setPointerCapture(event.pointerId);
    document.body.classList.add('resizing');
  });
  document.addEventListener('pointermove',event=>{
    if(gdrag){
      const {axis,index,fr,total}=gdrag;
      const pair=fr[index]+fr[index+1];
      const sum=fr.reduce((a,b)=>a+b,0);
      if(!(total>0)||!(pair>0)||!(sum>0))return;
      const perPx=sum/total;   // fr per pixel, measured against the whole row/column set
      const delta=(axis==='col'?event.clientX:event.clientY)-gdrag.start;
      const minFr=Math.min(GRID_MIN*perPx,pair/2-0.001);
      const next=Math.max(minFr,Math.min(pair-minFr,fr[index]+delta*perPx));
      const list=axis==='col'?state.colFr:state.rowFr;
      list[index]=Number(next.toFixed(4));
      list[index+1]=Number((pair-next).toFixed(4));
      $('grid').style.setProperty(axis==='col'?'--col-tpl':'--row-tpl',list.map(v=>v+'fr').join(' '));
      return;
    }
    if(!drag)return;
    const delta=event.clientX-drag.startX;
    const leftWidth=Math.max(MIN,drag.left+delta);
    const rightWidth=Math.max(MIN,drag.right-delta);
    const cells=[...document.querySelectorAll('.cell')];
    if(!cells[drag.index]||!cells[drag.index+1])return;
    cells[drag.index].style.flex='0 0 '+leftWidth+'px';
    cells[drag.index].style.width=leftWidth+'px';
    cells[drag.index+1].style.flex='0 0 '+rightWidth+'px';
    cells[drag.index+1].style.width=rightWidth+'px';
    state.widths[drag.leftPane]=Math.round(leftWidth);
    state.widths[drag.rightPane]=Math.round(rightWidth);
  });
  const endDrag=()=>{
    if(gdrag){
      gdrag=null;
      for(const grip of document.querySelectorAll('.grip.dragging'))grip.classList.remove('dragging');
      document.body.classList.remove('resizing');
      save();
      positionGrips();
      return;
    }
    if(!drag)return;
    drag=null;document.body.classList.remove('resizing');save();
  };
  document.addEventListener('pointerup',endDrag);
  document.addEventListener('pointercancel',endDrag);

  // ---- drag a window by its header to reorder it (iframes must not swallow the pointer)
  let mover=null;
  function cellUnder(x,y){
    for(const cell of document.querySelectorAll('.cell')){
      const rect=cell.getBoundingClientRect();
      if(x>=rect.left&&x<=rect.right&&y>=rect.top&&y<=rect.bottom)return cell;
    }
    return null;
  }
  // ---- canvas drag: move by the title bar, resize by any of the 8 handles
  let cdrag=null;
  document.addEventListener('pointerdown',event=>{
    if(state.layout!=='canvas'||window.innerWidth<=760||state.max)return;
    const cell=event.target.closest('.cell');
    if(!cell)return;
    const handle=event.target.closest('[data-resize]');
    const head=event.target.closest('.cell-head');
    if(!handle&&!head)return;
    if(head&&event.target.closest('.cell-btn,a,button:not([data-resize])'))return;
    const pane=cell.dataset.pane;
    const rect={...(state.cells[pane]||{x:0,y:0,w:CANVAS_MIN_W,h:CANVAS_MIN_H})};
    event.preventDefault();
    state.canvasFocus=pane;
    cdrag={pane,mode:handle?'resize':'move',dir:handle?handle.dataset.resize:'',
      startX:event.clientX,startY:event.clientY,rect,pointerId:event.pointerId};
    cell.classList.add('dragging');
    const capture=handle||cell;
    capture.setPointerCapture&&capture.setPointerCapture(event.pointerId);
    document.body.classList.add('canvas-dragging');
  });

  document.addEventListener('pointermove',event=>{
    if(!cdrag)return;
    const grid=$('grid');
    const area=snapTargets(cdrag.pane);
    const dx=event.clientX-cdrag.startX, dy=event.clientY-cdrag.startY;
    let {x,y,w,h}=cdrag.rect;
    const lines=[];
    if(cdrag.mode==='move'){
      x=Math.max(0,cdrag.rect.x+dx); y=Math.max(0,cdrag.rect.y+dy);
      const byLeft=nearest(x,area.xs), byCenter=nearest(x+w/2,area.xs), byRight=nearest(x+w,area.xs);
      if(byLeft!==null){x=byLeft;lines.push({axis:'x',pos:byLeft});}
      else if(byCenter!==null){x=byCenter-w/2;lines.push({axis:'x',pos:byCenter});}
      else if(byRight!==null){x=byRight-w;lines.push({axis:'x',pos:byRight});}
      const byTop=nearest(y,area.ys), byMiddle=nearest(y+h/2,area.ys), byBottom=nearest(y+h,area.ys);
      if(byTop!==null){y=byTop;lines.push({axis:'y',pos:byTop});}
      else if(byMiddle!==null){y=byMiddle-h/2;lines.push({axis:'y',pos:byMiddle});}
      else if(byBottom!==null){y=byBottom-h;lines.push({axis:'y',pos:byBottom});}
    }else{
      if(cdrag.dir.includes('e')){
        let right=cdrag.rect.x+cdrag.rect.w+dx;
        const snap=nearest(right,area.xs);
        if(snap!==null){right=snap;lines.push({axis:'x',pos:snap});}
        w=Math.max(CANVAS_MIN_W,right-cdrag.rect.x);
      }
      if(cdrag.dir.includes('s')){
        let bottom=cdrag.rect.y+cdrag.rect.h+dy;
        const snap=nearest(bottom,area.ys);
        if(snap!==null){bottom=snap;lines.push({axis:'y',pos:snap});}
        h=Math.max(CANVAS_MIN_H,bottom-cdrag.rect.y);
      }
      if(cdrag.dir.includes('w')){
        let left=cdrag.rect.x+dx;
        const snap=nearest(left,area.xs);
        if(snap!==null){left=snap;lines.push({axis:'x',pos:snap});}
        left=Math.min(left,cdrag.rect.x+cdrag.rect.w-CANVAS_MIN_W);
        w=Math.max(CANVAS_MIN_W,cdrag.rect.x+cdrag.rect.w-left);
        x=Math.max(0,left);
      }
      if(cdrag.dir.includes('n')){
        let top=cdrag.rect.y+dy;
        const snap=nearest(top,area.ys);
        if(snap!==null){top=snap;lines.push({axis:'y',pos:snap});}
        top=Math.min(top,cdrag.rect.y+cdrag.rect.h-CANVAS_MIN_H);
        h=Math.max(CANVAS_MIN_H,cdrag.rect.y+cdrag.rect.h-top);
        y=Math.max(0,top);
      }
    }
    state.cells[cdrag.pane]={x,y,w,h};
    const cell=grid.querySelector(`.cell[data-pane="${CSS.escape(cdrag.pane)}"]`);
    if(cell)cell.style.cssText=canvasRectStyle(cdrag.pane)+';position:absolute';
    // 拖到右/下边缘时把画布撑大，滚动条跟着长
    // 画布不需要手动撑大：grid 是滚动容器，绝对定位的窗口自己贡献滚动范围
    queueGuides(lines);
    showBadge(`${Math.round(w)}×${Math.round(h)}`,x,y);
  });

  document.addEventListener('pointerup',event=>{
    if(!cdrag)return;
    const pane=cdrag.pane;
    const cell=$('grid').querySelector(`.cell[data-pane="${CSS.escape(pane)}"]`);
    if(cell)cell.classList.remove('dragging');
    const rect=state.cells[pane];
    if(rect){rect.x=Math.round(rect.x);rect.y=Math.round(rect.y);rect.w=Math.round(rect.w);rect.h=Math.round(rect.h);}
    cdrag=null;
    document.body.classList.remove('canvas-dragging');
    guideKey='';
    hideGuides();
    save();render();loadStatus();
  });

  // 方向键微调（画布里选中过的窗口）
  document.addEventListener('keydown',event=>{
    if(state.layout!=='canvas'||!state.canvasFocus)return;
    if(!(event.altKey||event.metaKey))return;
    const step=event.shiftKey?40:8;
    const rect=state.cells[state.canvasFocus];
    if(!rect)return;
    const moves={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};
    const move=moves[event.key];
    if(!move)return;
    event.preventDefault();
    rect.x=Math.max(0,rect.x+move[0]);
    rect.y=Math.max(0,rect.y+move[1]);
    save();render();
  });

  document.addEventListener('pointerdown',event=>{
    const head=event.target.closest('.cell-head');
    if(!head||event.target.closest('.cell-btn'))return;
    const cell=head.closest('.cell');
    if(!cell||state.layout==='canvas')return;
    mover={pane:cell.dataset.pane,startX:event.clientX,startY:event.clientY,active:false};
  });
  document.addEventListener('pointermove',event=>{
    if(!mover)return;
    if(!mover.active){
      if(Math.hypot(event.clientX-mover.startX,event.clientY-mover.startY)<8)return;
      mover.active=true;
      document.body.classList.add('moving');
      const cell=document.querySelector(`.cell[data-pane="${CSS.escape(mover.pane)}"]`);
      if(cell)cell.classList.add('dragging');
    }
    const target=cellUnder(event.clientX,event.clientY);
    for(const cell of document.querySelectorAll('.cell.drop-target')){
      if(cell!==target)cell.classList.remove('drop-target');
    }
    if(target&&target.dataset.pane!==mover.pane)target.classList.add('drop-target');
  });
  document.addEventListener('pointerup',event=>{
    if(!mover)return;
    const active=mover.active,pane=mover.pane;
    mover=null;
    document.body.classList.remove('moving');
    for(const cell of document.querySelectorAll('.cell'))cell.classList.remove('dragging','drop-target');
    if(!active)return;
    const target=cellUnder(event.clientX,event.clientY);
    if(!target||target.dataset.pane===pane)return;
    const from=state.panes.indexOf(pane),to=state.panes.indexOf(target.dataset.pane);
    if(from<0||to<0)return;
    state.panes.splice(from,1);
    state.panes.splice(to,0,pane);
    save();render();loadStatus();
  });

  // ---- presets: name the whole arrangement and bring it back later
  function loadPresets(){
    try{state.presets=JSON.parse(localStorage.getItem(PRESET_KEY)||'{}')||{};}catch{state.presets={};}
  }
  function savePresets(){
    try{localStorage.setItem(PRESET_KEY,JSON.stringify(state.presets));}catch{}
  }
  function renderPresets(){
    const names=Object.keys(state.presets).sort();
    $('preset-list').innerHTML=names.length?names.map(name=>{
      const preset=state.presets[name]||{};
      return `<div class="preset-row" data-preset="${esc(name)}">
        <span class="name">${esc(name)}</span>
        <span class="meta">${(preset.panes||[]).length} 窗口 · ${preset.layout==='grid3'?'网格 3':preset.layout==='grid2'?'网格 2':'并排'}</span>
        <button class="btn" type="button" data-apply="${esc(name)}">应用</button>
        <button class="cell-btn" type="button" data-drop="${esc(name)}" title="删除"><svg class="ico"><use href="#i-close"/></svg></button>
      </div>`;
    }).join(''):'<div class="preset-row"><span class="name" style="color:var(--faint)">还没有预设：排好窗口后点「保存当前」</span></div>';
  }
  $('preset-btn').onclick=()=>{renderPresets();$('preset-name').value='';$('presets').showModal();};
  $('preset-save').onclick=()=>{
    const name=($('preset-name').value||'').trim();
    if(!name){$('preset-name').focus();return;}
    if(!state.panes.length)return;
    state.presets[name]={panes:[...state.panes],widths:{...state.widths},layout:state.layout,
      cols:state.cols,rows:state.rows,colFr:[...state.colFr],rowFr:[...state.rowFr],modes:{...state.modes}};
    savePresets();renderPresets();$('preset-name').value='';
  };
  document.addEventListener('click',event=>{
    const apply=event.target.closest('[data-apply]');
    if(apply){
      const preset=state.presets[apply.dataset.apply];
      if(!preset)return;
      state.panes=Array.isArray(preset.panes)?preset.panes.filter(p=>typeof p==='string'):[];
      state.widths={};
      for(const [pane,width] of Object.entries(preset.widths||{})){
        if(state.panes.includes(pane)&&Number.isFinite(width)&&width>=MIN)state.widths[pane]=Math.round(width);
      }
      state.layout=LAYOUTS.includes(preset.layout)?preset.layout:'strip';
      if(Number.isFinite(preset.cols))state.cols=preset.cols;
      if(Number.isFinite(preset.rows))state.rows=preset.rows;
      if(Array.isArray(preset.colFr))state.colFr=[...preset.colFr];
      if(Array.isArray(preset.rowFr))state.rowFr=[...preset.rowFr];
      applyGridShape();
      state.modes={};
      state.explicit={};
      for(const [pane,mode] of Object.entries(preset.modes||{})){
        if(state.panes.includes(pane)&&mode==='term'){state.modes[pane]='term';state.explicit[pane]=true;}
      }
      state.max=null;
      save();render();loadStatus();
      $('presets').close();
      return;
    }
    const drop=event.target.closest('[data-drop]');
    if(drop){delete state.presets[drop.dataset.drop];savePresets();renderPresets();}
  });

  loadPresets();
  bindPager();
  load();
  const params=new URLSearchParams(location.search);
  const single=params.get('add');
  if(single&&!state.panes.includes(single)){state.panes.push(single);save();}
  if(!state.panes.length){
    const wanted=params.get('panes');
    if(wanted)state.panes=wanted.split(',').map(item=>item.trim()).filter(Boolean).slice(0,6);
  }
  render();
  loadStatus();
  setInterval(loadStatus,10000);
  // the sidebar owns /api/hosts now: reuse its pane metadata instead of polling twice
  if(window.TmuxShell){
    TmuxShell.mount({
      onPane: paneId => openPane(paneId),
      onHosts: hosts => {
        // 共享侧栏的这条回调以前只更新标题，没把 hosts 本身存下来，于是「添加窗口」的
        // 选择器永远是空的（读取的是 state.hosts）。两个都要补。
        state.hosts=hosts||[];
        state.titles.clear();
        for(const host of state.hosts){
          for(const pane of host.panes||[]){
            state.titles.set(pane.id,pane);
          }
        }
        for(const cell of document.querySelectorAll('.cell')){
          const label=cell.querySelector('.cell-title');
          if(label)label.textContent=titleFor(cell.dataset.pane);
        }
        // the picker may already be open: refill it instead of leaving "没有匹配的会话"
        if($('picker').open)renderPicker($('pq').value||'');
        applyDefaultModes();
        syncTreeMarks();            // the tree is only in the DOM once the shell has loaded
      },
    });
  }else{
    loadMeta();
    setInterval(loadMeta,30000);
  }
  setInterval(syncVisibility,5000);      // safety net while a window is still loading
})();
</script>
<script src="/assets/plugins-ui.js"></script>
<script src="/assets/settings.js"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
</body>
</html>
