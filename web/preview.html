<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tmux Chat">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/app-icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/app-icon-180.png">
<title>TmuxWeb · 对话预览</title>
<style>
  :root{--bg:#F0EEE6;--surface:#FAF9F5;--card:#fff;--ink:#262520;--muted:#6f6a5e;--faint:#a09a8c;--line:#E2DFD5;--accent:#C96442;--green:#3f8f5f;--amber:#D89A3C;--danger:#B4442F}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
  header{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
  .icon-btn{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);cursor:pointer;text-decoration:none;flex:none}
  .icon-btn:hover{color:var(--accent);border-color:#d8c4b8}
  .head-main{flex:1;min-width:0}
  .title{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .state{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);font-size:10.5px;color:var(--muted);background:var(--card);flex:none}
  .state i{width:6px;height:6px;border-radius:50%;background:var(--faint);display:block}
  .state.busy{color:#8a5a12;border-color:#eadfc6;background:#fdf6e8}.state.busy i{background:var(--amber);animation:pulse 1.2s ease-in-out infinite}
  .state.idle{color:#3b7350;border-color:#d6e6da;background:#f2f8f3}.state.idle i{background:var(--green)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  main{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;padding:16px 14px 8px;scrollbar-gutter:stable}
  /* embedded in /grid: the cell header carries the title and the actions */
  body.embed header{display:none}
  body.embed main{padding-top:8px}
  body.embed .msg{margin-bottom:10px}
  body.embed .body{font-size:13.5px}
  .msg{display:flex;margin:0 0 14px;min-width:0}
  /* a flex item refuses to shrink below its content by default, so one long code line used to
     stretch the whole message column and give the chat a horizontal scrollbar on a phone */
  .msg>*{min-width:0;max-width:100%}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:min(86%,720px);padding:10px 14px;border-radius:16px;background:#e9e7df;white-space:pre-wrap;overflow-wrap:anywhere}
  .body{max-width:min(94%,780px);min-width:0;padding:12px 15px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:14px;line-height:1.65;overflow-wrap:anywhere}pre{max-width:100%}.body>*{min-width:0;max-width:100%}
  .body>*:first-child{margin-top:0}.body>*:last-child{margin-bottom:0}
  .body pre{overflow:auto;padding:12px;border-radius:10px;background:#272622;color:#f5f4ed;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  .body :not(pre)>code{padding:2px 5px;border-radius:5px;background:#eceae3;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .body table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:12px 0;font-size:13px}
  .body th,.body td{padding:7px 10px;border:1px solid #d1cfc6;text-align:left}
  .body th{background:#eceae3}
  .body blockquote{margin-left:0;padding-left:12px;border-left:3px solid var(--accent);color:var(--muted)}
  .body a{color:var(--accent)}
  .msg-tools{display:flex;align-items:center;justify-content:flex-end;margin-top:6px;opacity:.5}
  .msg-tools .msg-time{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto;line-height:1;color:var(--faint);font:10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .copy
  .msg:hover .msg-tools{opacity:1}
  .copy{flex:0 0 auto;white-space:nowrap;height:22px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.8);color:var(--muted);font-size:11px;cursor:pointer}
  .copy .ico{display:inline-block;width:11px;height:11px;margin-right:4px;vertical-align:-1px}
  .copy:hover{background:#fff;color:var(--ink)}
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}
  .notice{padding:8px 12px;margin:0 0 12px;border:1px solid #eadfc6;border-radius:10px;background:#fdf6e8;color:#8a5a12;font-size:12px}
  .screen-fallback{flex:1;display:flex;flex-direction:column;gap:10px;padding:4px 2px;min-height:0}
  /* screen mode owns the column height: the pre scrolls instead of stretching the page */
  body.screen-mode main{display:flex;overflow:hidden}
  body.screen-mode #messages{flex:1;min-height:0;display:flex}
  .screen-note{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
  .screen-term{align-self:flex-start;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:12.5px inherit;cursor:pointer}
  .screen-term:hover{border-color:#c8c5bc}
  .screen{flex:1 1 auto;min-height:0;margin:0;padding:10px 12px;overflow:auto;border-radius:10px;background:#111;
    color:#e7e5df;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
  footer{flex:none;padding:9px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
  .composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border:1px solid #cbc9c0;border-radius:14px;background:#fff}
  textarea{flex:1;min-height:22px;max-height:120px;padding:4px 2px;border:0;resize:none;background:transparent;color:var(--ink);outline:none;font:inherit;line-height:1.5}
  .send{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:#292825;color:#fff;cursor:pointer;flex:none}
  .send:disabled{background:#c8c5bd;cursor:not-allowed}
  .send.stop{background:var(--danger)}
  .hint{margin:6px 4px 0;color:var(--faint);font-size:11px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:#292825;color:#fff;font-size:12px;opacity:0;transition:opacity .18s;pointer-events:none}
  .toast.show{opacity:1}

    /* iOS zooms the page when a field under 16px takes focus and never zooms back out */
    @media(max-width:760px){input,textarea,select{font-size:16px!important}}
  </style>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/theme.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4.5 5.8h15a1.2 1.2 0 0 1 1.2 1.2v8.4a1.2 1.2 0 0 1-1.2 1.2H9.6l-4 3.1a.5.5 0 0 1-.8-.4v-2.7H4.5a1.2 1.2 0 0 1-1.2-1.2V7a1.2 1.2 0 0 1 1.2-1.2Z"></path><path d="M7.8 9.6h8.4M7.8 12.9h5.6"></path></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3.4" y="5" width="17.2" height="14" rx="2"></rect><path d="m7.2 10 2.4 2.2-2.4 2.2M12.4 14.6h4.2"></path></symbol>
  <symbol id="i-console" viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="14.8" rx="2.4"/><path d="m7.4 9.4 2.6 2.6-2.6 2.6M12.6 14.8h4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4.2v4.4h-4.4"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4.6 2.4 5 5.5.8-4 3.9.9 5.5-4.8-2.6-4.8 2.6.9-5.5-4-3.9 5.5-.8z"/></symbol>
  <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="m12 4.6 2.4 5 5.5.8-4 3.9.9 5.5-4.8-2.6-4.8 2.6.9-5.5-4-3.9 5.5-.8z" fill="currentColor"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M12 5.5 18.5 12 12 18.5"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1.9" y="5.7" width="14.6" height="17.1" rx="2.7"/><path d="M8.4 5.7V3.9A2.7 2.7 0 0 1 11.1 1.2h8.4a2.7 2.7 0 0 1 2.7 2.7v11.3a2.7 2.7 0 0 1-2.7 2.7h-3.3"/></g></symbol>
  
</defs></svg>

<header>
  <button class="icon-btn" id="back" title="返回主页" aria-label="返回">
    <svg class="ico"><use href="#i-back"/></svg>
  </button>
  <div class="head-main">
    <div class="title" id="title">对话预览</div>
    <div class="sub" id="sub"></div>
  </div>
  <span class="state" id="state"><i></i><span id="state-label">读取中…</span></span>
  <a class="icon-btn" id="open-chat" title="在控制台用聊天视图打开" aria-label="在控制台用聊天视图打开" href="/"><svg class="ico"><use href="#i-chat"/></svg></a>
  <a class="icon-btn" id="open-terminal" title="在控制台用终端视图打开" aria-label="在控制台用终端视图打开" href="/"><svg class="ico"><use href="#i-terminal"/></svg></a>
  <a class="icon-btn" id="open-grid" title="加到多窗口" aria-label="加到多窗口" href="/grid"><svg class="ico"><use href="#i-grid"/></svg></a>
  <button class="icon-btn" id="fav" title="收藏到主页" aria-label="收藏到主页" aria-pressed="false"><svg class="ico"><use href="#i-star"/></svg></button>
  <button class="icon-btn" id="reload" title="刷新" aria-label="刷新"><svg class="ico"><use href="#i-refresh"/></svg></button>
</header>

<main id="scroll">
  <div id="messages"><div class="empty">读取对话…</div></div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="继续提问…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="send" id="send" title="发送" aria-label="发送"><svg class="ico"><use href="#i-send"/></svg></button>
  </div>
  <div class="hint" id="hint"></div>
</footer>
<div class="toast" id="toast"></div>

<script type="module">
import {marked} from '/assets/marked.esm.js';

const $=id=>document.getElementById(id);
const pane=new URLSearchParams(location.search).get('pane')||'';
const state={messages:[],sig:null,pane,waiting:false,stick:true,timer:null,paneInfo:null};
const scroll=$('scroll');

function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
marked.use({renderer:{html(token){return esc(token&&(token.text!=null?token.text:token.raw));}}});
const md=value=>marked.parse(String(value??''),{gfm:true,breaks:false,async:false});
if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');
// a phone has no Shift key: the desktop shortcut hint is noise there
if(matchMedia('(pointer:coarse)').matches)document.getElementById('input').placeholder='继续提问…';
// /grid tells each cell whether it is on screen; offscreen cells back off to one request per 15s
let cellVisible=true;
document.body.dataset.cellVisible='true';
window.addEventListener('message',event=>{
  if(event.origin!==location.origin)return;
  const data=event.data;
  if(!data||data.tmuxweb!=='visibility')return;
  const visible=!!data.visible;
  if(visible===cellVisible)return;
  cellVisible=visible;
  document.body.dataset.cellVisible=String(visible);   // lets /grid and tests confirm the handshake
  if(cellVisible){clearTimeout(state.timer);load(false);}
});
{const grid=document.getElementById('open-grid');if(grid)grid.href='/grid?add='+encodeURIComponent(pane);}const favBtn=document.getElementById('fav');
function paintFav(on){
  if(!favBtn)return;
  favBtn.classList.toggle('on',on);
  favBtn.setAttribute('aria-pressed',on?'true':'false');
  favBtn.title=on?'取消收藏':'收藏到主页';
  favBtn.setAttribute('aria-label',favBtn.title);
  const use=favBtn.querySelector('use');
  if(use)use.setAttribute('href',on?'#i-star-fill':'#i-star');
}
async function syncFav(){
  if(!pane){paintFav(false);return;}
  try{const data=await api('/api/home/favorites');paintFav((data.favorites||[]).includes(pane));}catch{}
}
if(favBtn)favBtn.onclick=async()=>{
  if(!pane)return;
  const on=favBtn.classList.contains('on');
  try{
    if(on)await api(`/api/home/favorites/${encodeURIComponent(pane)}`,{method:'DELETE'});
    else await api('/api/home/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pane})});
    paintFav(!on);
    toast(!on?'已收藏到主页':'已取消收藏');
  }catch(err){toast(err.message);}
};
syncFav();
function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),1800);}
async function api(url,opts={}){const r=await fetch(url,opts);if(r.status===401){location='/login';throw new Error('登录已失效');}
  if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||`HTTP ${r.status}`);}return r.json();}
function atBottom(){return scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<48;}
function signature(data){return `${data.mtime||''}|${(data.messages||[]).length}|${(data.messages||[]).slice(-1)[0]?.id||''}|${data.waiting?1:0}`;}

function setState(waiting,status){
  state.waiting=!!waiting;
  const key=waiting?'busy':(status||'idle');
  $('state').className='state '+key;
  $('state-label').textContent=waiting?'思考中…':(key==='idle'?'idle':key);
  syncSend();
}
function syncSend(){
  const working=state.waiting&&!$('input').value.trim();
  const button=$('send');
  button.classList.toggle('stop',working);
  button.title=working?'停止本轮':'发送';
  button.setAttribute('aria-label',button.title);
  button.querySelector('use').setAttribute('href',working?'#i-stop':'#i-send');
}

const clockTime=ts=>{if(ts===null||ts===undefined||ts==='')return '';const numeric=typeof ts==='number'||/^\d+(\.\d+)?$/.test(String(ts).trim());const d=numeric?new Date(Number(ts)>1e12?Number(ts):Number(ts)*1000):new Date(ts);if(Number.isNaN(d.getTime()))return '';const pad=v=>String(v).padStart(2,'0'),now=new Date();return (d.toDateString()===now.toDateString()?'':`${pad(d.getMonth()+1)}-${pad(d.getDate())} `)+`${pad(d.getHours())}:${pad(d.getMinutes())}`;};
function render(){
  const host=$('messages');
  host.innerHTML=state.messages.length?state.messages.map(message=>message.role==='user'
    ?`<article class="msg user"><div><div class="bubble">${esc(message.text)}</div>
        <div class="msg-tools">${clockTime(message.timestamp)?`<span class="msg-time">${clockTime(message.timestamp)}</span>`:''}<button class="copy" data-copy="${esc(message.id)}"><svg class="ico"><use href="#i-copy"/></svg>复制</button></div></div></article>`
    :`<article class="msg assistant"><div><div class="body">${md(message.text)}</div>
        <div class="msg-tools">${clockTime(message.timestamp)?`<span class="msg-time">${clockTime(message.timestamp)}</span>`:''}<button class="copy" data-copy="${esc(message.id)}"><svg class="ico"><use href="#i-copy"/></svg>复制</button></div></div></article>`).join('')
    :'<div class="empty">这个会话还没有消息</div>';
  if(state.stick)requestAnimationFrame(()=>{scroll.scrollTop=scroll.scrollHeight;});
}

async function load(info=false){
  try{
    const data=await api(`/api/panes/${encodeURIComponent(pane)}/transcript?limit=200`);
    const sig=signature(data);
    if(sig!==state.sig||info){
      const follow=state.stick&&atBottom();
      state.sig=sig;
      state.messages=data.messages||[];
      if(info||!state.messages.length)setState(data.waiting,data.status);
      else setState(data.waiting,data.status);
      render();
      if(!follow)state.stick=false;
    }
    $('hint').textContent=`${state.messages.length} 条消息 · 每 2 秒刷新`;
  }catch(error){
    if(/not supported|unsupported/i.test(error.message||'')){
      // a plain shell has no transcript: show its screen and offer the terminal instead of a dead card
      if(!screenMode)enterScreenMode();
      return;
    }
    $('hint').textContent=error.message;
    if(!state.messages.length)$('messages').innerHTML=`<div class="empty">${esc(error.message)}</div>`;
  }finally{
    clearTimeout(state.timer);
    // a window scrolled out of /grid slows right down instead of polling in the background
    state.timer=setTimeout(()=>load(false),cellVisible?2000:15000);
  }
}

// ---- 没有结构化对话的 pane（普通 shell / 全屏程序）：展示当前屏幕，并给一个切终端的入口
let screenMode=false, screenTimer=null;
function enterScreenMode(){
  screenMode=true;
  document.body.classList.add('screen-mode');
  clearTimeout(state.timer);
  $('hint').textContent='只读屏幕 · 每 5 秒刷新';
  $('messages').innerHTML=`<div class="screen-fallback">
      <p class="screen-note">这个 pane 没有结构化对话（普通 shell 或全屏程序），下面是它的当前屏幕，只读。</p>
      <button class="screen-term" type="button">切到终端（可输入）</button>
      <pre class="screen" id="screen"></pre>
    </div>`;
  const button=$('messages').querySelector('.screen-term');
  if(button)button.onclick=()=>{location.href=`/term?pane=${encodeURIComponent(pane)}&embed=1`;};
  loadScreen();
}
async function loadScreen(){
  try{
    const data=await api(`/api/panes/${encodeURIComponent(pane)}/capture?history=200`);
    const pre=$('screen');
    if(pre){
      pre.textContent=(data.content||'').replace(/\s+$/,'');
      pre.scrollTop=pre.scrollHeight;
    }
  }catch{}
  clearTimeout(screenTimer);
  screenTimer=setTimeout(loadScreen,cellVisible?5000:20000);
}

async function loadPaneInfo(){
  try{
    const data=await api('/api/hosts');
    const owner=(data.hosts||[]).find(host=>(host.panes||[]).some(item=>item.id===pane));
    const meta=owner&&(owner.panes||[]).find(item=>item.id===pane);
    state.paneInfo=meta||null;
    if(!meta)return;
    document.title=`${meta.title||pane} · 对话预览`;
    $('title').textContent=meta.title||pane;
    $('sub').textContent=[owner.name,meta.session,`${meta.window}:${meta.window_name||''}`,meta.command].filter(Boolean).join(' · ');
    $('open-chat').href=`/?pane=${encodeURIComponent(pane)}`;
    $('open-terminal').href=`/?pane=${encodeURIComponent(pane)}&mode=terminal`;
  }catch{}
}

document.addEventListener('click',async event=>{
  const copy=event.target.closest('[data-copy]');
  if(copy){
    const message=state.messages.find(item=>String(item.id)===copy.dataset.copy);
    if(!message)return;
    try{await navigator.clipboard.writeText(String(message.text||''));copy.textContent='已复制';setTimeout(()=>copy.textContent='复制',1400);}catch{toast('复制失败');}
  }
});

async function send(){
  const text=$('input').value;
  if(!text.trim())return;
  if(state.waiting){await stop();return;}
  const input=$('input');
  input.value='';input.style.height='auto';syncSend();
  try{
    await api(`/api/panes/${encodeURIComponent(pane)}/input`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,submit:true})});
    state.stick=true;
    state.sig=null;
    load(false);
  }catch(error){toast(error.message);input.value=text;}
}
async function stop(){
  try{const d=await api(`/api/panes/${encodeURIComponent(pane)}/interrupt`,{method:'POST',headers:{'Content-Type':'application/json'}});
    toast(d.key==='C-q'?'已发送 Ctrl+Q，正在停止':'已发送 Esc，正在停止');setTimeout(()=>{state.sig=null;load(false);},800);}
  catch(error){toast(error.message);}
}

$('send').onclick=send;
$('input').addEventListener('input',()=>{const input=$('input');input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';syncSend();});
$('input').addEventListener('keydown',event=>{
  if(event.key!=='Enter'||event.shiftKey||event.isComposing)return;
  event.preventDefault();
  send();
});
scroll.addEventListener('wheel',()=>{state.stick=atBottom();},{passive:true});
scroll.addEventListener('scroll',()=>{state.stick=atBottom();},{passive:true});
$('back').onclick=()=>{if(history.length>1)history.back();else location='/home';};
$('reload').onclick=()=>{state.sig=null;load(true);};

if(!pane){$('messages').innerHTML='<div class="empty">缺少 pane 参数</div>';}
else{loadPaneInfo();load(true);syncSend();}
</script>
</body>
</html>
