<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>分享管理 · Tmux Chat</title><link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml"><link rel="icon" href="/assets/app-icon-32.png" sizes="32x32" type="image/png">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#242421;--muted:#73716b;--line:#dddcd5;--green:#4f9a65;--orange:#c96442;--red:#b34b43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 max(16px,calc((100vw - 1080px)/2));border-bottom:1px solid var(--line);background:#f7f7f5ee;backdrop-filter:blur(12px)}.top a{color:var(--ink);text-decoration:none}.top strong{font-size:17px}.wrap{width:min(calc(100% - 24px),1080px);margin:22px auto 60px}.summary{margin-bottom:16px;color:var(--muted)}.list{display:grid;gap:12px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.card{padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 2px 10px #00000008}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.title{font-weight:650;font-size:15px}.url{margin-top:3px;color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.status{flex:none;padding:4px 8px;border-radius:999px;font-size:11px}.status.active{background:#e5f1e8;color:#327146}.status.expired{background:#f7eadf;color:#995126}.status.stopped{background:#f4e3e2;color:#8d3833}.meta{display:flex;flex-wrap:wrap;gap:7px 16px;margin:14px 0;color:var(--muted);font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button,.actions a{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:12px inherit;text-decoration:none;line-height:34px;cursor:pointer}.actions .warn{color:var(--orange)}.actions .danger{color:var(--red)}dialog{width:min(calc(100% - 24px),420px);padding:0;border:1px solid var(--line);border-radius:16px;background:#fff}dialog::backdrop{background:#0006}.modal{padding:21px}.modal h2{margin:0 0 14px;font-size:18px}.modal input,.modal select{width:100%;height:44px;padding:0 11px;border:1px solid var(--line);border-radius:10px;font:16px inherit}.modal small{display:block;margin:7px 0;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal-actions button{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff}.modal-actions .primary{background:#292825;color:#fff}.toast{position:fixed;right:18px;bottom:18px;z-index:5;display:none;padding:10px 14px;border-radius:10px;background:#292825;color:#fff}@media(max-width:600px){.top{padding:0 12px}.wrap{margin-top:12px}.card{padding:14px}.head{align-items:center}.actions button,.actions a{flex:1;text-align:center}.meta{display:grid;gap:4px}}
</style>
</head>
<body>
<header class="top"><strong>分享管理</strong><a href="/">← 返回控制台</a></header><main class="wrap"><div class="summary" id="summary">加载中…</div><section class="list" id="list"></section></main><div class="toast" id="toast"></div>
<dialog id="extend-dialog"><form class="modal" id="extend-form"><h2>续期分享</h2><select id="extend-seconds"><option value="3600">增加 1 小时</option><option value="86400" selected>增加 1 天</option><option value="604800">增加 7 天</option><option value="2592000">增加 30 天</option></select><small>从当前到期时间继续增加；已过期分享从现在开始计算。</small><div class="modal-actions"><button type="button" data-close>取消</button><button class="primary">确认续期</button></div></form></dialog>
<dialog id="password-dialog"><form class="modal" id="password-form"><h2>重置访问密码</h2><input id="new-password" type="password" autocomplete="new-password" placeholder="新密码；留空则取消密码"><small>重置后，所有旧访客登录立即失效。</small><div class="modal-actions"><button type="button" data-close>取消</button><button class="primary">保存密码</button></div></form></dialog>
<script>
(()=>{const $=id=>document.getElementById(id),list=$('list');let shares=[],selected=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(text){const el=$('toast');el.textContent=text;el.style.display='block';setTimeout(()=>el.style.display='none',1800)}async function api(url,options={}){const r=await fetch(url,options);if(r.status===401){location='/login';throw new Error('登录失效')}if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||`HTTP ${r.status}`)}return r.json()}function time(ts){return new Date(ts*1000).toLocaleString()}function render(){const active=shares.filter(s=>s.status==='active').length;$('summary').textContent=`共 ${shares.length} 个分享 · ${active} 个有效`;if(!shares.length){list.innerHTML='<div class="empty">还没有分享记录。</div>';return}list.innerHTML=shares.map(s=>`<article class="card"><div class="head"><div><div class="title">${esc(s.title)}</div><div class="url">${esc(new URL(s.url,location.origin).href)}</div></div><span class="status ${s.status}">${s.status==='active'?'有效':s.status==='expired'?'已过期':'已停止'}</span></div><div class="meta"><span>路径：${esc(s.slug)}</span><span>Pane：${esc(s.pane_id)}</span><span>到期：${time(s.expires_at)}</span><span>${s.password_protected?'密码保护':'免密码'}</span><span>${s.allow_input?'可对话':'只读分享'}</span></div><div class="actions"><a href="${esc(s.url)}" target="_blank">打开</a><button data-copy="${esc(s.url)}">复制链接</button>${s.status!=='stopped'?`<button data-extend="${s.id}">续期</button><button data-password="${s.id}">重置密码</button><button class="warn" data-stop="${s.id}">提前停止</button>`:''}<button class="danger" data-delete="${s.id}">删除记录</button></div></article>`).join('')}async function load(){const d=await api('/api/shares',{cache:'no-store'});shares=d.shares;render()}list.onclick=async e=>{const copy=e.target.closest('[data-copy]');if(copy){const url=new URL(copy.dataset.copy,location.origin).href;await navigator.clipboard.writeText(url);toast('链接已复制');return}const extend=e.target.closest('[data-extend]');if(extend){selected=extend.dataset.extend;$('extend-dialog').showModal();return}const password=e.target.closest('[data-password]');if(password){selected=password.dataset.password;$('new-password').value='';$('password-dialog').showModal();return}const stop=e.target.closest('[data-stop]');if(stop&&confirm('立即停止后，访客将无法继续访问。确定吗？')){await api(`/api/shares/${stop.dataset.stop}/stop`,{method:'POST'});toast('分享已停止');load();return}const del=e.target.closest('[data-delete]');if(del&&confirm('永久删除这条分享记录？此操作不可撤销。')){await api(`/api/shares/${del.dataset.delete}`,{method:'DELETE'});toast('记录已删除');load()}};$('extend-form').onsubmit=async e=>{e.preventDefault();await api(`/api/shares/${selected}/extend`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seconds:Number($('extend-seconds').value)})});$('extend-dialog').close();toast('续期成功');load()};$('password-form').onsubmit=async e=>{e.preventDefault();await api(`/api/shares/${selected}/password`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('new-password').value})});$('password-dialog').close();toast('密码已更新');load()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());load().catch(e=>toast(e.message))})();
</script>
</body></html>
