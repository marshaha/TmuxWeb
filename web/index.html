<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tmux Chat">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/app-icon-180.png">
  <title>Tmux Chat</title>
  <link rel="stylesheet" href="/assets/xterm/xterm.css?v=2">
  <style>
    :root{color-scheme:light;--page:#f7f7f5;--sidebar:#eeeDE8;--surface:#fff;--surface2:#f4f3ee;--ink:#242421;--muted:#73716b;--faint:#a09d95;--line:#dddcd5;--accent:#c96442;--green:#4f9a65;--danger:#b34b43;--shadow:0 8px 30px rgba(32,31,28,.08);--visual-height:100dvh;--visual-top:0px}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,textarea{font:inherit}
    .app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100dvh;transition:grid-template-columns .18s ease}.sidebar{display:flex;min-width:0;min-height:0;flex-direction:column;overflow:hidden;border-right:1px solid var(--line);background:var(--sidebar);transition:opacity .15s ease,transform .18s ease}.app.sidebar-collapsed{grid-template-columns:0 minmax(0,1fr)}.app.sidebar-collapsed .sidebar{opacity:0;pointer-events:none}.brand{display:flex;align-items:center;justify-content:space-between;padding:18px 15px 13px}.brand-name{font-family:Georgia,serif;font-size:20px}.brand-sub{color:var(--muted);font-size:11px;margin-top:1px}.brand-actions{display:flex;gap:6px}.icon-btn,.logout{min-width:36px;min-height:36px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.5);color:var(--muted);cursor:pointer}.icon-btn:hover,.logout:hover{background:#fff;color:var(--ink)}

    .error-banner{position:absolute;z-index:8;top:58px;left:0;right:0;display:none;padding:8px 20px;border-bottom:1px solid #e4c2bd;background:#faeae7;color:#8b3932}.conversation{grid-row:2;position:relative;z-index:1;min-width:0;min-height:0;overflow:hidden}.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:28px 0 34px;overscroll-behavior:contain;scrollbar-gutter:stable}.message-shell{width:min(100% - 36px,980px);margin:0 auto}.agent-label{display:flex;align-items:center;gap:9px;margin-bottom:11px;color:var(--muted);font-size:12px}.agent-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#292825;color:#faf9f5;font-family:Georgia,serif;font-size:15px}.terminal-frame{max-width:100%;overflow-x:auto;overflow-y:visible;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(25,24,21,.03)}.capture-output{display:block;min-width:max-content;margin:0;padding:20px 22px;color:#302f2b;white-space:pre;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;tab-size:4}.terminal-table-line{display:inline;white-space:nowrap}.terminal-cell{display:inline-block;width:1ch;height:auto;line-height:inherit;vertical-align:baseline;overflow:visible}.terminal-cell.wide{width:2ch}.terminal-cell.zero{width:0}.transcript{display:none;width:min(100% - 36px,900px);margin:0 auto}.transcript.active{display:block}.chat-message{display:flex;margin:0 0 18px}.chat-message.user{justify-content:flex-end}.chat-message.assistant{justify-content:flex-start}.chat-user-wrap{display:flex;max-width:min(78%,720px);flex-direction:column;align-items:flex-end}.chat-user-wrap .chat-bubble{max-width:100%}.chat-bubble{max-width:min(78%,720px);padding:12px 16px;border-radius:18px;background:#e9e7df;color:var(--ink);white-space:pre-wrap}.message-delivery{display:flex;align-items:center;gap:5px;min-height:17px;margin:3px 7px 0;color:var(--faint);font-size:10px}.message-delivery     .composer{grid-row:3;position:relative;z-index:5;min-height:132px;padding:10px 18px 18px;border-top:1px solid rgba(221,220,213,.8);background:var(--page)}.composer-inner{width:min(100%,820px);margin:auto}.composer-card{position:relative;padding:10px 12px 9px;border:1px solid #cbc9c0;border-radius:18px;background:#fff;box-shadow:var(--shadow)}.composer textarea{display:block;width:100%;min-height:72px;max-height:82px;padding:3px 50px 3px 3px;border:0;resize:none;background:transparent;color:var(--ink);outline:0;line-height:1.5}.composer textarea::placeholder{color:#9c9991}.composer textarea:disabled{opacity:.55}.send{position:absolute;right:11px;bottom:11px;width:38px;height:38px;border:0;border-radius:50%;background:#292825;color:white;font-size:18px;cursor:pointer}.send:hover{background:var(--accent)}.send:disabled{background:#c8c5bd;cursor:not-allowed}.composer-foot{display:flex;justify-content:space-between;align-items:center;padding:7px 5px 0;color:var(--muted);font-size:11px}.submit-option{display:flex;align-items:center;gap:5px}.send-state{min-height:17px;color:var(--green)}
    .terminal-mode{display:none;position:absolute;inset:0;padding:10px;background:#111}.terminal-host{width:100%;height:100%;min-width:0;min-height:0;overflow:hidden}.terminal-host .xterm{height:100%;padding:0}.terminal-host .xterm-viewport{overflow-y:auto!important}.terminal-keys{display:none;min-width:0;background:#181818;border-top:1px solid #333}.terminal-key-scroll{display:flex;gap:6px;overflow-x:auto;padding:7px 8px;overscroll-behavior-x:contain;scrollbar-width:none}.terminal-key-scroll::-webkit-scrollbar{display:none}.terminal-key{flex:0 0 auto;min-width:43px;height:38px;padding:0 10px;border:1px solid #454545;border-radius:8px;background:#292929;color:#eee;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:manipulation}.terminal-key.active{border-color:#c96442;background:#6b3424;color:#fff}.terminal-pad{position:relative;display:grid;place-items:center;flex-basis:62px;min-width:62px;color:#aaa}.terminal-pad::after{content:'↕↔';font-size:16px}.terminal-pad.holding{border-color:#4f9a65;background:#24452d;color:#fff}.app.terminal-view .scroll,.app.terminal-view .jump{display:none}.app.terminal-view .terminal-mode{display:grid;grid-template-rows:minmax(0,1fr) auto}.app.terminal-view .conversation{background:#111}.app.terminal-view .main{grid-template-rows:58px minmax(0,1fr) 0}.app.terminal-view .composer{display:none;min-height:0;padding:0;border:0;overflow:hidden}
    .main:fullscreen,.main.fullscreen-fallback{width:100vw;height:100vh;background:var(--page)}.main:fullscreen .topbar,.main.fullscreen-fallback .topbar{padding-left:20px}.app.fullscreen-fallback{display:block}.app.fullscreen-fallback .sidebar{display:none}.app.fullscreen-fallback .main{position:fixed;z-index:100;inset:0}.main:fullscreen .fullscreen-btn,.main.fullscreen-fallback .fullscreen-btn{background:#292825;color:#fff;border-color:#292825}
    @media(max-width:760px){html,body{height:var(--visual-height)}.app,.app.sidebar-collapsed{position:fixed;top:var(--visual-top);left:0;right:0;height:var(--visual-height);grid-template-columns:1fr}.sidebar,.app.sidebar-collapsed .sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:min(86vw,330px);opacity:1;pointer-events:auto;transform:translateX(-105%);box-shadow:18px 0 50px rgba(0,0,0,.18)}.sidebar.open{transform:none}.sidebar-open,.app.sidebar-collapsed .sidebar-open{display:inline-grid;place-items:center}.drawer-backdrop.show{display:block;position:fixed;z-index:19;inset:0;background:rgba(20,20,18,.35)}.topbar{height:58px;padding:0 10px;gap:8px}.session-sub{max-width:58vw}.status-text{display:none}.top-actions{gap:5px}.fullscreen-btn{width:36px;padding:0;font-size:0}.fullscreen-btn::after{content:'⛶';font-size:18px}.scroll{padding:16px 0 calc(24px + env(safe-area-inset-bottom))}.message-shell,.transcript{width:calc(100% - 18px)}.capture-output{padding:14px 12px;font-size:11px}.chat-bubble{max-width:90%}.assistant-body{font-size:14px;line-height:1.55}.assistant-body table{font-size:12px}.assistant-body th,.assistant-body td{padding:6px 8px}.main{grid-template-rows:58px minmax(0,1fr) calc(126px + env(safe-area-inset-bottom))}.composer{min-height:126px;padding:8px 9px calc(9px + env(safe-area-inset-bottom))}.composer-card{border-radius:15px}.composer textarea{min-height:62px;max-height:72px}.composer-foot{padding-top:5px}.composer-foot span:first-child{display:none}.submit-option{font-size:10px}.terminal-mode{padding:4px}.app.mobile-composing .main{grid-template-rows:0 minmax(44px,1fr) 112px}.app.mobile-composing .topbar{visibility:hidden;overflow:hidden;height:0;border:0}.app.mobile-composing .composer{min-height:112px;padding:7px 8px 6px;background:#f7f7f5;box-shadow:0 -8px 24px rgba(32,31,28,.08)}.app.mobile-composing .composer textarea{min-height:56px;max-height:64px}.app.mobile-composing .composer-foot{padding-top:3px}.app.mobile-composing .scroll{padding-top:8px;padding-bottom:8px}.app.mobile-composing .sidebar,.app.mobile-composing .drawer-backdrop{display:none}}
    @media(max-width:760px){html,body{width:100%;max-width:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}.app,.app.sidebar-collapsed,.main{width:100%;max-width:100vw;min-width:0}.conversation,.scroll,.chat-message{min-width:0;max-width:100%}.scroll{scrollbar-gutter:auto}.message-shell,.transcript{width:calc(100% - 28px);max-width:100%;overflow-wrap:anywhere}.chat-message{margin-bottom:14px}.chat-bubble{max-width:88%;padding:10px 13px}.assistant-body{width:auto;max-width:94%;min-width:0;padding:11px 13px;border-radius:15px;font-size:13.5px;line-height:1.52}.assistant-body img,.assistant-body video,.assistant-body svg{max-width:100%;height:auto}.terminal-frame,.assistant-body pre,.assistant-body table{max-width:100%;overflow-x:auto}.assistant-body table{font-size:11.5px}.assistant-body th,.assistant-body td{padding:5px 7px}.capture-output{padding:12px 10px;font-size:10.5px}.composer{min-width:0;padding-left:12px;padding-right:12px}.composer-inner{width:100%;max-width:100%}.composer textarea{font-size:16px}.app.terminal-view .terminal-mode{padding:0;grid-template-rows:minmax(0,1fr) auto}.terminal-keys{display:block;padding-bottom:env(safe-area-inset-bottom)}.terminal-host .xterm{padding:3px}.terminal-key{height:40px;min-width:45px}}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <header class="brand"><div><div class="brand-name">Tmux Chat</div><div class="brand-sub">本机实时会话</div></div><div class="brand-actions"><a class="icon-btn" href="/hosts" title="远程主机" style="display:grid;place-items:center;text-decoration:none">⌁</a><a class="icon-btn" href="/shares" title="管理分享" style="display:grid;place-items:center;text-decoration:none">⇧</a><button class="icon-btn" id="refresh" title="刷新窗口">↻</button><button class="icon-btn" id="sidebar-close" title="折叠侧边栏">‹</button></div></header>
    <div class="mode-switch"><button class="mode-btn active" id="chat-mode">聊天</button><button class="mode-btn" id="terminal-mode-button">终端</button></div>
    <nav class="pane-list" id="pane-list" aria-label="Tmux panes"></nav>
    <footer class="side-foot"><span id="pane-count">0 panes</span><form method="post" action="/logout"><button class="logout">退出</button></form></footer>
  </aside>
  <main class="main" id="main">
    <header class="topbar"><div style="display:flex;align-items:center;min-width:0"><button class="icon-btn sidebar-open" id="menu" title="展开侧边栏">☰</button><div class="session"><div class="session-title" id="selected-title">选择一个会话</div><div class="session-sub" id="selected-sub">从左侧选择 tmux pane</div></div></div><div class="top-actions"><div class="status"><span class="status-dot" id="status-dot"></span><span class="status-text" id="status-text">未连接</span></div><button class="share-btn" id="share-button" disabled>分享</button><button class="fullscreen-btn" id="fullscreen" title="全屏显示当前窗口">对话全屏</button></div></header>
    <div class="error-banner" id="error"></div>
    <section class="conversation"><div class="scroll" id="scroll"><div class="empty" id="empty"><div><strong>选择一个 tmux 会话</strong>实时查看内容，并在下方继续输入</div></div><div class="transcript" id="transcript"></div><div class="message-shell" id="message-shell" hidden><div class="agent-label"><span class="agent-mark" id="agent-mark">T</span><span id="agent-name">tmux</span></div><div class="terminal-frame"><pre class="capture-output" id="terminal"></pre></div></div></div><button class="jump" id="jump">回到最新 ↓</button><div class="terminal-mode" id="terminal-mode"><div class="terminal-host" id="terminal-host"></div><div class="terminal-keys" id="terminal-keys"><div class="terminal-key-scroll"><button class="terminal-key" data-key="Escape">Esc</button><button class="terminal-key" data-mod="ctrl">Ctrl</button><button class="terminal-key" data-mod="alt">Alt</button><button class="terminal-key" data-key="Tab">Tab</button><button class="terminal-key" data-key="ArrowLeft">←</button><button class="terminal-key" data-key="ArrowUp">↑</button><button class="terminal-key" data-key="ArrowDown">↓</button><button class="terminal-key" data-key="ArrowRight">→</button><button class="terminal-key terminal-pad" id="terminal-pad" aria-label="长按并滑动方向"></button><button class="terminal-key" data-key="PageUp">PgUp</button><button class="terminal-key" data-key="PageDown">PgDn</button><button class="terminal-key" data-key="Home">Home</button><button class="terminal-key" data-key="End">End</button><button class="terminal-key" data-key="c">C</button><button class="terminal-key" data-key="d">D</button><button class="terminal-key" data-key="l">L</button><button class="terminal-key" data-key="z">Z</button><button class="terminal-key" data-key="Enter">Enter</button></div></div></div></section>
    <section class="composer"><div class="composer-inner"><div class="composer-card"><textarea id="input" disabled placeholder="选择会话后，在这里输入消息…"></textarea><button class="send" id="send" disabled title="发送">↑</button></div><div class="composer-foot"><span>Enter 发送 · Shift + Enter 换行</span><span class="send-state" id="send-state"></span><label class="submit-option"><input type="checkbox" id="submit-enter" checked> 同时按 Enter 提交</label></div></div></section>
  </main>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
</div>
<dialog class="share-dialog" id="share-dialog"><form class="share-form" id="share-form"><h2>分享 Claude 对话</h2><p>访客只能查看并继续这一个会话，不能访问其他 pane 或终端。</p><div class="share-grid"><label class="share-field full">分享路径<input id="share-slug" required pattern="[a-z0-9][a-z0-9-]{2,47}" placeholder="share001"></label><label class="share-field">有效期<select id="share-expiry"><option value="3600">1 小时</option><option value="86400" selected>1 天</option><option value="604800">7 天</option><option value="2592000">30 天</option></select></label><label class="share-field">访问密码（可选）<input id="share-password" type="password" autocomplete="new-password"></label></div><div class="share-result" id="share-result"></div><div class="share-actions"><button type="button" id="share-cancel">取消</button><button class="primary" type="submit">创建并复制链接</button></div></form></dialog>

<script type="module">
import {AnsiUp} from '/assets/ansi_up.js';
import {marked} from '/assets/marked.esm.js';
(() => {
  const ansi=new AnsiUp();
  const state={hosts:[],panes:[],treeOpen:new Set(),pendingMessages:new Map(),transcriptMessages:[],selected:null,ws:null,termWs:null,stick:true,mode:'chat',xterm:null,fit:null,resizeObserver:null,hiddenTimer:null,transcriptTimer:null,transcriptMtime:null,terminalMods:{ctrl:false,alt:false},viewportFitTimers:[]};
  const $=id=>document.getElementById(id),list=$('pane-list'),term=$('terminal'),scroll=$('scroll'),input=$('input'),send=$('send');

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function showError(msg){const el=$('error');el.textContent=msg;el.style.display=msg?'block':'none';}
  function isMobile(){return matchMedia('(max-width:760px)').matches;}
  function openSidebar(){if(isMobile()){$('sidebar').classList.add('open');$('drawer-backdrop').classList.add('show');}else{document.querySelector('.app').classList.remove('sidebar-collapsed');localStorage.setItem('tmux-sidebar-collapsed','0');}}
  function closeSidebar(){if(isMobile()){$('sidebar').classList.remove('open');$('drawer-backdrop').classList.remove('show');}else{document.querySelector('.app').classList.add('sidebar-collapsed');localStorage.setItem('tmux-sidebar-collapsed','1');}}

  function syncVisualViewport(){const viewport=window.visualViewport,height=viewport?viewport.height:window.innerHeight;document.documentElement.style.setProperty('--visual-height',`${Math.round(height)}px`);document.documentElement.style.setProperty('--visual-top',`${Math.round(viewport?.offsetTop||0)}px`);}

  function setComposing(active){if(!isMobile())return;document.querySelector('.app').classList.toggle('mobile-composing',active);syncVisualViewport();if(active)setTimeout(()=>{input.scrollIntoView({block:'nearest'});input.setSelectionRange(input.value.length,input.value.length);},60);}
  async function api(url,opts={}){const r=await fetch(url,opts);if(r.status===401){location='/login';throw new Error('登录已失效');}if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||`HTTP ${r.status}`);}return r.json();}
  async function loadPanes(){try{const d=await api('/api/hosts');state.hosts=d.hosts||[];state.panes=state.hosts.flatMap(host=>(host.panes||[]).map(p=>({...p,host_id:p.host_id||host.id})));const valid=new Set();for(const host of state.hosts){valid.add(host.id);for(const p of host.panes||[]){valid.add(`${host.id}/${p.session}`);valid.add(`${host.id}/${p.session}/${p.window}:${p.window_name||''}`);}}state.treeOpen=new Set([...state.treeOpen].filter(key=>valid.has(key)));localStorage.setItem('tmux-tree-open',JSON.stringify([...state.treeOpen]));$('pane-count').textContent=`${state.hosts.length} hosts · ${state.panes.length} panes`;renderList();if(state.selected&&!state.panes.some(p=>p.id===state.selected))selectPane(null);}catch(e){showError(e.message);}}
  function treeDetails(key,label,children,kind,count,extra=''){const open=state.treeOpen.has(key)?' open':'';return `<details class="tree-group tree-${kind}" data-tree="${esc(key)}"${open}><summary>${extra}<span class="tree-label">${esc(label)}</span><span class="tree-count">${count}</span></summary><div class="tree-children">${children}</div></details>`;}
  function renderList(){list.innerHTML=state.hosts.map(host=>{const sessions=new Map();for(const p of host.panes||[]){if(!sessions.has(p.session))sessions.set(p.session,new Map());const windows=sessions.get(p.session),windowKey=`${p.window}:${p.window_name||''}`;if(!windows.has(windowKey))windows.set(windowKey,[]);windows.get(windowKey).push(p);}const sessionHtml=[...sessions].map(([session,windows])=>{const windowHtml=[...windows].map(([windowKey,panes])=>{const first=panes[0],label=`${first.window}${first.window_name?': '+first.window_name:''}`,leaves=panes.map(p=>`<button class="pane ${p.id===state.selected?'selected':''}" data-pane="${esc(p.id)}"><div class="pane-row"><span class="dot ${p.active?'active':''}"></span><span class="pane-target">pane ${esc(p.index)} · ${esc(p.command)}</span></div><div class="pane-title">${esc(p.title||'(无标题)')}</div><div class="pane-meta">${esc(p.path)}</div></button>`).join('');return treeDetails(`${host.id}/${session}/${windowKey}`,label,leaves,'window',`${panes.length}`);}).join('');return treeDetails(`${host.id}/${session}`,session,windowHtml,'session',`${windows.size} windows`);}).join('');return treeDetails(host.id,host.name||host.id,sessionHtml,'host',`${(host.panes||[]).length}`,`<span class="host-icon">⌘</span><span class="host-status"></span>`);}).join('');}
  function closeConnections(){state.viewportFitTimers.forEach(clearTimeout);state.viewportFitTimers=[];if(state.ws){state.ws.close();state.ws=null;}if(state.termWs){state.termWs.close();state.termWs=null;}if(state.transcriptTimer){clearTimeout(state.transcriptTimer);state.transcriptTimer=null;}if(state.resizeObserver){state.resizeObserver.disconnect();state.resizeObserver=null;}if(state.xterm){state.xterm.dispose();state.xterm=null;state.fit=null;$('terminal-host').innerHTML='';}}
  function selectPane(id){closeConnections();state.selected=id;state.transcriptMtime=null;state.transcriptMessages=[];renderList();term.textContent='';$('transcript').innerHTML='';$('transcript').classList.remove('active');$('message-shell').hidden=!id;$('empty').style.display=id?'none':'grid';input.disabled=!id;send.disabled=!id;$('status-dot').className='status-dot';$('status-text').textContent=id?'连接中…':'未连接';if(!id){$('selected-title').textContent='选择一个会话';$('selected-sub').textContent='从左侧选择 tmux pane';return;}const p=state.panes.find(x=>x.id===id);$('selected-title').textContent=p.title||p.target;$('selected-sub').textContent=`${p.target} · ${p.command} · ${p.path}`;$('agent-name').textContent=p.command;$('agent-mark').textContent=(p.command||'T')[0].toUpperCase();$('share-button').disabled=p.command!=='claude'||p.host_id!=='localhost';state.mode==='terminal'?connectTerminal(id):connectTranscript(id,true);if(state.mode==='chat'&&!isMobile())input.focus();$('sidebar').classList.remove('open');}
  function atBottom(){return scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<90;}
  function htmlEscape(value){return value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function stripAnsi(value){return value.replace(/\x1b(?:\[[0-?]*[ -/]*[@-~]|\][^\x07]*(?:\x07|\x1b\\))/g,'');}

  function terminalWidth(ch){const cp=ch.codePointAt(0);if(/\p{Mark}/u.test(ch)||cp===0x200d||cp===0xfe0f)return 0;return cp>=0x1100&&(cp<=0x115f||cp===0x2329||cp===0x232a||(cp>=0x2e80&&cp<=0xa4cf&&cp!==0x303f)||(cp>=0xac00&&cp<=0xd7a3)||(cp>=0xf900&&cp<=0xfaff)||(cp>=0xfe10&&cp<=0xfe19)||(cp>=0xfe30&&cp<=0xfe6f)||(cp>=0xff00&&cp<=0xff60)||(cp>=0xffe0&&cp<=0xffe6)||(cp>=0x1f300&&cp<=0x1faff)||(cp>=0x20000&&cp<=0x3fffd))?2:1;}
  function isTableLine(line){const plain=stripAnsi(line);return /[┌┬┐├┼┤└┴┘│─]/u.test(plain);}
  function renderTableLine(line){const plain=stripAnsi(line),cells=[];for(const ch of plain){const width=terminalWidth(ch),kind=width===2?' wide':width===0?' zero':'';cells.push(`<span class="terminal-cell${kind}">${ch===' '? '&nbsp;':htmlEscape(ch)}</span>`);}return `<span class="terminal-table-line">${cells.join('')}</span>`;}
  function renderCapture(content){return cleanDisplayAnsi(content).split('\n').map(line=>isTableLine(line)?renderTableLine(line):ansi.ansi_to_html(line)).join('\n');}
  function markdown(value){return marked.parse(value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),{gfm:true,breaks:false,async:false});}
  function messageTextKey(text){return String(text).replace(/\r\n/g,'\n').trimEnd();}
  function reconcilePending(messages){for(const [localId,pending] of state.pendingMessages){if(pending.pane!==state.selected||pending.status==='failed')continue;const match=messages.find(message=>message.role==='user'&&!pending.baselineIds.has(String(message.id))&&messageTextKey(message.text).includes(messageTextKey(pending.text)));if(match)state.pendingMessages.delete(localId);}}
  function deliveryHtml(pending){if(pending.status==='sending')return `<span class="message-delivery"><span class="pending-wave"><i></i><i></i><i></i></span>发送中</span>`;if(pending.status==='sent')return `<span class="message-delivery sent">已发送 ✓</span>`;return `<span class="message-delivery failed">发送失败</span>`;}
  function renderTranscript(messages=state.transcriptMessages){state.transcriptMessages=messages;reconcilePending(messages);const host=$('transcript'),formal=messages.map(message=>message.role==='user'?`<article class="chat-message user" data-id="${esc(message.id)}"><div class="chat-user-wrap"><div class="chat-bubble">${htmlEscape(message.text)}</div></div></article>`:`<article class="chat-message assistant" data-id="${esc(message.id)}"><div class="assistant-body">${markdown(message.text)}</div></article>`),pending=[...state.pendingMessages].filter(([,message])=>message.pane===state.selected).map(([localId,message])=>`<article class="chat-message user pending" data-id="${esc(localId)}"><div class="chat-user-wrap"><div class="chat-bubble">${htmlEscape(message.text)}</div>${deliveryHtml(message)}</div></article>`);host.classList.add('active');$('message-shell').hidden=true;host.innerHTML=[...formal,...pending].join('');}
  function addOptimisticMessage(text){const localId=`pending-${Date.now()}-${Math.random().toString(36).slice(2)}`,baselineIds=new Set(state.transcriptMessages.map(message=>String(message.id)));state.pendingMessages.set(localId,{pane:state.selected,text,status:'sending',baselineIds});renderTranscript();requestAnimationFrame(()=>{scroll.scrollTop=scroll.scrollHeight;state.stick=true;});return localId;}
  function setOptimisticStatus(localId,status){const pending=state.pendingMessages.get(localId);if(!pending)return;pending.status=status;renderTranscript();requestAnimationFrame(()=>scroll.scrollTop=scroll.scrollHeight);}
  async function refreshTranscript(id){if(state.selected!==id||state.mode!=='chat')return;const follow=atBottom(),first=state.transcriptMtime===null;try{const d=await api(`/api/panes/${encodeURIComponent(id)}/transcript?limit=300`);if(state.selected!==id||state.mode!=='chat')return;showError('');$('status-dot').className='status-dot live';if(d.mtime!==state.transcriptMtime){state.transcriptMtime=d.mtime;renderTranscript(d.messages);$('status-text').textContent=`${d.provider} transcript`;if(follow||first)requestAnimationFrame(()=>scroll.scrollTop=scroll.scrollHeight);}}catch(e){if(state.selected===id&&state.mode==='chat')showError(e.message);}finally{if(state.selected===id&&state.mode==='chat'&&$('transcript').classList.contains('active'))state.transcriptTimer=setTimeout(()=>refreshTranscript(id),1000);}}
  async function connectTranscript(id,allowFallback=false){$('message-shell').hidden=true;$('transcript').classList.add('active');$('status-dot').className='status-dot live';$('status-text').textContent='读取 transcript…';try{const d=await api(`/api/panes/${encodeURIComponent(id)}/transcript?limit=300`);if(state.selected!==id||state.mode!=='chat')return;showError('');state.transcriptMtime=d.mtime;renderTranscript(d.messages);$('status-text').textContent=`${d.provider} transcript`;requestAnimationFrame(()=>scroll.scrollTop=scroll.scrollHeight);state.transcriptTimer=setTimeout(()=>refreshTranscript(id),1000);}catch(e){if(state.selected!==id||state.mode!=='chat')return;$('transcript').classList.remove('active');if(allowFallback){showError('');connect(id);}else showError(e.message);}}
  function fitCapture(){const p=state.panes.find(x=>x.id===state.selected);if(!p||!term.parentElement)return;const available=term.parentElement.clientWidth-44,base=7.83,columns=Math.max(p.width||120,20),ideal=Math.floor(available/columns);term.style.fontSize=Math.max(8,Math.min(13,ideal/base*13))+'px';}
  function connect(id){$('transcript').classList.remove('active');$('message-shell').hidden=false;const proto=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${proto}://${location.host}/ws/panes/${encodeURIComponent(id)}`);state.ws=ws;ws.onopen=()=>{if(state.ws!==ws||state.selected!==id||state.mode!=='chat')return;showError('');$('status-dot').className='status-dot live';$('status-text').textContent='彩色文本实时显示';};ws.onmessage=e=>{if(state.ws!==ws||state.selected!==id||state.mode!=='chat')return;const d=JSON.parse(e.data);if(d.type==='capture'){const follow=state.stick&&atBottom(),oldTop=scroll.scrollTop,oldHeight=scroll.scrollHeight;term.innerHTML=renderCapture(d.content);fitCapture();showError('');if(follow){scroll.scrollTop=scroll.scrollHeight;state.stick=true;$('jump').style.display='none';}else{scroll.scrollTop=oldTop+(scroll.scrollHeight-oldHeight);state.stick=false;$('jump').style.display='block';}}};ws.onclose=()=>{if(state.ws!==ws||state.selected!==id||state.mode!=='chat')return;state.ws=null;$('status-dot').className='status-dot';$('status-text').textContent='重连中…';setTimeout(()=>{if(!state.ws&&state.selected===id&&state.mode==='chat')connect(id);},1500);};ws.onerror=()=>{if(state.ws===ws&&state.selected===id&&state.mode==='chat')showError('实时连接失败，正在重试');};}
  function connectTerminal(id){
    const xterm=new Terminal({cursorBlink:true,disableStdin:false,convertEol:false,scrollback:10000,fontSize:13,fontFamily:'ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace',theme:{background:'#111111',foreground:'#e7e5df',cursor:'#faf9f5',selectionBackground:'#5a574f88'}}),fit=new FitAddon.FitAddon();
    state.xterm=xterm;state.fit=fit;xterm.loadAddon(fit);xterm.open($('terminal-host'));fit.fit();

    const proto=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${proto}://${location.host}/ws/terminal/${encodeURIComponent(id)}?cols=${xterm.cols}&rows=${xterm.rows}`);state.termWs=ws;ws.binaryType='arraybuffer';
    const resize=()=>{if(!state.fit||state.xterm!==xterm)return;fit.fit();if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'resize',cols:xterm.cols,rows:xterm.rows}));};

    ws.onmessage=e=>xterm.write(typeof e.data==='string'?e.data:new Uint8Array(e.data));
    ws.onclose=()=>{if(state.selected===id){$('status-dot').className='status-dot';$('status-text').textContent='显示已断开';}};
    ws.onerror=()=>showError('终端连接失败');xterm.onData(data=>{if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'input',data}));});
  }
  const terminalSequences={Escape:'\x1b',Tab:'\t',Enter:'\r',ArrowUp:'\x1b[A',ArrowDown:'\x1b[B',ArrowRight:'\x1b[C',ArrowLeft:'\x1b[D',PageUp:'\x1b[5~',PageDown:'\x1b[6~',Home:'\x1b[H',End:'\x1b[F'};
  function updateTerminalMods(){document.querySelectorAll('[data-mod]').forEach(button=>button.classList.toggle('active',!!state.terminalMods[button.dataset.mod]));}
  function sendTerminalKey(key){if(state.mode!=='terminal'||state.termWs?.readyState!==WebSocket.OPEN)return;let data=terminalSequences[key]||key;if(state.terminalMods.ctrl&&key.length===1)data=String.fromCharCode(key.toUpperCase().charCodeAt(0)&31);if(state.terminalMods.alt)data='\x1b'+data;state.termWs.send(JSON.stringify({type:'input',data}));state.terminalMods.ctrl=false;state.terminalMods.alt=false;updateTerminalMods();}
  function setupTerminalControls(){const keys=$('terminal-keys'),pad=$('terminal-pad');keys.addEventListener('pointerdown',e=>{const button=e.target.closest('.terminal-key');if(!button||button===pad)return;e.preventDefault();if(button.dataset.mod){const mod=button.dataset.mod;state.terminalMods[mod]=!state.terminalMods[mod];updateTerminalMods();}else if(button.dataset.key)sendTerminalKey(button.dataset.key);});let holdTimer=null,holding=false,lastDirection='',origin=null;const stop=()=>{clearTimeout(holdTimer);holdTimer=null;holding=false;lastDirection='';origin=null;pad.classList.remove('holding');};pad.addEventListener('pointerdown',e=>{e.preventDefault();origin={x:e.clientX,y:e.clientY};pad.setPointerCapture(e.pointerId);holdTimer=setTimeout(()=>{holding=true;pad.classList.add('holding');navigator.vibrate?.(20);},280);});pad.addEventListener('pointermove',e=>{if(!holding||!origin)return;const dx=e.clientX-origin.x,dy=e.clientY-origin.y;if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;const direction=Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp');if(direction!==lastDirection){sendTerminalKey(direction);lastDirection=direction;origin={x:e.clientX,y:e.clientY};}});pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);}
  function setMode(mode){if(state.mode===mode)return;state.mode=mode;document.querySelector('.app').classList.toggle('terminal-view',mode==='terminal');$('chat-mode').classList.toggle('active',mode==='chat');$('terminal-mode-button').classList.toggle('active',mode==='terminal');closeConnections();if(state.selected)(mode==='terminal'?connectTerminal(state.selected):connectTranscript(state.selected,true));if(mode==='chat'&&state.selected&&!isMobile())input.focus();syncFullscreen();localStorage.setItem('tmux-web-mode',mode);}
  function isFullscreen(){return document.fullscreenElement===$('main')||$('main').classList.contains('fullscreen-fallback');}
  function syncFullscreen(){const active=isFullscreen();$('fullscreen').textContent=active?'退出全屏':(state.mode==='terminal'?'终端全屏':'对话全屏');setTimeout(()=>{if(state.fit&&state.termWs?.readyState===WebSocket.OPEN){state.fit.fit();state.termWs.send(JSON.stringify({type:'resize',cols:state.xterm.cols,rows:state.xterm.rows}));}},80);}
  async function toggleFullscreen(){const main=$('main'),app=document.querySelector('.app');if(isFullscreen()){if(document.fullscreenElement)await document.exitFullscreen();main.classList.remove('fullscreen-fallback');app.classList.remove('fullscreen-fallback');}else if(main.requestFullscreen){try{await main.requestFullscreen();}catch{main.classList.add('fullscreen-fallback');app.classList.add('fullscreen-fallback');}}else{main.classList.add('fullscreen-fallback');app.classList.add('fullscreen-fallback');}syncFullscreen();}
  async function sendInput(){const text=input.value,pane=state.selected;if(!pane||!text.trim())return;const localId=addOptimisticMessage(text);input.value='';input.style.height='auto';send.disabled=true;$('send-state').textContent='发送中…';try{await api(`/api/panes/${encodeURIComponent(pane)}/input`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,submit:$('submit-enter').checked})});setOptimisticStatus(localId,'sent');$('send-state').textContent='已发送 ✓';setTimeout(()=>$('send-state').textContent='',1200);showError('');if(!isMobile())input.focus();state.stick=true;}catch(e){setOptimisticStatus(localId,'failed');showError(e.message);$('send-state').textContent='发送失败';}finally{send.disabled=!state.selected;}}
  async function createShare(e){e.preventDefault();const result=$('share-result');result.textContent='创建中…';try{const d=await api('/api/shares',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pane_id:state.selected,slug:$('share-slug').value.trim(),password:$('share-password').value,expires_in:Number($('share-expiry').value)})});const url=new URL(d.url,location.origin).href;try{await navigator.clipboard.writeText(url);result.textContent=`已创建并复制：${url}`;}catch{result.textContent=`已创建：${url}`;}}catch(error){result.textContent=error.message;}}
  list.addEventListener('toggle',e=>{const d=e.target.closest('details[data-tree]');if(!d)return;d.open?state.treeOpen.add(d.dataset.tree):state.treeOpen.delete(d.dataset.tree);localStorage.setItem('tmux-tree-open',JSON.stringify([...state.treeOpen]));},true);list.onclick=e=>{const b=e.target.closest('[data-pane]');if(b){selectPane(b.dataset.pane);if(isMobile())closeSidebar();}};$('refresh').onclick=loadPanes;$('menu').onclick=openSidebar;$('sidebar-close').onclick=closeSidebar;$('drawer-backdrop').onclick=closeSidebar;$('chat-mode').onclick=()=>setMode('chat');$('terminal-mode-button').onclick=()=>setMode('terminal');$('fullscreen').onclick=toggleFullscreen;$('share-button').onclick=()=>{$('share-result').textContent='';$('share-slug').value=`share-${Date.now().toString(36)}`;$('share-dialog').showModal();};$('share-cancel').onclick=()=>$('share-dialog').close();$('share-form').onsubmit=createShare;document.addEventListener('fullscreenchange',syncFullscreen);document.addEventListener('visibilitychange',()=>{clearTimeout(state.hiddenTimer);if(document.hidden&&state.mode==='terminal')state.hiddenTimer=setTimeout(()=>{if(document.hidden&&state.mode==='terminal')setMode('chat');},15000);});window.addEventListener('beforeunload',closeConnections);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('sidebar').classList.contains('open'))closeSidebar();else if($('main').classList.contains('fullscreen-fallback'))toggleFullscreen();}});send.onclick=sendInput;input.addEventListener('focus',()=>setComposing(true));input.addEventListener('blur',()=>setTimeout(()=>setComposing(false),120));input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,82)+'px';};input.onkeydown=e=>{if(e.key!=='Enter'||e.shiftKey||e.isComposing||isMobile())return;e.preventDefault();sendInput();};scroll.addEventListener('wheel',()=>{state.stick=false;$('jump').style.display='block';},{passive:true});scroll.addEventListener('touchmove',()=>{state.stick=false;$('jump').style.display='block';},{passive:true});scroll.onscroll=()=>{state.stick=atBottom();$('jump').style.display=state.stick?'none':'block';};$('jump').onclick=()=>{state.stick=true;scroll.scrollTop=scroll.scrollHeight;$('jump').style.display='none';};window.addEventListener('resize',()=>{handleVisualViewportChange();if(!isMobile()){$('sidebar').classList.remove('open');$('drawer-backdrop').classList.remove('show');document.querySelector('.app').classList.remove('mobile-composing');}fitCapture();scheduleTerminalFit();});if(window.visualViewport){visualViewport.addEventListener('resize',handleVisualViewportChange);visualViewport.addEventListener('scroll',handleVisualViewportChange);}setupTerminalControls();syncVisualViewport();if(localStorage.getItem('tmux-sidebar-collapsed')==='1'&&!isMobile())document.querySelector('.app').classList.add('sidebar-collapsed');const saved=localStorage.getItem('tmux-web-mode');if(saved==='terminal')setMode('terminal');loadPanes();setInterval(loadPanes,5000);
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
})();
