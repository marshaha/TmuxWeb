<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>远程主机 · Tmux Chat</title><style>:root{--bg:#f7f7f5;--card:#fff;--ink:#242421;--muted:#73716b;--line:#dddcd5;--green:#4f9a65;--red:#b34b43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.top{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 max(14px,calc((100vw - 980px)/2));border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 24px),980px);margin:20px auto}.panel,.host{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}.panel h2{margin:0 0 4px}.hint{margin:0 0 16px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.field{display:grid;gap:5px;color:var(--muted);font-size:11px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:14px inherit}.field textarea{min-height:110px;resize:vertical;font-family:ui-monospace,monospace}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.actions button{height:40px;padding:0 15px;border:1px solid var(--line);border-radius:10px;background:#fff}.actions .primary{background:#292825;color:#fff}.fingerprint{display:none;margin-top:14px;padding:12px;border:1px solid #e4d5b8;border-radius:10px;background:#fff8e9}.fingerprint.show{display:block}.fp{margin:6px 0;font:13px ui-monospace,monospace;overflow-wrap:anywhere}.list{display:grid;gap:10px;margin-top:16px}.host{display:flex;align-items:center;justify-content:space-between;gap:12px}.host-title{font-weight:650}.meta{color:var(--muted);font-size:12px}.host button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--red)}.status{min-height:20px;margin-top:9px;color:var(--red);font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.field.name,.field.host{grid-column:1/-1}.host{align-items:flex-start}.wrap{margin-top:12px}}</style></head><body><header class="top"><strong>远程主机</strong><a href="/">← 返回控制台</a></header><main class="wrap"><section class="panel"><h2>添加 SSH 主机</h2><p class="hint">远端无需安装本服务，只需 SSH、tmux 和已有的 AI CLI。凭据在 localhost 加密保存。</p><form id="form"><div class="grid"><label class="field name">显示名称<input id="name" required placeholder="build-box"></label><label class="field host">主机/IP<input id="hostname" required placeholder="10.0.0.8"></label><label class="field">端口<input id="port" type="number" value="22" min="1" max="65535"></label><label class="field">用户名<input id="username" required placeholder="ubuntu"></label><label class="field">登录方式<select id="auth-type"><option value="key">私钥</option><option value="password">密码</option></select></label><label class="field full">密码或 OpenSSH 私钥<textarea id="credential" required placeholder="密码，或 -----BEGIN OPENSSH PRIVATE KEY-----"></textarea></label></div><div class="fingerprint" id="fingerprint"><strong>确认 SSH 主机指纹</strong><div class="fp" id="fp-value"></div><p class="hint">密码验证登录身份；此指纹验证服务器身份。请通过可信渠道核对，指纹变化时连接会被拒绝。</p><label class="field" style="display:flex;grid-auto-flow:column;justify-content:start;align-items:center"><input id="confirm-host-key" type="checkbox" style="width:auto"> 我已核对并确认此 SHA256 指纹</label></div><div class="status" id="status"></div><div class="actions"><button type="button" id="scan">1. 扫描指纹</button><button type="button" id="test" disabled>2. 测试联通</button><button class="primary" id="save" disabled>3. 确认并添加</button></div></form></section><section class="list" id="list"></section></main><script>(()=>{const $=id=>document.getElementById(id);let scanned=null;function detailText(detail){if(Array.isArray(detail))return detail.map(item=>`${(item.loc||[]).slice(1).join('.')||'字段'}：${item.msg}`).join('；');return detail||'请求失败'}async function api(url,opts={}){const r=await fetch(url,opts);if(r.status===401){location='/login';throw new Error('登录失效')}if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(detailText(d.detail)||`HTTP ${r.status}`)}return r.json()}function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const d=await api('/api/remote-hosts',{cache:'no-store'});$('list').innerHTML=d.hosts.length?d.hosts.map(h=>`<article class="host"><div><div class="host-title">${esc(h.name)}</div><div class="meta">${esc(h.username)}@${esc(h.hostname)}:${Number(h.port)} · ${h.auth_type==='key'?'私钥':'密码'}<br>${esc(h.fingerprint)}</div></div><button data-delete="${esc(h.id)}">删除</button></article>`).join(''):'<div class="host meta">还没有远程主机。</div>'}function data(){const fields={name:$('name'),hostname:$('hostname'),port:$('port'),username:$('username'),authType:$('auth-type'),credential:$('credential')};if(Object.values(fields).some(field=>!field))throw new Error('页面资源版本不一致，请刷新后重试');return{name:fields.name.value.trim(),hostname:fields.hostname.value.trim(),port:Number(fields.port.value),username:fields.username.value.trim(),auth_type:fields.authType.value,credential:fields.credential.value}}$('scan').onclick=async()=>{scanned=null;$('test').disabled=true;$('save').disabled=true;$('status').textContent='正在扫描 SSH 主机指纹…';try{scanned=await api('/api/remote-hosts/scan-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostname:data().hostname,port:data().port})});$('fp-value').textContent=`${scanned.algorithm}  ${scanned.fingerprint}`;$('fingerprint').classList.add('show');$('confirm-host-key').checked=false;$('status').textContent='请核对上方 SHA256 指纹，勾选确认后测试联通。';$('test').disabled=false;}catch(e){$('status').textContent=`扫描失败：${e.message}`}};
$('test').onclick=async()=>{if(!scanned)return;if(!$('confirm-host-key').checked){$('status').textContent='请先勾选“我已核对并确认此 SHA256 指纹”。';return;}$('test').disabled=true;$('save').disabled=true;$('status').textContent='正在测试 SSH 登录和远程 tmux…';try{const payload={...data(),host_key:scanned.host_key,fingerprint:scanned.fingerprint,confirm_fingerprint:scanned.fingerprint};const result=await api('/api/remote-hosts/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('status').textContent=`联通成功：SSH 正常，发现 ${result.pane_count} 个 pane，session：${result.sessions.join(', ')||'无'}`;$('save').disabled=false;}catch(error){$('status').textContent=`联通失败：${error.message}`}finally{$('test').disabled=false}};$('form').onsubmit=async e=>{e.preventDefault();if(!scanned||!$('confirm-host-key').checked){$('status').textContent='请先扫描并勾选确认 SSH 主机指纹。';return;}$('status').textContent='正在测试 SSH 并读取 tmux…';try{const payload={...data(),host_key:scanned.host_key,fingerprint:scanned.fingerprint,confirm_fingerprint:scanned.fingerprint};await api('/api/remote-hosts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('status').textContent='添加成功，主机将出现在左侧树中。';e.target.reset();$('port').value=22;$('fingerprint').classList.remove('show');$('test').disabled=true;$('save').disabled=true;scanned=null;load()}catch(error){$('status').textContent=`添加失败：${error.message}`}};$('list').onclick=async e=>{const b=e.target.closest('[data-delete]');if(b&&confirm('删除这台远程主机及其本地凭据？')){await api(`/api/remote-hosts/${b.dataset.delete}`,{method:'DELETE'});load()}};load().catch(e=>$('status').textContent=e.message)})();</script></body></html>
