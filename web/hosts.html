<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>远程主机 · Tmux Chat</title><link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml"><link rel="icon" href="/assets/app-icon-32.png" sizes="32x32" type="image/png"><style>:root{--bg:#f7f7f5;--card:#fff;--ink:#242421;--muted:#73716b;--line:#dddcd5;--green:#4f9a65;--red:#b34b43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.top{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 max(14px,calc((100vw - 980px)/2));border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 24px),980px);margin:20px auto}.panel,.host{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}.panel h2{margin:0 0 4px}.hint{margin:0 0 16px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.field{display:grid;gap:5px;grid-template-columns:minmax(0,1fr);color:var(--muted);font-size:11px}.field.host-row{display:grid;gap:5px;grid-template-columns:minmax(0,1fr);grid-column:1/-1}.toggle-line{grid-column:1/-1;display:flex;align-items:center;gap:7px;margin-top:-2px;color:var(--muted);font-size:11px;cursor:pointer}.toggle-line input{width:auto;margin:0;accent-color:var(--accent)}.masked{-webkit-text-security:disc;text-security:disc}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:14px inherit}.pending-fp{color:var(--accent);font-style:italic}.field textarea{min-height:110px;resize:vertical;font-family:ui-monospace,monospace}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.actions button{height:40px;padding:0 15px;border:1px solid var(--line);border-radius:10px;background:#fff}.actions .primary{background:#292825;color:#fff}.fp-note{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.6;overflow-wrap:anywhere}.fp-note .fp{font:12px ui-monospace,monospace;color:var(--ink);word-break:break-all}.fp-note .hint{display:inline;margin:0 0 0 4px;font-size:11px}.secret{position:relative;display:block}.secret .eye{position:absolute;right:8px;top:7px;display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}.secret .eye:hover{background:#f2f0ea;color:var(--ink)}.secret .eye svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.secret .eye[aria-pressed="true"]{color:var(--accent)}.secret input[type="password"],.secret input[type="text"]{padding-right:44px}.list{display:grid;gap:10px;margin-top:16px}.host{display:flex;align-items:center;justify-content:space-between;gap:12px}.host-title{font-weight:650}.meta{color:var(--muted);font-size:12px}.host button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--red)}.status{min-height:20px;margin-top:9px;color:var(--red);font-size:12px}.host-main{min-width:0;flex:1}.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.row-actions button{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:12px;cursor:pointer}.row-actions button:hover{border-color:#cbc9c0;background:#faf9f5}.row-actions button:disabled{opacity:.35;cursor:not-allowed}.row-actions button.danger{color:var(--red)}dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));background:#fff;color:var(--ink);box-shadow:0 24px 70px #0000002e}dialog::backdrop{background:#00000059}.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0}.dlg-head h2{margin:0;font-size:16px}.dlg-body{padding:14px 18px 0}.dlg-note{margin:8px 0 0;font-size:11.5px;color:var(--muted)}.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:16px 18px 18px}.dlg-actions button{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.dlg-actions .primary{background:#292825;color:#fff;border-color:#292825}.dlg-actions .primary:disabled{opacity:.5;cursor:not-allowed}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.field.name,.field.host-row{grid-column:1/-1}.host{align-items:flex-start}.wrap{margin-top:12px}}</style></head><body><header class="top"><strong>远程主机</strong><a href="/">← 返回控制台</a></header><main class="wrap"><section class="panel"><h2>添加 SSH 主机</h2><p class="hint">远端无需安装本服务，只需 SSH、tmux 和已有的 AI CLI。凭据在 localhost 加密保存。</p><form id="form"><div class="grid"><label class="field name">显示名称<input id="name" required placeholder="build-box"></label><label class="field host-row">主机/IP<input id="hostname" required placeholder="10.0.0.8"></label><label class="field">端口<input id="port" type="number" value="22" min="1" max="65535"></label><label class="field">用户名<input id="username" required placeholder="ubuntu"></label><label class="field">登录方式<select id="auth-type"><option value="key">私钥</option><option value="password">密码</option><option value="agent">本机密钥（SSH Agent）</option></select></label><label class="field full">跳板机<select id="jump-host"><option value="">直连（不经过跳板机）</option></select></label><label class="field full"><span id="credential-label">密码或 OpenSSH 私钥</span><span class="secret"><input id="credential-password" type="password" autocomplete="new-password" spellcheck="false" placeholder="SSH 密码" hidden><textarea id="credential-key" spellcheck="false" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea><span class="hint" id="credential-hint" hidden>直接使用本机 ~/.ssh 里的默认私钥或 ssh-agent 登录，前提是该公钥已在远端 ~/.ssh/authorized_keys 中；服务进程需要能读到 SSH_AUTH_SOCK。</span><button type="button" class="eye" id="toggle-secret" aria-label="显示密码" title="显示密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.6-6.5 9.5-6.5S21.5 12 21.5 12s-3.6 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg></button></span></label><label class="toggle-line"><input type="checkbox" id="show-secret"><span>显示凭据内容（密码/私钥）</span></label><label class="toggle-line"><input type="checkbox" id="skip-verify"><span>不校验连接直接保存（密码或密钥有误也能先存下来，稍后再改）</span></label></div><p class="fp-note" id="fp-note" hidden>主机指纹 <span class="fp" id="fp-value"></span><span class="hint">（首次连接自动记录；之后指纹变化会拒绝连接）</span></p><div class="status" id="status"></div><div class="actions"><button type="button" id="test">测试联通</button><button class="primary" id="save">添加主机</button></div></form></section><section class="list" id="list"></section></main><dialog id="edit-dialog"><form method="dialog" id="edit-form"><div class="dlg-head"><h2>编辑主机</h2><span class="meta" id="edit-fingerprint"></span></div><div class="dlg-body"><div class="grid"><label class="field name">显示名称<input id="edit-name" required maxlength="64"></label><label class="field host-row">主机/IP<input id="edit-hostname" required maxlength="255"></label><label class="field">端口<input id="edit-port" type="number" min="1" max="65535" required></label><label class="field">用户名<input id="edit-username" required maxlength="64"></label><label class="field">登录方式<select id="edit-auth-type"><option value="key">私钥</option><option value="password">密码</option><option value="agent">本机密钥（SSH Agent）</option></select></label><label class="field full">跳板机<select id="edit-jump-host"><option value="">直连（不经过跳板机）</option></select></label><label class="field full"><span id="edit-credential-label">密码或 OpenSSH 私钥</span><span class="secret"><input id="edit-credential-password" type="password" autocomplete="new-password" spellcheck="false"><textarea id="edit-credential-key" spellcheck="false" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea><button type="button" class="eye" id="edit-toggle-secret" aria-label="显示密码" title="显示密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.6-6.5 9.5-6.5S21.5 12 21.5 12s-3.6 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg></button></span><span class="dlg-note" id="edit-credential-hint">留空表示不修改已保存的凭据。</span></label><label class="toggle-line"><input type="checkbox" id="edit-show-secret"><span>显示凭据内容（密码/私钥）</span></label><label class="toggle-line"><input type="checkbox" id="edit-skip-verify"><span>不校验连接直接保存（密码或密钥有误也能先存下来，稍后再改）</span></label></div><p class="dlg-note" id="edit-note"></p><div class="status" id="edit-status"></div></div><div class="dlg-actions"><button type="button" id="edit-cancel">取消</button><button type="button" class="primary" id="edit-save">保存</button></div></form></dialog><script>(()=>{const $=id=>document.getElementById(id);let scanned=null;function detailText(detail){if(Array.isArray(detail))return detail.map(item=>`${(item.loc||[]).slice(1).join('.')||'字段'}：${item.msg}`).join('；');return detail||'请求失败'}async function api(url,opts={}){const r=await fetch(url,opts);if(r.status===401){location='/login';throw new Error('登录失效')}if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(detailText(d.detail)||`HTTP ${r.status}`)}return r.json()}function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fillJumpSelects(){const options=hosts.map(h=>`<option value="${esc(h.id)}">${esc(h.name)} · ${esc(h.hostname)}</option>`).join('');
  const direct='<option value="">直连（不经过跳板机）</option>';
  const add=$('jump-host');if(add&&add.dataset.filled!==String(hosts.length)){const keep=add.value;add.innerHTML=direct+options;add.value=keep;add.dataset.filled=String(hosts.length);}
  const edit=$('edit-jump-host');if(edit){const self=editing?editing.id:'';edit.innerHTML=direct+hosts.filter(h=>h.id!==self).map(h=>`<option value="${esc(h.id)}">${esc(h.name)} · ${esc(h.hostname)}</option>`).join('');}
}
async function load(){const d=await api('/api/remote-hosts',{cache:'no-store'});hosts=d.hosts;fillJumpSelects();$('list').innerHTML=d.hosts.length?d.hosts.map((h,i)=>`<article class="host"><div class="host-main"><div class="host-title">${esc(h.name)}</div><div class="meta">${esc(h.username)}@${esc(h.hostname)}:${Number(h.port)} · ${h.auth_type==='key'?'私钥':(h.auth_type==='agent'?'本机密钥':'密码')}<br>${h.fingerprint?esc(h.fingerprint):'<span class="pending-fp">指纹待首次连通时记录</span>'}${h.jump_host_id?` · 经由 ${esc((d.hosts.find(j=>j.id===h.jump_host_id)||{}).name||h.jump_host_id)}`:''}</div></div><div class="row-actions"><button data-move="up" data-id="${esc(h.id)}" title="上移" ${i===0?'disabled':''}>↑</button><button data-move="down" data-id="${esc(h.id)}" title="下移" ${i===d.hosts.length-1?'disabled':''}>↓</button><button data-edit="${esc(h.id)}">编辑</button><button data-delete="${esc(h.id)}" class="danger">删除</button></div></article>`).join(''):'<div class="host meta">还没有远程主机。</div>'}function authMode(){return $('auth-type').value;}
function credentialField(){const mode=authMode();if(mode==='password')return $('credential-password');if(mode==='key')return $('credential-key');return null;}
function syncAuthType(){const mode=authMode();const password=mode==='password';const key=mode==='key';const agent=mode==='agent';$('credential-password').hidden=!password;$('credential-key').hidden=!key;$('credential-label').hidden=agent;$('credential-hint').hidden=!agent;$('credential-label').textContent=password?'SSH 密码':'OpenSSH 私钥';$('credential-password').required=password;$('credential-key').required=key;$('toggle-secret').style.display=password?'grid':'none';}
function data(){const field=credentialField();const fields={name:$('name'),hostname:$('hostname'),port:$('port'),username:$('username'),authType:$('auth-type')};if(Object.values(fields).some(item=>!item)||(authMode()!=='agent'&&!field))throw new Error('页面资源版本不一致，请刷新后重试');fields.credential=field?field.value:'';return{name:fields.name.value.trim(),hostname:fields.hostname.value.trim(),port:Number(fields.port.value),username:fields.username.value.trim(),auth_type:fields.authType.value,credential:fields.credential,jump_host_id:($('jump-host')||{}).value||''}}// The host key is pinned on first contact (TOFU) instead of asking the user to
// tick a box: the fingerprint is recorded, shown, and any later change is refused.
let scannedFor='';
async function ensureScanned(quiet){const current=data();const key=`${current.hostname}:${current.port}`;
  if(scanned&&scannedFor===key)return scanned;
  if(!quiet)$('status').textContent='读取 SSH 主机指纹…';
  scanned=await api('/api/remote-hosts/scan-key',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({hostname:current.hostname,port:current.port})});
  scannedFor=key;$('fp-value').textContent=`${scanned.algorithm} ${scanned.fingerprint}`;$('fp-note').hidden=false;
  return scanned;}
function applySecret(show,passwordId,keyId){const password=$(passwordId),key=$(keyId);
  if(password&&password.type!==undefined)password.type=show?'text':'password';
  if(key)key.classList.toggle('masked',!show);}
$('show-secret').onchange=()=>{applySecret($('show-secret').checked,'credential-password','credential-key');
  $('toggle-secret').setAttribute('aria-pressed',String($('show-secret').checked));};
$('edit-show-secret').onchange=()=>{applySecret($('edit-show-secret').checked,'edit-credential-password','edit-credential-key');};
$('auth-type').onchange=()=>{syncAuthType();};
$('toggle-secret').onclick=()=>{const field=$('credential-password');const hidden=field.type==='password';
  field.type=hidden?'text':'password';$('toggle-secret').setAttribute('aria-pressed',String(hidden));
  const box=$('show-secret');if(box){box.checked=hidden;}
  if(box)applySecret(hidden,'credential-password','credential-key');
  $('toggle-secret').setAttribute('aria-label',hidden?'隐藏密码':'显示密码');
  $('toggle-secret').title=hidden?'隐藏密码':'显示密码';field.focus();};
syncAuthType();applySecret(false,'credential-password','credential-key');
$('test').onclick=async()=>{$('test').disabled=true;$('save').disabled=true;
  $('status').textContent='正在测试 SSH 登录和远程 tmux…';
  try{const scanning=await ensureScanned(true);const payload={...data(),host_key:scanning.host_key,fingerprint:scanning.fingerprint,confirm_fingerprint:scanning.fingerprint};const result=await api('/api/remote-hosts/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('status').textContent=`联通成功：SSH 正常，发现 ${result.pane_count} 个 pane，session：${result.sessions.join(', ')||'无'}`;$('save').disabled=false;}catch(error){$('status').textContent=`联通失败：${error.message}`}finally{$('test').disabled=false}};$('form').onsubmit=async e=>{e.preventDefault();const skipVerify=$('skip-verify').checked;
  $('status').textContent=skipVerify?'正在读取主机指纹…':'正在测试 SSH 并读取 tmux…';
  try{let scanning=null;
    try{scanning=await ensureScanned(true);}catch(error){
      if(!skipVerify)throw error;
      scanning={host_key:'',fingerprint:''};
      $('status').textContent='读取指纹失败，将在首次连通时自动记录。';}
    const payload={...data(),host_key:scanning.host_key,fingerprint:scanning.fingerprint,confirm_fingerprint:scanning.fingerprint,verify:!skipVerify};await api('/api/remote-hosts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('status').textContent=skipVerify?'已保存（未校验连接），修正凭据后可在列表里点「测试」确认。':'添加成功，主机将出现在左侧树中。';e.target.reset();$('port').value=22;$('show-secret').checked=false;$('skip-verify').checked=false;applySecret(false,'credential-password','credential-key');$('fp-note').hidden=true;$('test').disabled=false;$('save').disabled=false;scanned=null;scannedFor='';syncAuthType();load()}catch(error){$('status').textContent=`添加失败：${error.message}`}};let editing=null;let hosts=[];function editCredentialField(){const mode=$('edit-auth-type').value;if(mode==='password')return $('edit-credential-password');if(mode==='key')return $('edit-credential-key');return null}function syncEditAuth(){const mode=$('edit-auth-type').value;const password=mode==='password';const key=mode==='key';const agent=mode==='agent';$('edit-credential-password').hidden=!password;$('edit-credential-key').hidden=!key;$('edit-credential-label').hidden=agent;$('edit-credential-hint').hidden=agent;$('edit-credential-label').textContent=password?'SSH 密码（留空不修改）':'OpenSSH 私钥（留空不修改）';$('edit-toggle-secret').style.display=password?'grid':'none';$('edit-credential-password').required=false;$('edit-credential-key').required=false}
function openEdit(id){const h=hosts.find(item=>item.id===id);if(!h)return;editing={...h};$('edit-name').value=h.name;$('edit-hostname').value=h.hostname;$('edit-port').value=h.port;$('edit-username').value=h.username;$('edit-auth-type').value=h.auth_type;fillJumpSelects();if($('edit-jump-host'))$('edit-jump-host').value=h.jump_host_id||'';$('edit-credential-password').value='';$('edit-credential-key').value='';
$('edit-show-secret').checked=false;$('edit-skip-verify').checked=false;applySecret(false,'edit-credential-password','edit-credential-key');$('edit-fingerprint').textContent=h.fingerprint;$('edit-note').textContent='';$('edit-status').textContent='';syncEditAuth();$('edit-dialog').showModal()}
async function saveEdit(){const host=editing;if(!host)return;const mode=$('edit-auth-type').value;const field=editCredentialField();const payload={name:$('edit-name').value.trim(),hostname:$('edit-hostname').value.trim(),port:Number($('edit-port').value),username:$('edit-username').value.trim(),auth_type:mode,jump_host_id:($('edit-jump-host')||{}).value||''};const secret=field?field.value:'';if(secret)payload.credential=secret;const moved=payload.hostname!==host.hostname||payload.port!==Number(host.port);const skipVerify=$('edit-skip-verify').checked;
$('edit-save').disabled=true;$('edit-status').textContent=moved?'主机变了，正在重新确认指纹…':(skipVerify?'正在保存（不校验连接）…':'正在保存并测试连接…');
try{if(moved||!host.host_key){let scanning=null;
    try{scanning=await api('/api/remote-hosts/scan-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostname:payload.hostname,port:payload.port})});}
    catch(error){if(!skipVerify)throw error;scanning={host_key:'',fingerprint:''};$('edit-status').textContent='读取指纹失败，将在首次连通时自动记录。';}
    payload.host_key=scanning.host_key;payload.fingerprint=scanning.fingerprint}else{payload.host_key=host.host_key;payload.fingerprint=host.fingerprint}
payload.verify=!skipVerify;
await api(`/api/remote-hosts/${host.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('edit-dialog').close();await load();$('status').textContent=skipVerify?'已保存（未校验连接）。':'已保存。'}catch(error){$('edit-status').textContent=`保存失败：${error.message}（改动已回滚）`}finally{$('edit-save').disabled=false}}
$('edit-cancel').onclick=()=>$('edit-dialog').close();$('edit-save').onclick=saveEdit;$('edit-auth-type').onchange=syncEditAuth;$('edit-toggle-secret').onclick=()=>{const field=$('edit-credential-password');const shown=field.type==='text';field.type=shown?'password':'text';const box=$('edit-show-secret');if(box){box.checked=!shown;applySecret(!shown,'edit-credential-password','edit-credential-key');}$('edit-toggle-secret').setAttribute('aria-pressed',String(!shown))};$('edit-form').onsubmit=e=>{e.preventDefault();saveEdit()};
async function moveHost(id,direction){const order=hosts.map(item=>item.id);const index=order.indexOf(id);const target=direction==='up'?index-1:index+1;if(index<0||target<0||target>=order.length)return;order.splice(target,0,order.splice(index,1)[0]);try{await api('/api/remote-hosts/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:order})});await load()}catch(error){$('status').textContent=`排序失败：${error.message}`}}
$('list').onclick=async e=>{const edit=e.target.closest('[data-edit]');if(edit){openEdit(edit.dataset.edit);return}const move=e.target.closest('[data-move]');if(move){moveHost(move.dataset.id,move.dataset.move);return}const b=e.target.closest('[data-delete]');if(b&&confirm('删除这台远程主机及其本地凭据？')){await api(`/api/remote-hosts/${b.dataset.delete}`,{method:'DELETE'});load()}};load().catch(e=>$('status').textContent=e.message)})();</script></body></html>
