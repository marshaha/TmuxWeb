<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>远程主机 · Tmux Chat</title><link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml"><link rel="icon" href="/assets/app-icon-32.png" sizes="32x32" type="image/png"><style>:root{--bg:#f7f7f5;--card:#fff;--ink:#242421;--muted:#73716b;--line:#dddcd5;--green:#4f9a65;--red:#b34b43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.top{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 max(14px,calc((100vw - 980px)/2));border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 24px),980px);margin:20px auto}.panel,.host{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}.panel h2{margin:0 0 4px}.hint{margin:0 0 16px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.field{display:grid;gap:5px;color:var(--muted);font-size:11px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:14px inherit}.field textarea{min-height:110px;resize:vertical;font-family:ui-monospace,monospace}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.actions button{height:40px;padding:0 15px;border:1px solid var(--line);border-radius:10px;background:#fff}.actions .primary{background:#292825;color:#fff}.fp-note{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.6;overflow-wrap:anywhere}.fp-note .fp{font:12px ui-monospace,monospace;color:var(--ink);word-break:break-all}.fp-note .hint{display:inline;margin:0 0 0 4px;font-size:11px}.secret{position:relative;display:block}.secret .eye{position:absolute;right:8px;top:7px;display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}.secret .eye:hover{background:#f2f0ea;color:var(--ink)}.secret .eye svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.secret .eye[aria-pressed="true"]{color:var(--accent)}.secret input[type="password"],.secret input[type="text"]{padding-right:44px}.list{display:grid;gap:10px;margin-top:16px}.host{display:flex;align-items:center;justify-content:space-between;gap:12px}.host-title{font-weight:650}.meta{color:var(--muted);font-size:12px}.host button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--red)}.status{min-height:20px;margin-top:9px;color:var(--red);font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.field.name,.field.host{grid-column:1/-1}.host{align-items:flex-start}.wrap{margin-top:12px}}</style></head><body><header class="top"><strong>远程主机</strong><a href="/">← 返回控制台</a></header><main class="wrap"><section class="panel"><h2>添加 SSH 主机</h2><p class="hint">远端无需安装本服务，只需 SSH、tmux 和已有的 AI CLI。凭据在 localhost 加密保存。</p><form id="form"><div class="grid"><label class="field name">显示名称<input id="name" required placeholder="build-box"></label><label class="field host">主机/IP<input id="hostname" required placeholder="10.0.0.8"></label><label class="field">端口<input id="port" type="number" value="22" min="1" max="65535"></label><label class="field">用户名<input id="username" required placeholder="ubuntu"></label><label class="field">登录方式<select id="auth-type"><option value="key">私钥</option><option value="password">密码</option><option value="agent">本机密钥（SSH Agent）</option></select></label><label class="field full"><span id="credential-label">密码或 OpenSSH 私钥</span><span class="secret"><input id="credential-password" type="password" autocomplete="new-password" spellcheck="false" placeholder="SSH 密码" hidden><textarea id="credential-key" spellcheck="false" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea><span class="hint" id="credential-hint" hidden>直接使用本机 ~/.ssh 里的默认私钥或 ssh-agent 登录，前提是该公钥已在远端 ~/.ssh/authorized_keys 中；服务进程需要能读到 SSH_AUTH_SOCK。</span><button type="button" class="eye" id="toggle-secret" aria-label="显示密码" title="显示密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.6-6.5 9.5-6.5S21.5 12 21.5 12s-3.6 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg></button></span></label></div><p class="fp-note" id="fp-note" hidden>主机指纹 <span class="fp" id="fp-value"></span><span class="hint">（首次连接自动记录；之后指纹变化会拒绝连接）</span></p><div class="status" id="status"></div><div class="actions"><button type="button" id="test">测试联通</button><button class="primary" id="save">添加主机</button></div></form></section><section class="list" id="list"></section></main><script>(()=>{const $=id=>document.getElementById(id);let scanned=null;function detailText(detail){if(Array.isArray(detail))return detail.map(item=>`${(item.loc||[]).slice(1).join('.')||'字段'}：${item.msg}`).join('；');return detail||'请求失败'}async function api(url,opts={}){const r=await fetch(url,opts);if(r.status===401){location='/login';throw new Error('登录失效')}if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(detailText(d.detail)||`HTTP ${r.status}`)}return r.json()}function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const d=await api('/api/remote-hosts',{cache:'no-store'});$('list').innerHTML=d.hosts.length?d.hosts.map(h=>`<article class="host"><div><div class="host-title">${esc(h.name)}</div><div class="meta">${esc(h.username)}@${esc(h.hostname)}:${Number(h.port)} · ${h.auth_type==='key'?'私钥':(h.auth_type==='agent'?'本机密钥':'密码')}<br>${esc(h.fingerprint)}</div></div><button data-delete="${esc(h.id)}">删除</button></article>`).join(''):'<div class="host meta">还没有远程主机。</div>'}function authMode(){return $('auth-type').value;}
function credentialField(){const mode=authMode();if(mode==='password')return $('credential-password');if(mode==='key')return $('credential-key');return null;}
function syncAuthType(){const mode=authMode();const password=mode==='password';const key=mode==='key';const agent=mode==='agent';$('credential-password').hidden=!password;$('credential-key').hidden=!key;$('credential-label').hidden=agent;$('credential-hint').hidden=!agent;$('credential-label').textContent=password?'SSH 密码':'OpenSSH 私钥';$('credential-password').required=password;$('credential-key').required=key;$('toggle-secret').style.display=password?'grid':'none';}
function data(){const field=credentialField();const fields={name:$('name'),hostname:$('hostname'),port:$('port'),username:$('username'),authType:$('auth-type')};if(Object.values(fields).some(item=>!item)||(authMode()!=='agent'&&!field))throw new Error('页面资源版本不一致，请刷新后重试');fields.credential=field?field.value:'';return{name:fields.name.value.trim(),hostname:fields.hostname.value.trim(),port:Number(fields.port.value),username:fields.username.value.trim(),auth_type:fields.authType.value,credential:fields.credential}}// The host key is pinned on first contact (TOFU) instead of asking the user to
// tick a box: the fingerprint is recorded, shown, and any later change is refused.
let scannedFor='';
async function ensureScanned(quiet){const current=data();const key=`${current.hostname}:${current.port}`;
  if(scanned&&scannedFor===key)return scanned;
  if(!quiet)$('status').textContent='读取 SSH 主机指纹…';
  scanned=await api('/api/remote-hosts/scan-key',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({hostname:current.hostname,port:current.port})});
  scannedFor=key;$('fp-value').textContent=`${scanned.algorithm} ${scanned.fingerprint}`;$('fp-note').hidden=false;
  return scanned;}
$('auth-type').onchange=()=>{syncAuthType();};
$('toggle-secret').onclick=()=>{const field=$('credential-password');const hidden=field.type==='password';
  field.type=hidden?'text':'password';$('toggle-secret').setAttribute('aria-pressed',String(hidden));
  $('toggle-secret').setAttribute('aria-label',hidden?'隐藏密码':'显示密码');
  $('toggle-secret').title=hidden?'隐藏密码':'显示密码';field.focus();};
syncAuthType();
$('test').onclick=async()=>{$('test').disabled=true;$('save').disabled=true;
  $('status').textContent='正在测试 SSH 登录和远程 tmux…';
  try{const scanning=await ensureScanned(true);const payload={...data(),host_key:scanning.host_key,fingerprint:scanning.fingerprint,confirm_fingerprint:scanning.fingerprint};const result=await api('/api/remote-hosts/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('status').textContent=`联通成功：SSH 正常，发现 ${result.pane_count} 个 pane，session：${result.sessions.join(', ')||'无'}`;$('save').disabled=false;}catch(error){$('status').textContent=`联通失败：${error.message}`}finally{$('test').disabled=false}};$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='正在测试 SSH 并读取 tmux…';
  try{const scanning=await ensureScanned(true);const payload={...data(),host_key:scanning.host_key,fingerprint:scanning.fingerprint,confirm_fingerprint:scanning.fingerprint};await api('/api/remote-hosts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('status').textContent='添加成功，主机将出现在左侧树中。';e.target.reset();$('port').value=22;$('fp-note').hidden=true;$('test').disabled=false;$('save').disabled=false;scanned=null;scannedFor='';syncAuthType();load()}catch(error){$('status').textContent=`添加失败：${error.message}`}};$('list').onclick=async e=>{const b=e.target.closest('[data-delete]');if(b&&confirm('删除这台远程主机及其本地凭据？')){await api(`/api/remote-hosts/${b.dataset.delete}`,{method:'DELETE'});load()}};load().catch(e=>$('status').textContent=e.message)})();</script></body></html>
