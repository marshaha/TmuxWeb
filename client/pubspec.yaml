name: tmuxweb_client
description: Native Flutter client for TmuxWeb - talk to local and remote tmux AI sessions.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_markdown: ^0.7.4+2
  shared_preferences: ^2.3.2
  xterm: ^4.0.0
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  # Web socket + download support (package:web is only imported
  # from the web implementation; native builds never load it).
  web: ^1.1.0
  webview_flutter: ^4.14.1
  webview_windows: ^0.4.0
  desktop_drop: ^0.8.0
  # Pager drag-start haptic (web's navigator.vibrate(8) in bindPager).
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
